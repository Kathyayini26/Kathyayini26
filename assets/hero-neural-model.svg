<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="850" height="250">
  <defs>
    <linearGradient id="eng-hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816">
        <animate attributeName="stop-color" values="#050816; #070B1F; #0A1028; #050816" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#070B1F">
        <animate attributeName="stop-color" values="#070B1F; #0E122C; #06152B; #070B1F" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0A1028">
        <animate attributeName="stop-color" values="#0A1028; #050816; #070B1F; #0A1028" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="eng-hero-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <filter id="eng-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="node-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Frame -->
  <rect width="850" height="250" rx="16" fill="url(#eng-hero-bg)" stroke="url(#eng-hero-border)" stroke-width="1.8" />
  <rect x="0" y="0" width="850" height="4.5" rx="2.25" fill="url(#eng-hero-border)" filter="url(#eng-glow)" />

  <!-- Top Bar -->
  <g transform="translate(24, 18)">
    <circle cx="8" cy="8" r="4.5" fill="#FF5F56" />
    <circle cx="24" cy="8" r="4.5" fill="#FFBD2E" />
    <circle cx="40" cy="8" r="4.5" fill="#27C93F" />
    <text x="60" y="12" fill="#64748B" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700">AI_ENGINEER_DASHBOARD // KATHYAYINI_PRABHU</text>
    <text x="800" y="12" fill="#34D399" font-family="'Fira Code', monospace" font-size="10" font-weight="700" text-anchor="end">SYS.STATUS: ONLINE &#9679;</text>
  </g>

  <line x1="20" y1="42" x2="830" y2="42" stroke="#1E293B" stroke-width="1.2" />

  <!-- Left Details -->
  <g transform="translate(36, 52)">
    <rect x="0" y="8" width="5" height="136" rx="2.5" fill="#00F2FE" filter="url(#eng-glow)" />

    <text x="20" y="34" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="0.5">Kathyayini Prabhu</text>
    
    <text x="20" y="62" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="14.5" font-weight="700">Artificial Intelligence &amp; Data Science Engineer</text>
    
    <text x="20" y="88" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Transforming Data Into Intelligent Decisions</text>
    <text x="20" y="106" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Through AI, Analytics &amp; Software Systems</text>

    <!-- 4 Skill Pills: AI, ML, Data Science, SQL -->
    <g transform="translate(20, 122)">
      <rect width="112" height="24" rx="12" fill="#161B22" stroke="#00F2FE" stroke-width="1" />
      <text x="56" y="16" fill="#00F2FE" font-family="'Fira Code', monospace" font-size="8.5" font-weight="800" text-anchor="middle">ARTIFICIAL INTEL</text>

      <rect x="122" width="125" height="24" rx="12" fill="#161B22" stroke="#34D399" stroke-width="1" />
      <text x="184.5" y="16" fill="#34D399" font-family="'Fira Code', monospace" font-size="8.5" font-weight="800" text-anchor="middle">MACHINE LEARNING</text>

      <rect x="257" width="105" height="24" rx="12" fill="#161B22" stroke="#38BDF8" stroke-width="1" />
      <text x="309.5" y="16" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="8.5" font-weight="800" text-anchor="middle">DATA SCIENCE</text>

      <rect x="372" width="118" height="24" rx="12" fill="#161B22" stroke="#F59E0B" stroke-width="1" />
      <text x="431" y="16" fill="#F59E0B" font-family="'Fira Code', monospace" font-size="8.5" font-weight="800" text-anchor="middle">SQL &amp; DATABASES</text>
    </g>
  </g>

  <!-- Right Side: Neural Network Graph Model -->
  <g transform="translate(560, 50)">
    <rect width="255" height="175" rx="12" fill="#0D1117" stroke="#1E293B" stroke-width="1.4" filter="url(#eng-glow)" />

    <!-- Mini Header -->
    <g transform="translate(14, 16)">
      <circle cx="3" cy="3" r="3" fill="#00F2FE">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="12" y="7" fill="#00F2FE" font-family="'Fira Code', monospace" font-size="8.5" font-weight="800" letter-spacing="0.5">NEURAL GRAPH MODEL</text>
      <text x="227" y="7" fill="#34D399" font-family="'Fira Code', monospace" font-size="8" font-weight="700" text-anchor="end">4 LAYERS &#9679;</text>
    </g>
    <line x1="14" y1="28" x2="241" y2="28" stroke="#1E293B" stroke-width="1" />

    <!-- ========================================== -->
    <!-- SYNAPTIC CONNECTION EDGES (Layer to Layer) -->
    <!-- ========================================== -->
    <g stroke="#334155" stroke-width="0.9" opacity="0.65">
      <!-- Input (x=38) to Hidden 1 (x=95) -->
      <!-- Input 1 (y=55) -->
      <line x1="38" y1="55" x2="95" y2="45" />
      <line x1="38" y1="55" x2="95" y2="72" />
      <line x1="38" y1="55" x2="95" y2="100" />
      <line x1="38" y1="55" x2="95" y2="128" />

      <!-- Input 2 (y=90) -->
      <line x1="38" y1="90" x2="95" y2="45" />
      <line x1="38" y1="90" x2="95" y2="72" stroke="#00F2FE" stroke-width="1.2" opacity="0.8" />
      <line x1="38" y1="90" x2="95" y2="100" stroke="#818CF8" stroke-width="1.2" opacity="0.8" />
      <line x1="38" y1="90" x2="95" y2="128" />

      <!-- Input 3 (y=125) -->
      <line x1="38" y1="125" x2="95" y2="45" />
      <line x1="38" y1="125" x2="95" y2="72" />
      <line x1="38" y1="125" x2="95" y2="100" />
      <line x1="38" y1="125" x2="95" y2="128" />

      <!-- Hidden 1 (x=95) to Hidden 2 (x=156) -->
      <line x1="95" y1="45" x2="156" y2="55" stroke="#34D399" stroke-width="1.1" opacity="0.8" />
      <line x1="95" y1="45" x2="156" y2="90" />
      <line x1="95" y1="45" x2="156" y2="125" />

      <line x1="95" y1="72" x2="156" y2="55" />
      <line x1="95" y1="72" x2="156" y2="90" stroke="#00F2FE" stroke-width="1.2" opacity="0.9" />
      <line x1="95" y1="72" x2="156" y2="125" />

      <line x1="95" y1="100" x2="156" y2="55" />
      <line x1="95" y1="100" x2="156" y2="90" stroke="#C084FC" stroke-width="1.2" opacity="0.8" />
      <line x1="95" y1="100" x2="156" y2="125" stroke="#F59E0B" stroke-width="1.1" opacity="0.8" />

      <line x1="95" y1="128" x2="156" y2="55" />
      <line x1="95" y1="128" x2="156" y2="90" />
      <line x1="95" y1="128" x2="156" y2="125" />

      <!-- Hidden 2 (x=156) to Output (x=216) -->
      <line x1="156" y1="55" x2="216" y2="70" stroke="#34D399" stroke-width="1.3" opacity="0.9" />
      <line x1="156" y1="55" x2="216" y2="110" />

      <line x1="156" y1="90" x2="216" y2="70" stroke="#00F2FE" stroke-width="1.4" opacity="1" />
      <line x1="156" y1="90" x2="216" y2="110" stroke="#C084FC" stroke-width="1.4" opacity="1" />

      <line x1="156" y1="125" x2="216" y2="70" />
      <line x1="156" y1="125" x2="216" y2="110" stroke="#818CF8" stroke-width="1.3" opacity="0.9" />
    </g>

    <!-- Animated Firing Synaptic Particles -->
    <circle r="2" fill="#00F2FE" filter="url(#node-glow)">
      <animateMotion path="M 38 90 L 95 72 L 156 90 L 216 70" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle r="2" fill="#34D399" filter="url(#node-glow)">
      <animateMotion path="M 38 55 L 95 45 L 156 55 L 216 70" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle r="2" fill="#C084FC" filter="url(#node-glow)">
      <animateMotion path="M 38 125 L 95 100 L 156 125 L 216 110" dur="1.8s" repeatCount="indefinite" />
    </circle>

    <!-- ========================================== -->
    <!-- NODES (Input, Hidden, Output Layers)       -->
    <!-- ========================================== -->
    <!-- Layer 1: Input (Cyan) -->
    <g fill="#0D1117" stroke="#00F2FE" stroke-width="1.5" filter="url(#node-glow)">
      <circle cx="38" cy="55" r="7" />
      <circle cx="38" cy="90" r="8" />
      <circle cx="38" cy="125" r="7" />
    </g>
    <g fill="#00F2FE" font-family="'Fira Code', monospace" font-size="6" font-weight="800" text-anchor="middle">
      <text x="38" y="57.5">X₁</text>
      <text x="38" y="92.5">X₂</text>
      <text x="38" y="127.5">X₃</text>
    </g>

    <!-- Layer 2: Hidden Dense (Indigo / Blue) -->
    <g fill="#0D1117" stroke="#818CF8" stroke-width="1.5" filter="url(#node-glow)">
      <circle cx="95" cy="45" r="7" />
      <circle cx="95" cy="72" r="8" />
      <circle cx="95" cy="100" r="8" />
      <circle cx="95" cy="128" r="7" />
    </g>
    <g fill="#818CF8" font-family="'Fira Code', monospace" font-size="6" font-weight="800" text-anchor="middle">
      <text x="95" y="47.5">H₁</text>
      <text x="95" y="74.5">H₂</text>
      <text x="95" y="102.5">H₃</text>
      <text x="95" y="130.5">H₄</text>
    </g>

    <!-- Layer 3: Latent Representation (Purple / Violet) -->
    <g fill="#0D1117" stroke="#C084FC" stroke-width="1.5" filter="url(#node-glow)">
      <circle cx="156" cy="55" r="7" />
      <circle cx="156" cy="90" r="8.5" />
      <circle cx="156" cy="125" r="7" />
    </g>
    <g fill="#C084FC" font-family="'Fira Code', monospace" font-size="6" font-weight="800" text-anchor="middle">
      <text x="156" y="57.5">Z₁</text>
      <text x="156" y="93">Z₂</text>
      <text x="156" y="127.5">Z₃</text>
    </g>

    <!-- Layer 4: Output Intelligence (Mint Emerald) -->
    <g fill="#0D1117" stroke="#34D399" stroke-width="1.8" filter="url(#node-glow)">
      <circle cx="216" cy="70" r="8.5" />
      <circle cx="216" cy="110" r="8.5" />
    </g>
    <g fill="#34D399" font-family="'Fira Code', monospace" font-size="6.5" font-weight="800" text-anchor="middle">
      <text x="216" y="73">Y₁</text>
      <text x="216" y="113">Y₂</text>
    </g>

    <!-- Bottom Status Label -->
    <text x="127.5" y="162" fill="#34D399" font-family="'Fira Code', monospace" font-size="8" font-weight="700" text-anchor="middle">SYNAPSE FLOW: OPTIMAL &#10003;</text>
  </g>
</svg>