<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="100%" height="100%">
  <defs>
    <linearGradient id="att-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08071E" />
      <stop offset="100%" stop-color="#120F38" />
    </linearGradient>
  </defs>

  <rect width="420" height="220" rx="12" fill="url(#att-bg)" stroke="#818CF8" stroke-width="1.2" />

  <!-- Telemetry Header -->
  <g transform="translate(18, 22)">
    <circle cx="4" cy="0" r="3.5" fill="#818CF8" />
    <text x="14" y="3.5" fill="#818CF8" font-family="'Fira Code', monospace" font-size="9" font-weight="800" letter-spacing="0.5">VISION_BIOMETRIC // HEURISTIC_SOLVER</text>
    <text x="384" y="3.5" fill="#34D399" font-family="'Fira Code', monospace" font-size="8" font-weight="700" text-anchor="end">FACE_ID: VERIFIED &#9679;</text>
  </g>
  <line x1="18" y1="34" x2="402" y2="34" stroke="#1E293B" stroke-width="1" />

  <!-- Split Screen: Left = Face Mesh, Right = Timetable Constraint Blocks -->
  <g transform="translate(20, 50)">
    <!-- LEFT: Biometric Face Landmarker Mesh -->
    <g transform="translate(85, 55)">
      <!-- Reticle Corners -->
      <path d="M -50 -35 L -40 -35 M -50 -35 L -50 -25" stroke="#818CF8" stroke-width="1.5" fill="none" />
      <path d="M 50 -35 L 40 -35 M 50 -35 L 50 -25" stroke="#818CF8" stroke-width="1.5" fill="none" />
      <path d="M -50 45 L -40 45 M -50 45 L -50 35" stroke="#818CF8" stroke-width="1.5" fill="none" />
      <path d="M 50 45 L 40 45 M 50 45 L 50 35" stroke="#818CF8" stroke-width="1.5" fill="none" />

      <!-- Scanning Laser Line -->
      <line x1="-48" y1="-30" x2="48" y2="-30" stroke="#00F2FE" stroke-width="1.5" opacity="0.8">
        <animate attributeName="y1" values="-30;40;-30" dur="2.2s" repeatCount="indefinite" />
        <animate attributeName="y2" values="-30;40;-30" dur="2.2s" repeatCount="indefinite" />
      </line>

      <!-- Triangulated Mesh -->
      <polygon points="0,-20 -20,-5 20,-5" fill="none" stroke="#6366F1" stroke-width="1" />
      <polygon points="-20,-5 0,15 20,-5" fill="none" stroke="#6366F1" stroke-width="1" />
      <polygon points="0,15 -14,35 14,35" fill="none" stroke="#6366F1" stroke-width="1" />

      <circle cx="-20" cy="-5" r="2.5" fill="#34D399" />
      <circle cx="20" cy="-5" r="2.5" fill="#34D399" />
      <circle cx="0" cy="15" r="2.5" fill="#00F2FE" />
      <circle cx="0" cy="-20" r="2.5" fill="#818CF8" />
    </g>

    <!-- Vertical Divider -->
    <line x1="190" y1="10" x2="190" y2="115" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3" />

    <!-- RIGHT: Automated Timetable Constraint Solver Blocks -->
    <g transform="translate(210, 15)" font-family="'Fira Code', monospace" font-size="7.5">
      <text x="0" y="0" fill="#CBD5E1" font-weight="700">CONSTRAINT_SOLVER_MAP</text>

      <rect y="12" width="165" height="22" rx="4" fill="#161B22" stroke="#34D399" stroke-width="0.8" />
      <text x="10" y="27" fill="#34D399" font-weight="700">[MON 09:00] AI_LAB &#8594; RM_402</text>

      <rect y="40" width="165" height="22" rx="4" fill="#161B22" stroke="#818CF8" stroke-width="0.8" />
      <text x="10" y="55" fill="#818CF8" font-weight="700">[TUE 11:30] ML_THEORY &#8594; AUD_1</text>

      <rect y="68" width="165" height="22" rx="4" fill="#161B22" stroke="#00F2FE" stroke-width="0.8" />
      <text x="10" y="83" fill="#00F2FE" font-weight="700">[WED 14:00] DB_ENG &#8594; LAB_3</text>
    </g>
  </g>

  <!-- Bottom Telemetry -->
  <g transform="translate(18, 198)" font-family="'Fira Code', monospace" font-size="7.5" fill="#64748B">
    <text x="0" y="0">RECOGNITION_LATENCY: 42ms</text>
    <text x="175" y="0">SOLVER_STATUS: ZERO_CONFLICTS &#10003;</text>
    <text x="384" y="0" text-anchor="end">FPS: 60.0</text>
  </g>
</svg>