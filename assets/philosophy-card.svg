<svg fill="none" width="800" height="130" viewBox="0 0 800 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="philo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="philo-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Main Card Container -->
  <rect width="800" height="130" rx="12" fill="url(#philo-bg)" stroke="url(#philo-border)" stroke-width="1.2" />

  <!-- 3 Focus Columns -->
  <g transform="translate(30, 24)">
    <!-- Column 1: Problem Solver -->
    <g transform="translate(0, 0)">
      <rect width="220" height="80" rx="8" fill="#161B22" stroke="#3B82F6" stroke-width="1" />
      <text x="14" y="26" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="0.5">PROBLEM SOLVER</text>
      <text x="14" y="46" fill="#F9FAFB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Clean Software Solutions</text>
      <text x="14" y="64" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400">Structured Python &amp; C Code</text>
    </g>

    <!-- Column 2: Data-Driven -->
    <g transform="translate(260, 0)">
      <rect width="220" height="80" rx="8" fill="#161B22" stroke="#10B981" stroke-width="1" />
      <text x="14" y="26" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="0.5">DATA-DRIVEN</text>
      <text x="14" y="46" fill="#F9FAFB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">SQL &amp; Predictive Analytics</text>
      <text x="14" y="64" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400">Relational Schemas &amp; MySQL</text>
    </g>

    <!-- Column 3: Continuous Learner -->
    <g transform="translate(520, 0)">
      <rect width="220" height="80" rx="8" fill="#161B22" stroke="#F59E0B" stroke-width="1" />
      <text x="14" y="26" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="0.5">CONTINUOUS LEARNER</text>
      <text x="14" y="46" fill="#F9FAFB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">AI &amp; Machine Learning</text>
      <text x="14" y="64" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400">Expanding AI Engineering</text>
    </g>
  </g>
</svg>
