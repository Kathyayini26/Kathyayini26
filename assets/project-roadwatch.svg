<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="100%" height="100%">
  <defs>
    <linearGradient id="rw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140A04" />
      <stop offset="100%" stop-color="#241206" />
    </linearGradient>
  </defs>

  <rect width="420" height="220" rx="12" fill="url(#rw-bg)" stroke="#F59E0B" stroke-width="1.2" />

  <!-- Telemetry Header -->
  <g transform="translate(18, 22)">
    <circle cx="4" cy="0" r="3.5" fill="#F59E0B" />
    <text x="14" y="3.5" fill="#F59E0B" font-family="'Fira Code', monospace" font-size="9" font-weight="800" letter-spacing="0.5">LIDAR_SPATIAL // ROAD_DEFECT_TELEMETRY</text>
    <text x="384" y="3.5" fill="#F59E0B" font-family="'Fira Code', monospace" font-size="8" font-weight="700" text-anchor="end">SCAN_HZ: 60fps &#9679;</text>
  </g>
  <line x1="18" y1="34" x2="402" y2="34" stroke="#1E293B" stroke-width="1" />

  <!-- 3D LiDAR Road Wireframe & Anomaly Scatter -->
  <g transform="translate(210, 115)">
    <!-- Perspective Grid Lines -->
    <line x1="-160" y1="50" x2="-30" y2="-45" stroke="#451A03" stroke-width="1.5" />
    <line x1="160" y1="50" x2="30" y2="-45" stroke="#451A03" stroke-width="1.5" />
    <line x1="-80" y1="50" x2="-12" y2="-45" stroke="#331402" stroke-width="1" />
    <line x1="80" y1="50" x2="12" y2="-45" stroke="#331402" stroke-width="1" />
    <line x1="0" y1="50" x2="0" y2="-45" stroke="#FDE68A" stroke-width="1.2" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" values="0;28" dur="1.2s" repeatCount="indefinite" />
    </line>

    <!-- LiDAR Laser Scan Beam -->
    <polygon points="-90,40 90,40 0,-45" fill="#F59E0B" opacity="0.08">
      <animate attributeName="opacity" values="0.05;0.16;0.05" dur="2s" repeatCount="indefinite" />
    </polygon>

    <!-- Point Cloud Scatter Nodes (Safe = Green, Anomaly = Red) -->
    <circle cx="-55" cy="20" r="2.5" fill="#34D399" />
    <circle cx="-25" cy="30" r="2.5" fill="#34D399" />
    <circle cx="45" cy="15" r="2.5" fill="#34D399" />
    <circle cx="20" cy="35" r="2.5" fill="#34D399" />

    <!-- Defect Hotspot Target (Pothole / Surface Crack) -->
    <g transform="translate(-40, -5)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="2 2">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="3.5" fill="#EF4444" />
      <rect x="-24" y="-18" width="48" height="12" rx="3" fill="#450A0A" stroke="#EF4444" stroke-width="0.8" />
      <text x="0" y="-9.5" fill="#FCA5A5" font-family="'Fira Code', monospace" font-size="5.5" font-weight="800" text-anchor="middle">DEFECT: 98%</text>
    </g>
  </g>

  <!-- Bottom Telemetry -->
  <g transform="translate(18, 198)" font-family="'Fira Code', monospace" font-size="7.5" fill="#64748B">
    <text x="0" y="0">IRI_INDEX: 2.1 mm/m</text>
    <text x="145" y="0">LAT_LON: 12.9716&#176;N, 77.5946&#176;E</text>
    <text x="384" y="0" text-anchor="end">GEO_ACCURACY: &#177;0.2m</text>
  </g>
</svg>