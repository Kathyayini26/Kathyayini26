<svg fill="none" width="800" height="110" viewBox="0 0 800 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <linearGradient id="glow-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="33%" stop-color="#818CF8" />
      <stop offset="66%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Main Card Container -->
  <rect width="800" height="110" rx="10" fill="url(#card-bg)" stroke="url(#glow-border)" stroke-width="1.2" />

  <!-- 4 Core Technical Columns -->
  <g transform="translate(20, 22)">
    <!-- Column 1: Software Development -->
    <g transform="translate(0, 0)">
      <rect width="180" height="66" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="14" y="27" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">SOFTWARE DEV</text>
      <text x="14" y="47" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400">React &amp; Flask Web Systems</text>
    </g>

    <!-- Column 2: Data Analytics & SQL -->
    <g transform="translate(193, 0)">
      <rect width="180" height="66" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="14" y="27" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">DATA &amp; SQL</text>
      <text x="14" y="47" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400">SQL Queries &amp; Data Insights</text>
    </g>

    <!-- Column 3: Machine Learning -->
    <g transform="translate(386, 0)">
      <rect width="180" height="66" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="14" y="27" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">MACHINE LEARNING</text>
      <text x="14" y="47" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400">Predictive Models &amp; Algorithms</text>
    </g>

    <!-- Column 4: Artificial Intelligence -->
    <g transform="translate(579, 0)">
      <rect width="180" height="66" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="14" y="27" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">ARTIFICIAL INTEL.</text>
      <text x="14" y="47" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400">Applied AI &amp; Domain Tools</text>
    </g>
  </g>
</svg>
