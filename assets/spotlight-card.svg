<svg fill="none" width="800" height="135" viewBox="0 0 800 135" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="spotlight-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#092540" />
    </linearGradient>

    <linearGradient id="neon-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <filter id="glow-effect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="800" height="135" rx="12" fill="url(#spotlight-bg)" stroke="#30363D" stroke-width="1.2" />

  <!-- Top Glowing Accent Border Line -->
  <rect x="0" y="0" width="800" height="3.5" rx="1.75" fill="url(#neon-line)" />

  <!-- 3 Spotlight Columns -->
  <g transform="translate(30, 24)">
    <!-- Column 1: Academic Identity -->
    <g transform="translate(0, 0)">
      <text x="0" y="16" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">ACADEMIC PROFILE</text>
      <text x="0" y="38" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700">AI &amp; Data Science</text>
      <text x="0" y="58" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">BMSCE, Bengaluru (3rd Year)</text>
    </g>

    <line x1="225" y1="8" x2="225" y2="72" stroke="#334155" stroke-width="1" />

    <!-- Column 2: SQL & Core Stack -->
    <g transform="translate(250, 0)">
      <text x="0" y="16" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">PRIMARY STACK</text>
      <text x="0" y="38" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700">Python • SQL • C</text>
      <text x="0" y="58" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">React, Flask &amp; MySQL</text>
    </g>

    <line x1="495" y1="8" x2="495" y2="72" stroke="#334155" stroke-width="1" />

    <!-- Column 3: Engineering Focus -->
    <g transform="translate(520, 0)">
      <text x="0" y="16" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">ENGINEERING GOAL</text>
      <text x="0" y="38" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700">Applied AI &amp; Software</text>
      <text x="0" y="58" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">Data Analytics &amp; Web Apps</text>
    </g>
  </g>

  <!-- Quote Bar at Bottom -->
  <rect x="30" y="96" width="740" height="24" rx="6" fill="#1E293B" opacity="0.7" />
  <text x="44" y="112" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-style="italic">
    "Building intelligent, scalable software through Artificial Intelligence, SQL database design, and clean full-stack development."
  </text>
</svg>
