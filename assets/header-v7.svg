<svg fill="none" width="800" height="230" viewBox="0 0 800 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Executive Deep Gradient Background -->
    <linearGradient id="header-bg-v7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19">
        <animate attributeName="stop-color" values="#0B0F19; #0F172A; #1E1B4B; #0B0F19" dur="14s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#0F172A">
        <animate attributeName="stop-color" values="#0F172A; #1E1B4B; #092540; #0F172A" dur="14s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0A192F">
        <animate attributeName="stop-color" values="#0A192F; #0B0F19; #0F172A; #0A192F" dur="14s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Cyan/Emerald/Violet Neon Border -->
    <linearGradient id="neon-border-v7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="33%" stop-color="#38BDF8" />
      <stop offset="66%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <linearGradient id="name-grad-v7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-v7" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Frame -->
  <rect width="800" height="230" rx="14" fill="url(#header-bg-v7)" stroke="url(#neon-border-v7)" stroke-width="1.5" />

  <!-- Top Accent Shimmer -->
  <rect x="0" y="0" width="800" height="5" rx="2.5" fill="url(#neon-border-v7)" filter="url(#glow-v7)" />

  <!-- Ambient Wave Line -->
  <path d="M 0 165 Q 200 135 400 165 T 800 165" fill="none" stroke="url(#neon-border-v7)" stroke-width="1.2" opacity="0.3" />

  <!-- SOPHISTICATED EXECUTIVE AI & DATA NETWORK TOPOLOGY (Right Side) -->
  <g transform="translate(540, 20)" opacity="0.75" filter="url(#glow-v7)">
    <!-- Neural Matrix Polygon Mesh -->
    <polygon points="40,40 100,20 180,50 140,110 60,130" fill="none" stroke="#38BDF8" stroke-width="0.8" opacity="0.4" />
    <polygon points="100,20 180,50 210,110 140,110 110,70" fill="none" stroke="#34D399" stroke-width="0.8" opacity="0.4" />

    <!-- Vector Network Lines -->
    <line x1="40" y1="40" x2="110" y2="70" stroke="#38BDF8" stroke-width="1.2" />
    <line x1="100" y1="20" x2="110" y2="70" stroke="#34D399" stroke-width="1.2" />
    <line x1="180" y1="50" x2="110" y2="70" stroke="#A78BFA" stroke-width="1.2" />
    <line x1="140" y1="110" x2="110" y2="70" stroke="#38BDF8" stroke-width="1.2" />
    <line x1="60" y1="130" x2="110" y2="70" stroke="#34D399" stroke-width="1.2" />
    <line x1="180" y1="50" x2="210" y2="110" stroke="#A78BFA" stroke-width="1.2" />
    <line x1="140" y1="110" x2="210" y2="110" stroke="#38BDF8" stroke-width="1.2" />

    <!-- Pulsing Network Nodes -->
    <circle cx="110" cy="70" r="6" fill="#00F2FE">
      <animate attributeName="r" values="4.5;7.5;4.5" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="40" cy="40" r="4.5" fill="#38BDF8" />
    <circle cx="100" cy="20" r="4.5" fill="#34D399" />
    <circle cx="180" cy="50" r="5" fill="#A78BFA" />
    <circle cx="140" cy="110" r="4.5" fill="#38BDF8" />
    <circle cx="60" cy="130" r="4" fill="#34D399" />
    <circle cx="210" cy="110" r="5" fill="#00F2FE">
      <animate attributeName="r" values="3.5;6;3.5" dur="3.2s" repeatCount="indefinite" />
    </circle>

    <!-- Node Orbit Ring -->
    <circle cx="110" cy="70" r="45" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0 110 70" to="360 110 70" dur="18s" repeatCount="indefinite" />
    </circle>

    <text x="110" y="160" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="1">AI &amp; DATA ARCHITECTURE</text>
  </g>

  <!-- Left Accent Line -->
  <rect x="36" y="38" width="5" height="152" rx="2.5" fill="url(#neon-border-v7)" filter="url(#glow-v7)" />

  <!-- Main Name Title -->
  <text x="60" y="80" fill="url(#name-grad-v7)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    Kathyayini Prabhu
  </text>

  <!-- Role Subtitle -->
  <text x="60" y="114" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" letter-spacing="0.2">
    3rd Year Artificial Intelligence &amp; Data Science Student
  </text>

  <!-- Institution Tagline -->
  <text x="60" y="142" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500">
    BMS College of Engineering (BMSCE) • Bengaluru, India
  </text>

  <!-- Badges Row at Bottom -->
  <g transform="translate(60, 166)">
    <rect width="125" height="22" rx="11" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8" />
    <text x="62.5" y="15" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">DATA SCIENCE</text>

    <rect x="135" width="145" height="22" rx="11" fill="#1E293B" stroke="#34D399" stroke-width="0.8" />
    <text x="207.5" y="15" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">MACHINE LEARNING</text>

    <rect x="290" width="165" height="22" rx="11" fill="#1E293B" stroke="#A78BFA" stroke-width="0.8" />
    <text x="372.5" y="15" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">ARTIFICIAL INTELLIGENCE</text>
  </g>

  <!-- Top Right Live Status Badge -->
  <g transform="translate(585, 22)">
    <rect width="180" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-width="1" opacity="0.9" />
    <circle cx="15" cy="13" r="4" fill="#10B981" filter="url(#glow-v7)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="27" y="17" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">AI &amp; Data Science Student</text>
  </g>
</svg>
