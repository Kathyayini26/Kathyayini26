<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <!-- Deep Cyber Dark Background Gradient -->
    <linearGradient id="cockpit-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814">
        <animate attributeName="stop-color" values="#050814; #0A1128; #0F172A; #050814" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#0A1128">
        <animate attributeName="stop-color" values="#0A1128; #1E1B4B; #092540; #0A1128" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0F051D">
        <animate attributeName="stop-color" values="#0F051D; #050814; #0A1128; #0F051D" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Neon Cyber Border Gradient -->
    <linearGradient id="cockpit-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="33%" stop-color="#38BDF8" />
      <stop offset="66%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cockpit-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Main Container Frame -->
  <rect width="800" height="280" rx="16" fill="url(#cockpit-bg)" stroke="url(#cockpit-border)" stroke-width="1.8" />

  <!-- Top Accent Shimmer Line -->
  <rect x="0" y="0" width="800" height="5" rx="2.5" fill="url(#cockpit-border)" filter="url(#cockpit-glow)" />

  <!-- Top Terminal Header Bar -->
  <g transform="translate(20, 16)">
    <circle cx="10" cy="8" r="4" fill="#FF5F56" />
    <circle cx="24" cy="8" r="4" fill="#FFBD2E" />
    <circle cx="38" cy="8" r="4" fill="#27C93F" />
    <text x="56" y="12" fill="#64748B" font-family="'Fira Code', monospace" font-size="11" font-weight="700">kathyayini26 / .hostfile --live</text>
  </g>

  <!-- LEFT CARD: PROFESSIONAL AI NEURAL ARCHITECTURE & ML TELEMETRY (REPLACING PORTRAIT) -->
  <g transform="translate(24, 38)">
    <rect width="240" height="224" rx="12" fill="#0D1117" stroke="#38BDF8" stroke-width="1.2" filter="url(#cockpit-glow)" />

    <!-- Card Top Label -->
    <text x="14" y="20" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="9" font-weight="800" letter-spacing="1">NEURAL_NET / AI_MODEL_CORE</text>
    <line x1="14" y1="26" x2="226" y2="26" stroke="#1E293B" stroke-width="1" />

    <!-- Outer Radar Scan Ring -->
    <circle cx="120" cy="108" r="70" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="4 4" />
    
    <!-- Rotating Hologram Ring -->
    <circle cx="120" cy="108" r="68" fill="none" stroke="#00F2FE" stroke-width="1" stroke-dasharray="8 6" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0 120 108" to="360 120 108" dur="14s" repeatCount="indefinite" />
    </circle>

    <!-- ACTIVE 3-LAYER AI NEURAL NETWORK ARCHITECTURE -->
    <g transform="translate(18, 38)">
      <!-- Layer Connecting Synapse Lines -->
      <g stroke-width="1" opacity="0.55">
        <!-- Input to Hidden 1 -->
        <line x1="25" y1="25" x2="75" y2="15" stroke="#38BDF8" />
        <line x1="25" y1="25" x2="75" y2="40" stroke="#38BDF8" />
        <line x1="25" y1="25" x2="75" y2="65" stroke="#38BDF8" />
        
        <line x1="25" y1="50" x2="75" y2="15" stroke="#38BDF8" />
        <line x1="25" y1="50" x2="75" y2="40" stroke="#38BDF8" />
        <line x1="25" y1="50" x2="75" y2="65" stroke="#38BDF8" />

        <line x1="25" y1="75" x2="75" y2="15" stroke="#38BDF8" />
        <line x1="25" y1="75" x2="75" y2="40" stroke="#38BDF8" />
        <line x1="25" y1="75" x2="75" y2="65" stroke="#38BDF8" />

        <!-- Hidden 1 to Hidden 2 -->
        <line x1="75" y1="15" x2="130" y2="25" stroke="#34D399" />
        <line x1="75" y1="15" x2="130" y2="55" stroke="#34D399" />
        <line x1="75" y1="40" x2="130" y2="25" stroke="#34D399" />
        <line x1="75" y1="40" x2="130" y2="55" stroke="#34D399" />
        <line x1="75" y1="65" x2="130" y2="25" stroke="#34D399" />
        <line x1="75" y1="65" x2="130" y2="55" stroke="#34D399" />

        <!-- Hidden 2 to Output -->
        <line x1="130" y1="25" x2="180" y2="40" stroke="#A78BFA" />
        <line x1="130" y1="55" x2="180" y2="40" stroke="#A78BFA" />
      </g>

      <!-- Input Layer Nodes (Cyan) -->
      <circle cx="25" cy="25" r="4.5" fill="#00F2FE" />
      <circle cx="25" cy="50" r="4.5" fill="#00F2FE" />
      <circle cx="25" cy="75" r="4.5" fill="#00F2FE" />

      <!-- Hidden Layer 1 Nodes (Emerald) -->
      <circle cx="75" cy="15" r="5" fill="#34D399" filter="url(#cockpit-glow)">
        <animate attributeName="r" values="4;6.5;4" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="75" cy="40" r="5" fill="#34D399" />
      <circle cx="75" cy="65" r="5" fill="#34D399" filter="url(#cockpit-glow)">
        <animate attributeName="r" values="4;6.5;4" dur="2.5s" repeatCount="indefinite" />
      </circle>

      <!-- Hidden Layer 2 Nodes (Amber) -->
      <circle cx="130" cy="25" r="5" fill="#F59E0B" filter="url(#cockpit-glow)">
        <animate attributeName="r" values="4;7;4" dur="2.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="130" cy="55" r="5" fill="#F59E0B" />

      <!-- Output Inference Node (Purple Hyper-Core) -->
      <circle cx="180" cy="40" r="6.5" fill="#A78BFA" filter="url(#cockpit-glow)">
        <animate attributeName="r" values="5.5;9;5.5" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <circle cx="180" cy="40" r="3" fill="#FFFFFF" />
    </g>

    <!-- LIVE TELEMETRY METRICS DISPLAY -->
    <g transform="translate(18, 142)" font-family="'Fira Code', monospace" font-size="8.5">
      <rect width="204" height="46" rx="6" fill="#161B22" stroke="#334155" stroke-width="0.8" />
      <text x="10" y="16" fill="#94A3B8">ACCURACY: <tspan fill="#34D399" font-weight="700">98.6%</tspan></text>
      <text x="110" y="16" fill="#94A3B8">LOSS: <tspan fill="#38BDF8" font-weight="700">0.014</tspan></text>
      <text x="10" y="34" fill="#94A3B8">PIPELINE: <tspan fill="#F59E0B" font-weight="700">ACTIVE_FIT</tspan></text>
      <text x="110" y="34" fill="#94A3B8">EPOCHS: <tspan fill="#A78BFA" font-weight="700">100/100</tspan></text>
    </g>

    <!-- Scanning Laser Line -->
    <line x1="16" y1="50" x2="224" y2="50" stroke="#00F2FE" stroke-width="1.5" filter="url(#cockpit-glow)">
      <animate attributeName="y1" values="35;205;35" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="y2" values="35;205;35" dur="3.5s" repeatCount="indefinite" />
    </line>

    <!-- Status Bar -->
    <rect x="14" y="196" width="212" height="18" rx="4" fill="#161B22" />
    <circle cx="24" cy="205" r="3" fill="#10B981" />
    <text x="32" y="208" fill="#34D399" font-family="'Fira Code', monospace" font-size="8.5" font-weight="700">NEURAL_CORE [INFERENCE_OK]</text>
  </g>

  <!-- RIGHT CARD: TERMINAL DEVELOPER INFO (SYSTEM.INFO / HARDWARE.SYS / 700) -->
  <g transform="translate(280, 38)">
    <rect width="496" height="224" rx="12" fill="#0D1117" stroke="#334155" stroke-width="1.2" />

    <!-- Terminal Prompt Content Rows -->
    <g font-family="'Fira Code', monospace" font-size="11" font-weight="500" fill="#CBD5E1">
      <!-- Row 1: Header -->
      <text x="18" y="24">
        <tspan fill="#38BDF8" font-weight="800">SYSTEM.INFO</tspan> <tspan fill="#64748B">/ HARDWARE.SYS / 700</tspan>
      </text>

      <line x1="18" y1="32" x2="478" y2="32" stroke="#1E293B" stroke-width="1" />

      <!-- Core Details Block -->
      <text x="18" y="50"><tspan fill="#94A3B8">Subject:</tspan>     <tspan fill="#F8FAFC" font-weight="800">Kathyayini Prabhu</tspan></text>
      <text x="18" y="68"><tspan fill="#94A3B8">Role:</tspan>        <tspan fill="#38BDF8" font-weight="700">3rd Year AI &amp; Data Science Student</tspan></text>
      <text x="18" y="86"><tspan fill="#94A3B8">Affiliation:</tspan> <tspan fill="#E2E8F0">BMS College of Engineering (BMSCE)</tspan></text>
      <text x="18" y="104"><tspan fill="#94A3B8">Base:</tspan>        <tspan fill="#E2E8F0">Bengaluru, India</tspan></text>
      <text x="18" y="122"><tspan fill="#94A3B8">Status:</tspan>      <tspan fill="#34D399" font-weight="700">Researching / Building / Engineering</tspan></text>

      <!-- Line Separator -->
      <line x1="18" y1="130" x2="478" y2="130" stroke="#1E293B" stroke-width="1" />

      <!-- Research Item Section -->
      <text x="18" y="146"><tspan fill="#34D399" font-weight="800">RESEARCH.ITEM</tspan></text>
      <text x="18" y="162"> <tspan fill="#94A3B8">Primary:</tspan>    <tspan fill="#F8FAFC">Machine Learning, AI &amp; Data Science</tspan></text>
      <text x="18" y="178"> <tspan fill="#94A3B8">Direction:</tspan>  <tspan fill="#F8FAFC">Predictive Models &amp; SQL Architectures</tspan></text>
    </g>

    <!-- Bottom Action Pills Row -->
    <g transform="translate(18, 192)">
      <rect width="64" height="20" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
      <text x="32" y="14" fill="#94A3B8" font-family="'Fira Code', monospace" font-size="9" font-weight="700" text-anchor="middle">GITHUB</text>

      <rect x="72" width="95" height="20" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8" />
      <text x="119.5" y="14" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="9" font-weight="800" text-anchor="middle">KATHYAYINI</text>

      <rect x="175" width="95" height="20" rx="4" fill="#0969DA" />
      <text x="222.5" y="14" fill="#FFFFFF" font-family="'Fira Code', monospace" font-size="9" font-weight="800" text-anchor="middle">▲ PORTFOLIO</text>

      <rect x="278" width="60" height="20" rx="4" fill="#1E293B" stroke="#34D399" stroke-width="0.8" />
      <text x="308" y="14" fill="#34D399" font-family="'Fira Code', monospace" font-size="9" font-weight="800" text-anchor="middle">BMSCE</text>

      <rect x="346" width="112" height="20" rx="4" fill="#1E293B" stroke="#A78BFA" stroke-width="0.8" />
      <text x="402" y="14" fill="#A78BFA" font-family="'Fira Code', monospace" font-size="9" font-weight="800" text-anchor="middle">AI / DS / ASSETS</text>
    </g>
  </g>
</svg>
