    <!-- Project 2: AI Maritime Risk Intelligence -->
    <g transform="translate(388, 0)">
      <rect width="364" height="182" rx="10" fill="#1E293B" stroke="#3B82F6" stroke-width="1.2" />
      
      <!-- Card Category Tag -->
      <rect x="16" y="16" width="135" height="22" rx="11" fill="#1E1B4B" stroke="#3B82F6" stroke-width="1" />
      <text x="83.5" y="31" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="800" text-anchor="middle">MARITIME LOGISTICS AI</text>
      
      <!-- Project Name -->
      <text x="16" y="62" fill="#F9FAFB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">AI Maritime Risk Intelligence</text>
      
      <!-- Description -->
      <text x="16" y="86" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400">Logistics intelligence platform for route risk prediction,</text>
      <text x="16" y="104" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400">seasonal forecasting &amp; port optimization analytics.</text>

      <!-- Tech Stack Badges -->
      <g transform="translate(16, 124)">
        <rect width="60" height="20" rx="10" fill="#0F172A" stroke="#3B82F6" stroke-width="0.8" />
        <text x="30" y="14" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Python</text>

        <rect x="68" width="55" height="20" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="0.8" />
        <text x="95" y="14" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Flask</text>

        <rect x="130" width="55" height="20" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="0.8" />
        <text x="157" y="14" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">React</text>
      </g>

      <!-- Action Button Badge -->
      <g transform="translate(16, 152)">
        <rect width="145" height="20" rx="4" fill="#2563EB" />
        <text x="72.5" y="14" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">EXPLORE REPOSITORY →</text>
