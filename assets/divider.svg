<svg fill="none" width="800" height="24" viewBox="0 0 800 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="divider-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0" />
      <stop offset="30%" stop-color="#0284C7" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#0284C7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0" />
    </linearGradient>

    <filter id="laser-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Static Base Line -->
  <line x1="40" y1="12" x2="760" y2="12" stroke="url(#divider-cyan)" stroke-width="1.8" stroke-linecap="round" />

  <!-- Animated Moving Laser Dot -->
  <circle cy="12" r="3.5" fill="#38BDF8" filter="url(#laser-glow)">
    <animate attributeName="cx" values="40;760;40" dur="4.5s" repeatCount="indefinite" />
  </circle>
</svg>
