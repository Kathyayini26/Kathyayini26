<svg fill="none" width="800" height="210" viewBox="0 0 800 210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rich Flowing Background Gradient -->
    <linearGradient id="rich-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19">
        <animate attributeName="stop-color" values="#0B0F19; #0F172A; #1E1B4B; #0B0F19" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#0F172A">
        <animate attributeName="stop-color" values="#0F172A; #1E1B4B; #092540; #0F172A" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0A192F">
        <animate attributeName="stop-color" values="#0A192F; #0B0F19; #0F172A; #0A192F" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Cyan/Indigo Shimmer Border -->
    <linearGradient id="neon-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="33%" stop-color="#38BDF8" />
      <stop offset="66%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Frame -->
  <rect width="800" height="210" rx="14" fill="url(#rich-bg)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Top Accent Shimmer -->
  <rect x="0" y="0" width="800" height="4" rx="2" fill="url(#neon-border)" />

  <!-- Animated Ambient Geometric Wave Lines -->
  <g opacity="0.4">
    <path d="M 0 155 Q 200 125 400 155 T 800 155" fill="none" stroke="url(#neon-border)" stroke-width="1.5">
      <animate attributeName="d" values="M 0 155 Q 200 125 400 155 T 800 155; M 0 140 Q 200 170 400 140 T 800 140; M 0 155 Q 200 125 400 155 T 800 155" dur="7s" repeatCount="indefinite" />
    </path>
    <path d="M 0 180 Q 200 200 400 180 T 800 180" fill="none" stroke="#A78BFA" stroke-width="1" opacity="0.5">
      <animate attributeName="d" values="M 0 180 Q 200 200 400 180 T 800 180; M 0 190 Q 200 160 400 190 T 800 190; M 0 180 Q 200 200 400 180 T 800 180" dur="9s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Constellation Graphic (Right Side) -->
  <g opacity="0.45" filter="url(#soft-glow)">
    <line x1="590" y1="50" x2="670" y2="90" stroke="#38BDF8" stroke-width="1" />
    <line x1="670" y1="90" x2="745" y2="45" stroke="#34D399" stroke-width="1" />
    <line x1="670" y1="90" x2="720" y2="155" stroke="#A78BFA" stroke-width="1" />
    <line x1="590" y1="50" x2="630" y2="135" stroke="#38BDF8" stroke-width="1" />
    <line x1="630" y1="135" x2="720" y2="155" stroke="#38BDF8" stroke-width="1" />

    <circle cx="590" cy="50" r="4" fill="#38BDF8">
      <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="670" cy="90" r="5" fill="#00F2FE">
      <animate attributeName="r" values="4;6.5;4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="745" cy="45" r="4" fill="#34D399">
      <animate attributeName="r" values="3;5;3" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="720" cy="155" r="4.5" fill="#A78BFA">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="630" cy="135" r="3.5" fill="#38BDF8" />
  </g>

  <!-- Left Shimmer Bar -->
  <rect x="36" y="40" width="5" height="126" rx="2.5" fill="url(#neon-border)" filter="url(#soft-glow)" />

  <!-- Name Title -->
  <text x="60" y="80" fill="#F9FAFB" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">
    Kathyayini Prabhu
  </text>

  <!-- Role & Year Subtitle -->
  <text x="60" y="112" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="600" letter-spacing="0.2">
    3rd Year Artificial Intelligence &amp; Data Science Student
  </text>

  <!-- Institution & Focus Tagline -->
  <text x="60" y="138" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400">
    BMS College of Engineering (BMSCE) • Bengaluru, India
  </text>

  <!-- Top Right Live Status Pill -->
  <g transform="translate(605, 26)">
    <rect width="155" height="28" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1" opacity="0.9" />
    <circle cx="16" cy="14" r="4.5" fill="#10B981" filter="url(#soft-glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18" fill="#E5E7EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Student &amp; Developer</text>
  </g>
</svg>
