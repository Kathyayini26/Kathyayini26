<svg fill="none" width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Executive Flowing Gradient Background -->
    <linearGradient id="exec-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Vibrant Border Line -->
    <linearGradient id="exec-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Frame -->
  <rect width="800" height="200" rx="12" fill="url(#exec-bg)" stroke="#1F2937" stroke-width="1.2" />

  <!-- Top Accent Shimmer -->
  <rect x="0" y="0" width="800" height="4" rx="2" fill="url(#exec-border)" />

  <!-- Left Shimmer Bar -->
  <rect x="36" y="38" width="4.5" height="124" rx="2.25" fill="url(#exec-border)" filter="url(#soft-glow)" />

  <!-- Name Title -->
  <text x="56" y="76" fill="#F9FAFB" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">
    Kathyayini Prabhu
  </text>

  <!-- Role & Year Subtitle -->
  <text x="56" y="108" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="0.2">
    3rd Year Artificial Intelligence &amp; Data Science Student
  </text>

  <!-- Institution & Focus -->
  <text x="56" y="136" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400">
    BMS College of Engineering (BMSCE) • Bengaluru, India
  </text>

  <!-- Top Right Status Pill -->
  <g transform="translate(605, 26)">
    <rect width="155" height="28" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#10B981" filter="url(#soft-glow)" />
    <text x="28" y="18" fill="#E5E7EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Student &amp; Developer</text>
  </g>
</svg>
