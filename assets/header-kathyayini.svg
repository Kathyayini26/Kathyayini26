<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <!-- Deep Cyber Dark Background Gradient -->
    <linearGradient id="main-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814">
        <animate attributeName="stop-color" values="#050814; #0A1128; #0F172A; #050814" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#0A1128">
        <animate attributeName="stop-color" values="#0A1128; #1E1B4B; #092540; #0A1128" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0F051D">
        <animate attributeName="stop-color" values="#0F051D; #050814; #0A1128; #0F051D" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Neon Cyber Border Gradient -->
    <linearGradient id="main-border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="33%" stop-color="#38BDF8" />
      <stop offset="66%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="main-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Main Container Frame -->
  <rect width="800" height="280" rx="16" fill="url(#main-bg-grad)" stroke="url(#main-border-grad)" stroke-width="1.8" />

  <!-- Top Accent Shimmer Line -->
  <rect x="0" y="0" width="800" height="5" rx="2.5" fill="url(#main-border-grad)" filter="url(#main-glow)" />

  <!-- Top Terminal Header Bar -->
  <g transform="translate(20, 16)">
    <circle cx="10" cy="8" r="4" fill="#FF5F56" />
    <circle cx="24" cy="8" r="4" fill="#FFBD2E" />
    <circle cx="38" cy="8" r="4" fill="#27C93F" />
    <text x="56" y="12" fill="#64748B" font-family="'Fira Code', monospace" font-size="11" font-weight="700">kathyayini26 / .hostfile --live</text>
  </g>

  <!-- LEFT CARD: UNIQUE CODE PRINTING TERMINAL ("Hi, this is Kathyayini here") -->
  <g transform="translate(24, 38)">
    <rect width="255" height="224" rx="12" fill="#0D1117" stroke="#38BDF8" stroke-width="1.2" filter="url(#main-glow)" />

    <!-- Card Top Label -->
    <text x="14" y="20" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="9" font-weight="800" letter-spacing="1">DEV_INIT / HELLO_KATHYAYINI.PY</text>
    <line x1="14" y1="26" x2="241" y2="26" stroke="#1E293B" stroke-width="1" />

    <!-- IDE Code Window Content -->
    <g transform="translate(14, 34)" font-family="'Fira Code', monospace" font-size="9.2">
      <!-- Line 1: Comment -->
      <text x="0" y="14" fill="#64748B"># initialize developer session</text>
      
      <!-- Line 2: Class definition -->
      <text x="0" y="30">
        <tspan fill="#F43F5E" font-weight="700">class</tspan> <tspan fill="#38BDF8" font-weight="700">Kathyayini</tspan><tspan fill="#F8FAFC">:</tspan>
      </text>

      <!-- Line 3: Message -->
      <text x="12" y="46">
        <tspan fill="#F43F5E">def</tspan> <tspan fill="#34D399">greet</tspan><tspan fill="#F8FAFC">(self):</tspan>
      </text>

      <!-- Line 4: Greeting print string -->
      <text x="24" y="62">
        <tspan fill="#F59E0B">return</tspan> <tspan fill="#00F2FE" font-weight="700">"Hi, this is"</tspan>
      </text>
      <text x="24" y="78">
        <tspan fill="#00F2FE" font-weight="700">"Kathyayini here!"</tspan>
      </text>

      <!-- Line 5: Focus -->
      <text x="12" y="96">
        <tspan fill="#F43F5E">def</tspan> <tspan fill="#34D399">focus</tspan><tspan fill="#F8FAFC">(self):</tspan>
      </text>
      <text x="24" y="112">
        <tspan fill="#F59E0B">return</tspan> <tspan fill="#A78BFA">"AI &amp; Data Science"</tspan>
      </text>

      <!-- Line 6: Execution Terminal Call -->
      <text x="0" y="132" fill="#E2E8F0">
        <tspan fill="#34D399">&gt;&gt;&gt;</tspan> <tspan fill="#F8FAFC">print(Kathyayini.greet())</tspan>
      </text>

      <!-- Line 7: Printed Output with Glowing Cyan Cursor -->
      <rect x="0" y="140" width="227" height="18" rx="4" fill="#161B22" />
      <text x="8" y="153" fill="#34D399" font-weight="800">Hi, this is Kathyayini here!</text>
      <rect x="202" y="144" width="6" height="10" fill="#00F2FE">
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Bottom Status Bar inside Left Card -->
    <rect x="14" y="196" width="227" height="18" rx="4" fill="#161B22" />
    <circle cx="24" cy="205" r="3" fill="#10B981" />
    <text x="32" y="208" fill="#34D399" font-family="'Fira Code', monospace" font-size="8.5" font-weight="700">CODE_EXEC [SESSION_ACTIVE]</text>
  </g>

  <!-- RIGHT CARD: TERMINAL DEVELOPER INFO (SYSTEM.INFO / HARDWARE.SYS / 700) -->
  <g transform="translate(295, 38)">
    <rect width="481" height="224" rx="12" fill="#0D1117" stroke="#334155" stroke-width="1.2" />

    <!-- Terminal Prompt Content Rows -->
    <g font-family="'Fira Code', monospace" font-size="11" font-weight="500" fill="#CBD5E1">
      <!-- Row 1: Header -->
      <text x="18" y="24">
        <tspan fill="#38BDF8" font-weight="800">SYSTEM.INFO</tspan> <tspan fill="#64748B">/ HARDWARE.SYS / 700</tspan>
      </text>

      <line x1="18" y1="32" x2="463" y2="32" stroke="#1E293B" stroke-width="1" />

      <!-- Core Details Block -->
      <text x="18" y="50"><tspan fill="#94A3B8">Name:</tspan>        <tspan fill="#F8FAFC" font-weight="800">Kathyayini Prabhu</tspan></text>
      <text x="18" y="68"><tspan fill="#94A3B8">Role:</tspan>        <tspan fill="#38BDF8" font-weight="700">3rd Year AI &amp; Data Science Student</tspan></text>
      <text x="18" y="86"><tspan fill="#94A3B8">Affiliation:</tspan> <tspan fill="#E2E8F0">BMS College of Engineering (BMSCE)</tspan></text>
      <text x="18" y="104"><tspan fill="#94A3B8">Base:</tspan>        <tspan fill="#E2E8F0">Bengaluru, India</tspan></text>
      <text x="18" y="122"><tspan fill="#94A3B8">Status:</tspan>      <tspan fill="#34D399" font-weight="700">Analyzing Data / Building / Engineering</tspan></text>

      <!-- Line Separator -->
      <line x1="18" y1="130" x2="463" y2="130" stroke="#1E293B" stroke-width="1" />

      <!-- Research Item Section -->
      <text x="18" y="146"><tspan fill="#34D399" font-weight="800">DOMAIN.FOCUS</tspan></text>
      <text x="18" y="162"> <tspan fill="#94A3B8">Primary:</tspan>    <tspan fill="#F8FAFC">Machine Learning, AI &amp; Data Science</tspan></text>
      <text x="18" y="178"> <tspan fill="#94A3B8">Direction:</tspan>  <tspan fill="#F8FAFC">Predictive Models &amp; SQL Architectures</tspan></text>
    </g>

    <!-- Bottom Action Pills Row -->
    <g transform="translate(18, 192)">
      <rect width="64" height="20" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
      <text x="32" y="14" fill="#94A3B8" font-family="'Fira Code', monospace" font-size="9" font-weight="700" text-anchor="middle">GITHUB</text>

      <rect x="72" width="95" height="20" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8" />
      <text x="119.5" y="14" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="9" font-weight="800" text-anchor="middle">KATHYAYINI</text>

      <rect x="175" width="95" height="20" rx="4" fill="#0969DA" />
      <text x="222.5" y="14" fill="#FFFFFF" font-family="'Fira Code', monospace" font-size="9" font-weight="800" text-anchor="middle">▲ PORTFOLIO</text>

      <rect x="278" width="60" height="20" rx="4" fill="#1E293B" stroke="#34D399" stroke-width="0.8" />
      <text x="308" y="14" fill="#34D399" font-family="'Fira Code', monospace" font-size="9" font-weight="800" text-anchor="middle">BMSCE</text>

      <rect x="346" width="112" height="20" rx="4" fill="#1E293B" stroke="#A78BFA" stroke-width="0.8" />
      <text x="402" y="14" fill="#A78BFA" font-family="'Fira Code', monospace" font-size="9" font-weight="800" text-anchor="middle">AI / DS / ASSETS</text>
    </g>
  </g>
</svg>