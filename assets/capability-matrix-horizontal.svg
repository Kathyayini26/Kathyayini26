<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 145" width="100%" height="100%">
  <defs>
    <linearGradient id="cmh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816">
        <animate attributeName="stop-color" values="#050816; #070B1F; #0A1028; #050816" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#070B1F">
        <animate attributeName="stop-color" values="#070B1F; #0E122C; #06152B; #070B1F" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0A1028">
        <animate attributeName="stop-color" values="#0A1028; #050816; #070B1F; #0A1028" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="cmh-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="35%" stop-color="#34D399" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <filter id="cmh-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glass Frame -->
  <rect width="850" height="145" rx="14" fill="url(#cmh-bg)" stroke="#1E293B" stroke-width="1.8" />
  <rect x="0" y="0" width="850" height="3" rx="1.5" fill="url(#cmh-border)" filter="url(#cmh-glow)" />

  <!-- 4 Horizontal Cards (Side-by-Side matching screenshot) -->
  <g transform="translate(18, 18)">
    <!-- Card 1: DATA SCIENCE (Cyan) -->
    <g transform="translate(0, 0)">
      <rect width="194" height="108" rx="10" fill="#0D1117" stroke="#00F2FE" stroke-width="1.2" filter="url(#cmh-glow)" />
      <text x="16" y="32" fill="#00F2FE" font-family="'Fira Code', monospace" font-size="11.5" font-weight="800" letter-spacing="0.5">DATA SCIENCE</text>
      <text x="16" y="58" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="800">Python Analytics</text>
      <text x="16" y="82" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">Data Modeling &amp; Stats</text>
    </g>

    <!-- Card 2: MACHINE LEARNING (Green) -->
    <g transform="translate(206, 0)">
      <rect width="194" height="108" rx="10" fill="#0D1117" stroke="#34D399" stroke-width="1.2" filter="url(#cmh-glow)" />
      <text x="16" y="32" fill="#34D399" font-family="'Fira Code', monospace" font-size="11.5" font-weight="800" letter-spacing="0.5">MACHINE LEARNING</text>
      <text x="16" y="58" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="800">Predictive Models</text>
      <text x="16" y="82" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">Algorithms &amp; Pipelines</text>
    </g>

    <!-- Card 3: SQL & DATABASE (Orange) -->
    <g transform="translate(412, 0)">
      <rect width="194" height="108" rx="10" fill="#0D1117" stroke="#F59E0B" stroke-width="1.2" filter="url(#cmh-glow)" />
      <text x="16" y="32" fill="#F59E0B" font-family="'Fira Code', monospace" font-size="11.5" font-weight="800" letter-spacing="0.5">SQL &amp; DATABASE</text>
      <text x="16" y="58" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="800">SQL &amp; MySQL</text>
      <text x="16" y="82" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">Relational Schemas</text>
    </g>

    <!-- Card 4: ARTIFICIAL INTEL. (Purple) -->
    <g transform="translate(618, 0)">
      <rect width="196" height="108" rx="10" fill="#0D1117" stroke="#C084FC" stroke-width="1.2" filter="url(#cmh-glow)" />
      <text x="16" y="32" fill="#C084FC" font-family="'Fira Code', monospace" font-size="11.5" font-weight="800" letter-spacing="0.5">ARTIFICIAL INTEL.</text>
      <text x="16" y="58" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="800">AI Systems</text>
      <text x="16" y="82" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">Intelligent Applications</text>
    </g>
  </g>
</svg>