<svg fill="none" width="800" height="230" viewBox="0 0 800 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Engineering Background Gradient -->
    <linearGradient id="header-bg-v12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19">
        <animate attributeName="stop-color" values="#0B0F19; #0F172A; #1E1B4B; #0B0F19" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#0F172A">
        <animate attributeName="stop-color" values="#0F172A; #1E1B4B; #092540; #0F172A" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0A192F">
        <animate attributeName="stop-color" values="#0A192F; #0B0F19; #0F172A; #0A192F" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Vibrant Neon Accent Line -->
    <linearGradient id="accent-grad-v12" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="33%" stop-color="#34D399" />
      <stop offset="66%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-v12" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Frame -->
  <rect width="800" height="230" rx="14" fill="url(#header-bg-v12)" stroke="url(#accent-grad-v12)" stroke-width="1.5" />

  <!-- Top Accent Shimmer -->
  <rect x="0" y="0" width="800" height="5" rx="2.5" fill="url(#accent-grad-v12)" filter="url(#glow-v12)" />

  <!-- Continuous Flowing Wave Line -->
  <path d="M 0 165 Q 200 135 400 165 T 800 165" fill="none" stroke="url(#accent-grad-v12)" stroke-width="1.5" opacity="0.4">
    <animate attributeName="d" values="M 0 165 Q 200 135 400 165 T 800 165; M 0 148 Q 200 182 400 148 T 800 148; M 0 165 Q 200 135 400 165 T 800 165" dur="5s" repeatCount="indefinite" />
  </path>

  <!-- ANIMATED AI & ML DATA PIPELINE & ROTATING NEURAL CORE GRAPHIC (Right Side) -->
  <g transform="translate(505, 18)">
    <!-- Container Box -->
    <rect width="270" height="190" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1" opacity="0.9" />
    
    <!-- Title -->
    <text x="135" y="24" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1">LIVE ML DATA STREAM &amp; AI CORE</text>
    <line x1="16" y1="32" x2="254" y2="32" stroke="#1E293B" stroke-width="1" />

    <!-- MOVING DATA PIPELINE STREAM (Top Row) -->
    <g transform="translate(16, 42)">
      <!-- Track Line -->
      <line x1="10" y1="12" x2="230" y2="12" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" />
      
      <!-- Moving Data Packet 1 (Cyan) -->
      <circle cy="12" r="5" fill="#38BDF8" filter="url(#glow-v12)">
        <animate attributeName="cx" values="10;230;10" dur="3s" repeatCount="indefinite" />
      </circle>

      <!-- Moving Data Packet 2 (Emerald) -->
      <circle cy="12" r="4.5" fill="#34D399" filter="url(#glow-v12)">
        <animate attributeName="cx" values="230;10;230" dur="3.5s" repeatCount="indefinite" />
      </circle>

      <!-- Moving Data Packet 3 (Amber) -->
      <circle cy="12" r="4" fill="#F59E0B" filter="url(#glow-v12)">
        <animate attributeName="cx" values="70;230;70" dur="2.5s" repeatCount="indefinite" />
      </circle>

      <!-- Pipeline Step Labels -->
      <rect width="60" height="16" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8" />
      <text x="30" y="11" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" font-weight="700" text-anchor="middle">INGEST</text>

      <rect x="85" width="60" height="16" rx="4" fill="#1E293B" stroke="#34D399" stroke-width="0.8" />
      <text x="115" y="11" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" font-weight="700" text-anchor="middle">TRANSFORM</text>

      <rect x="170" width="60" height="16" rx="4" fill="#1E293B" stroke="#A78BFA" stroke-width="0.8" />
      <text x="200" y="11" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" font-weight="700" text-anchor="middle">INFER</text>
    </g>

    <!-- CONTINUOUSLY ROTATING NEURAL CORE (Bottom Section) -->
    <g transform="translate(16, 75)">
      <rect width="238" height="100" rx="6" fill="#161B22" stroke="#334155" stroke-width="1" />
      
      <!-- Outer Orbit Ring (Rotates Clockwise) -->
      <circle cx="119" cy="50" r="38" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="6 4" filter="url(#glow-v12)">
        <animateTransform attributeName="transform" type="rotate" from="0 119 50" to="360 119 50" dur="14s" repeatCount="indefinite" />
      </circle>

      <!-- Inner Orbit Ring (Rotates Counter-Clockwise) -->
      <circle cx="119" cy="50" r="24" fill="none" stroke="#34D399" stroke-width="1" stroke-dasharray="4 3" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" from="360 119 50" to="0 119 50" dur="10s" repeatCount="indefinite" />
      </circle>

      <!-- Pulsing Central Neural Core -->
      <circle cx="119" cy="50" r="8" fill="#A78BFA" filter="url(#glow-v12)">
        <animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="119" cy="50" r="4" fill="#00F2FE" />

      <!-- Surrounding Pulsing Network Nodes -->
      <circle cx="50" cy="30" r="4.5" fill="#38BDF8">
        <animate attributeName="r" values="3.5;6;3.5" dur="2.2s" repeatCount="indefinite" />
      </circle>
      <line x1="50" y1="30" x2="119" y2="50" stroke="#38BDF8" stroke-width="1" opacity="0.5" />

      <circle cx="50" cy="70" r="4" fill="#34D399">
        <animate attributeName="r" values="3;5.5;3" dur="2.8s" repeatCount="indefinite" />
      </circle>
      <line x1="50" y1="70" x2="119" y2="50" stroke="#34D399" stroke-width="1" opacity="0.5" />

      <circle cx="188" cy="30" r="4.5" fill="#F59E0B">
        <animate attributeName="r" values="3.5;6.5;3.5" dur="1.9s" repeatCount="indefinite" />
      </circle>
      <line x1="188" y1="30" x2="119" y2="50" stroke="#F59E0B" stroke-width="1" opacity="0.5" />

      <circle cx="188" cy="70" r="4" fill="#A78BFA">
        <animate attributeName="r" values="3;6;3" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <line x1="188" y1="70" x2="119" y2="50" stroke="#A78BFA" stroke-width="1" opacity="0.5" />

      <text x="119" y="93" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="0.5">NEURAL PROCESSING ENGINE</text>
    </g>
  </g>

  <!-- Left Accent Line with Glowing Pulse -->
  <rect x="36" y="38" width="5" height="152" rx="2.5" fill="url(#accent-grad-v12)" filter="url(#glow-v12)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite" />
  </rect>

  <!-- Main Name Title -->
  <text x="60" y="80" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    Kathyayini Prabhu
  </text>

  <!-- Role Subtitle -->
  <text x="60" y="114" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="700" letter-spacing="0.2">
    AI &amp; Data Science Engineer • ML &amp; Software Systems
  </text>

  <!-- Institution Tagline -->
  <text x="60" y="142" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500">
    BMS College of Engineering (BMSCE) • Bengaluru, India
  </text>

  <!-- Badges Row at Bottom -->
  <g transform="translate(60, 166)">
    <rect width="145" height="22" rx="11" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8" />
    <text x="72.5" y="15" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">MACHINE LEARNING</text>

    <rect x="155" width="155" height="22" rx="11" fill="#1E293B" stroke="#34D399" stroke-width="0.8" />
    <text x="232.5" y="15" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">DATA SCIENCE &amp; SQL</text>

    <rect x="320" width="140" height="22" rx="11" fill="#1E293B" stroke="#A78BFA" stroke-width="0.8" />
    <text x="390" y="15" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">SOFTWARE ENGR.</text>
  </g>

  <!-- Top Right Status Badge -->
  <g transform="translate(565, 16)">
    <rect width="195" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-width="1" opacity="0.9" />
    <circle cx="15" cy="13" r="4" fill="#10B981" filter="url(#glow-v12)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="27" y="17" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">AI &amp; Data Science Student</text>
  </g>
</svg>
