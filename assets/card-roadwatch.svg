<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 205" width="100%" height="100%">
  <defs>
    <linearGradient id="cbg-INF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060918" />
      <stop offset="100%" stop-color="#0A1024" />
    </linearGradient>

    <linearGradient id="btn-blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <filter id="cglow-INF" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Frame (Wider 580x205) -->
  <rect x="2" y="2" width="576" height="201" rx="14" fill="url(#cbg-INF)" stroke="#F59E0B" stroke-width="1.5" filter="url(#cglow-INF)" />

  <!-- Top Category Pill Badge -->
  <g transform="translate(26, 18)">
    <rect width="183.79999999999998" height="24" rx="12" fill="#451A03" stroke="#F59E0B" stroke-width="1" />
    <text x="91.89999999999999" y="16" fill="#F59E0B" font-family="'Fira Code', monospace" font-size="9" font-weight="800" text-anchor="middle">INFRASTRUCTURE RISK</text>
  </g>

  <!-- Large Bold Title -->
  <text x="26" y="74" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20.5" font-weight="800" letter-spacing="-0.3">RoadWatch</text>

  <!-- Clear 2-Line Description -->
  <text x="26" y="100" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Geospatial hazard telemetry &amp; anomaly detection</text>
  <text x="26" y="118" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">platform for road infrastructure safety &amp; monitoring.</text>

  <!-- Bottom Row: Tech Tags (Left) + Explore Button (Fixed Right) -->
  <g transform="translate(0, 148)">
    
      <rect x="26" y="0" width="75.0" height="28" rx="14" fill="#161B22" stroke="#F59E0B" stroke-width="0.9" />
      <text x="63.5" y="18" fill="#F59E0B" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="middle">Python</text>
      <rect x="111.0" y="0" width="49.5" height="28" rx="14" fill="#161B22" stroke="#F59E0B" stroke-width="0.9" />
      <text x="135.75" y="18" fill="#F59E0B" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="middle">GIS</text>
      <rect x="170.5" y="0" width="75.0" height="28" rx="14" fill="#161B22" stroke="#F59E0B" stroke-width="0.9" />
      <text x="208.0" y="18" fill="#F59E0B" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="middle">Pandas</text>

    <!-- Fixed Right-Aligned Explore Button -->
    <g transform="translate(380, 0)">
      <rect width="174" height="28" rx="6" fill="url(#btn-blue-grad)" />
      <text x="87.0" y="18" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.4" text-anchor="middle">EXPLORE REPOSITORY &#8594;</text>
    </g>
  </g>
</svg>