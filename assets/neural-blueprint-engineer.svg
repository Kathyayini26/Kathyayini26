<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="850" height="240">
  <defs>
    <linearGradient id="eng-nb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="100%" stop-color="#0A1028" />
    </linearGradient>

    <filter id="eng-nb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="850" height="240" rx="14" fill="url(#eng-nb-bg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Animated Neural Lines -->
  <g stroke="#38BDF8" stroke-width="0.8" opacity="0.25">
    <line x1="20" y1="160" x2="200" y2="100">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="200" y1="100" x2="400" y2="180">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="5s" repeatCount="indefinite" />
    </line>
    <line x1="400" y1="180" x2="650" y2="80">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.5s" repeatCount="indefinite" />
    </line>
    <line x1="650" y1="80" x2="820" y2="140">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="4.5s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Header -->
  <g transform="translate(30, 22)">
    <text x="0" y="12" fill="#00F2FE" font-family="'Fira Code', monospace" font-size="12.5" font-weight="800" letter-spacing="1">NEURAL BLUEPRINT // TRANSFORMING DATA INTO INTELLIGENT SYSTEMS</text>
    <text x="790" y="12" fill="#34D399" font-family="'Fira Code', monospace" font-size="10" font-weight="700" text-anchor="end">SYS_PROFILE &#9679;</text>
  </g>
  <line x1="30" y1="40" x2="820" y2="40" stroke="#1E293B" stroke-width="1" />

  <!-- Narrative Content (Safely Wrapped & Perfectly Centered in Box) -->
  <g transform="translate(36, 60)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Paragraph 1 -->
    <text x="0" y="16" fill="#FFFFFF" font-size="12.5" font-weight="600">
      Third-Year Artificial Intelligence &amp; Data Science student focused on intelligent systems and data-driven solutions.
    </text>

    <!-- Paragraph 2 -->
    <text x="0" y="42" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="11.5" font-weight="700">
      Machine Learning &#8226; Data Analytics &#8226; SQL Engineering &#8226; Backend Development &#8226; AI Applications
    </text>

    <!-- Paragraph 3 -->
    <text x="0" y="68" fill="#CBD5E1" font-size="12">
      Transforming data into actionable insights through automation and software engineering.
    </text>

    <!-- 5 Focus Tags -->
    <g transform="translate(0, 96)" font-family="'Fira Code', monospace" font-size="8.5">
      <rect width="135" height="22" rx="11" fill="#0D1117" stroke="#00F2FE" stroke-width="1" />
      <text x="67.5" y="14.5" fill="#00F2FE" font-weight="700" text-anchor="middle">&#9670; Machine Learning</text>

      <rect x="145" width="125" height="22" rx="11" fill="#0D1117" stroke="#34D399" stroke-width="1" />
      <text x="207.5" y="14.5" fill="#34D399" font-weight="700" text-anchor="middle">&#9670; Data Analytics</text>

      <rect x="280" width="148" height="22" rx="11" fill="#0D1117" stroke="#F59E0B" stroke-width="1" />
      <text x="354" y="14.5" fill="#F59E0B" font-weight="700" text-anchor="middle">&#9670; SQL Engineering</text>

      <rect x="438" width="158" height="22" rx="11" fill="#0D1117" stroke="#818CF8" stroke-width="1" />
      <text x="517" y="14.5" fill="#818CF8" font-weight="700" text-anchor="middle">&#9670; Backend Development</text>

      <rect x="606" width="130" height="22" rx="11" fill="#0D1117" stroke="#C084FC" stroke-width="1" />
      <text x="671" y="14.5" fill="#C084FC" font-weight="700" text-anchor="middle">&#9670; AI Applications</text>
    </g>
  </g>
</svg>