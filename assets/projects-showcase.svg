<svg fill="none" width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="proj-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <linearGradient id="bio-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <linearGradient id="risk-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="800" height="220" rx="12" fill="url(#proj-bg)" stroke="#30363D" stroke-width="1.2" />

  <!-- 2 Project Cards Grid -->
  <g transform="translate(24, 24)">
    <!-- Project 1: BioWeaver -->
    <g transform="translate(0, 0)">
      <rect width="364" height="172" rx="10" fill="#161B22" stroke="url(#bio-border)" stroke-width="1.2" />
      
      <!-- Card Header -->
      <rect x="16" y="16" width="85" height="22" rx="11" fill="#064E3B" stroke="#10B981" stroke-width="1" />
      <text x="58" y="31" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">BIOWEAVER</text>
      
      <!-- Title -->
      <text x="16" y="62" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">BioWeaver Discovery Engine</text>
      
      <!-- Description -->
      <text x="16" y="86" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400">AI platform integrating biological knowledge graphs</text>
      <text x="16" y="104" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400">to predict gene–disease relationships &amp; hypotheses.</text>

      <!-- Tech Stack Pills -->
      <g transform="translate(16, 126)">
        <rect width="60" height="20" rx="10" fill="#1E293B" />
        <text x="30" y="14" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Python</text>

        <rect x="68" width="55" height="20" rx="10" fill="#1E293B" />
        <text x="95" y="14" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Flask</text>

        <rect x="130" width="55" height="20" rx="10" fill="#1E293B" />
        <text x="157" y="14" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">React</text>
      </g>
    </g>

    <!-- Project 2: AI Maritime Risk Intelligence -->
    <g transform="translate(388, 0)">
      <rect width="364" height="172" rx="10" fill="#161B22" stroke="url(#risk-border)" stroke-width="1.2" />
      
      <!-- Card Header -->
      <rect x="16" y="16" width="125" height="22" rx="11" fill="#1E1B4B" stroke="#818CF8" stroke-width="1" />
      <text x="78" y="31" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">MARITIME RISK AI</text>
      
      <!-- Title -->
      <text x="16" y="62" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">AI Maritime Risk Intelligence</text>
      
      <!-- Description -->
      <text x="16" y="86" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400">Logistics intelligence platform for route risk prediction,</text>
      <text x="16" y="104" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400">seasonal forecasting &amp; port optimization analytics.</text>

      <!-- Tech Stack Pills -->
      <g transform="translate(16, 126)">
        <rect width="60" height="20" rx="10" fill="#1E293B" />
        <text x="30" y="14" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Python</text>

        <rect x="68" width="55" height="20" rx="10" fill="#1E293B" />
        <text x="95" y="14" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Flask</text>

        <rect x="130" width="55" height="20" rx="10" fill="#1E293B" />
        <text x="157" y="14" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">React</text>
      </g>
    </g>
  </g>
</svg>
