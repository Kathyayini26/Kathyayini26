<svg fill="none" width="800" height="115" viewBox="0 0 800 115" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pro-grid-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>
  </defs>

  <!-- Container Frame -->
  <rect width="800" height="115" rx="10" fill="url(#pro-grid-bg)" stroke="#30363D" stroke-width="1.2" />

  <!-- 4 Professional Pillars -->
  <g transform="translate(18, 18)">
    <!-- Box 1: Data Science -->
    <g transform="translate(0, 0)">
      <rect width="180" height="78" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <text x="14" y="26" fill="#58A6FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">DATA SCIENCE</text>
      <text x="14" y="46" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Python Analytics</text>
      <text x="14" y="62" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400">Data Modeling &amp; Stats</text>
    </g>

    <!-- Box 2: Machine Learning -->
    <g transform="translate(192, 0)">
      <rect width="180" height="78" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <text x="14" y="26" fill="#58A6FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">MACHINE LEARNING</text>
      <text x="14" y="46" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Predictive Models</text>
      <text x="14" y="62" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400">Algorithms &amp; Pipelines</text>
    </g>

    <!-- Box 3: SQL & Databases -->
    <g transform="translate(384, 0)">
      <rect width="180" height="78" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <text x="14" y="26" fill="#58A6FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">SQL &amp; DATABASES</text>
      <text x="14" y="46" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">SQL &amp; MySQL</text>
      <text x="14" y="62" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400">Relational Schemas</text>
    </g>

    <!-- Box 4: Artificial Intelligence -->
    <g transform="translate(576, 0)">
      <rect width="180" height="78" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <text x="14" y="26" fill="#58A6FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">ARTIFICIAL INTEL.</text>
      <text x="14" y="46" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">AI Systems</text>
      <text x="14" y="62" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400">Intelligent Applications</text>
    </g>
  </g>
</svg>
