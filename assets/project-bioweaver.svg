<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040817" />
      <stop offset="100%" stop-color="#0A1128" />
    </linearGradient>
    <filter id="bw-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="420" height="220" rx="12" fill="url(#bw-bg)" stroke="#00F2FE" stroke-width="1.2" filter="url(#bw-glow)" />

  <!-- Telemetry Header -->
  <g transform="translate(18, 22)">
    <circle cx="4" cy="0" r="3.5" fill="#00F2FE" />
    <text x="14" y="3.5" fill="#00F2FE" font-family="'Fira Code', monospace" font-size="9" font-weight="800" letter-spacing="0.5">GENE_PHENOTYPE // CROSS-ATTENTION</text>
    <text x="384" y="3.5" fill="#34D399" font-family="'Fira Code', monospace" font-size="8" font-weight="700" text-anchor="end">ATTN_WEIGHT: 0.942 &#9679;</text>
  </g>
  <line x1="18" y1="34" x2="402" y2="34" stroke="#1E293B" stroke-width="1" />

  <!-- Dual Strand Genomic Cross-Attention Visualization -->
  <g transform="translate(210, 115)">
    <!-- DNA Lattice Waves Left & Right -->
    <path d="M -160 -40 C -120 40 -80 -40 -40 0 C 0 40 40 -40 80 0 C 120 40 160 -40 180 0" fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.3" />
    <path d="M -160 40 C -120 -40 -80 40 -40 0 C 0 -40 40 40 80 0 C 120 -40 160 40 180 0" fill="none" stroke="#C084FC" stroke-width="1.2" opacity="0.3" />

    <!-- Animated Synapse Attention Rays -->
    <line x1="-120" y1="-25" x2="0" y2="0" stroke="#00F2FE" stroke-width="1" stroke-dasharray="3 3">
      <animate attributeName="stroke-dashoffset" values="12;0" dur="1s" repeatCount="indefinite" />
    </line>
    <line x1="-120" y1="25" x2="0" y2="0" stroke="#C084FC" stroke-width="1" stroke-dasharray="3 3">
      <animate attributeName="stroke-dashoffset" values="12;0" dur="1.2s" repeatCount="indefinite" />
    </line>
    <line x1="120" y1="-25" x2="0" y2="0" stroke="#34D399" stroke-width="1" stroke-dasharray="3 3">
      <animate attributeName="stroke-dashoffset" values="0;12" dur="1.1s" repeatCount="indefinite" />
    </line>
    <line x1="120" y1="25" x2="0" y2="0" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3 3">
      <animate attributeName="stroke-dashoffset" values="0;12" dur="1.3s" repeatCount="indefinite" />
    </line>

    <!-- Center Cross-Attention Neural Core -->
    <circle cx="0" cy="0" r="28" fill="#0D1117" stroke="#00F2FE" stroke-width="1.5" />
    <circle cx="0" cy="0" r="36" fill="none" stroke="#00F2FE" stroke-width="0.8" stroke-dasharray="4 4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="-4" fill="#00F2FE" font-family="'Fira Code', monospace" font-size="7.5" font-weight="800" text-anchor="middle">CROSS-ATTN</text>
    <text x="0" y="8" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="7" font-weight="700" text-anchor="middle">TRANSFORMER</text>

    <!-- Left Source: Gene Sequence Node -->
    <g transform="translate(-130, 0)">
      <rect x="-24" y="-14" width="48" height="28" rx="6" fill="#161B22" stroke="#38BDF8" stroke-width="1" />
      <text x="0" y="-1" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="7" font-weight="800" text-anchor="middle">GENE</text>
      <text x="0" y="9" fill="#94A3B8" font-family="'Fira Code', monospace" font-size="6" text-anchor="middle">SEQ_EMB</text>
    </g>

    <!-- Right Target: Phenotype Disease Node -->
    <g transform="translate(130, 0)">
      <rect x="-26" y="-14" width="52" height="28" rx="6" fill="#161B22" stroke="#34D399" stroke-width="1" />
      <text x="0" y="-1" fill="#34D399" font-family="'Fira Code', monospace" font-size="7" font-weight="800" text-anchor="middle">DISEASE</text>
      <text x="0" y="9" fill="#94A3B8" font-family="'Fira Code', monospace" font-size="6" text-anchor="middle">ONTOLOGY</text>
    </g>
  </g>

  <!-- Bottom Telemetry Metric -->
  <g transform="translate(18, 198)" font-family="'Fira Code', monospace" font-size="7.5" fill="#64748B">
    <text x="0" y="0">EMBEDDING_DIM: 512</text>
    <text x="140" y="0">F1_SCORE: 0.918</text>
    <text x="384" y="0" text-anchor="end">EXPLAINABLE_AI &#10003;</text>
  </g>
</svg>