<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="100%" height="100%">
  <defs>
    <linearGradient id="p-bio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A1F" />
      <stop offset="100%" stop-color="#091230" />
    </linearGradient>
  </defs>

  <rect width="420" height="220" rx="10" fill="url(#p-bio-bg)" stroke="#38BDF8" stroke-width="1.2" />

  <!-- Top Info -->
  <text x="20" y="28" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="9.5" font-weight="800" letter-spacing="0.5">BIOMEDICAL AI // GENE INTERACTION</text>
  <text x="400" y="28" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="8.5" font-weight="700" text-anchor="end">DISCOVERY &#9679;</text>

  <!-- Molecular DNA Interaction Graph -->
  <g transform="translate(210, 110)">
    <!-- Rotating Ring -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
    </circle>

    <!-- Center Core Gene -->
    <circle cx="0" cy="0" r="16" fill="#0D1117" stroke="#00F2FE" stroke-width="1.5" />
    <text x="0" y="3.5" fill="#00F2FE" font-family="'Fira Code', monospace" font-size="7.5" font-weight="800" text-anchor="middle">GENE</text>

    <!-- Outer Target Nodes -->
    <g transform="translate(-45, -25)">
      <line x1="45" y1="25" x2="0" y2="0" stroke="#38BDF8" stroke-width="1.2" />
      <circle cx="0" cy="0" r="10" fill="#161B22" stroke="#34D399" stroke-width="1.2" />
      <text x="0" y="2.5" fill="#34D399" font-family="'Fira Code', monospace" font-size="6.5" font-weight="700" text-anchor="middle">T1</text>
    </g>

    <g transform="translate(45, -25)">
      <line x1="-45" y1="25" x2="0" y2="0" stroke="#38BDF8" stroke-width="1.2" />
      <circle cx="0" cy="0" r="10" fill="#161B22" stroke="#F59E0B" stroke-width="1.2" />
      <text x="0" y="2.5" fill="#F59E0B" font-family="'Fira Code', monospace" font-size="6.5" font-weight="700" text-anchor="middle">T2</text>
    </g>

    <g transform="translate(-30, 40)">
      <line x1="30" y1="-40" x2="0" y2="0" stroke="#38BDF8" stroke-width="1.2" />
      <circle cx="0" cy="0" r="10" fill="#161B22" stroke="#818CF8" stroke-width="1.2" />
      <text x="0" y="2.5" fill="#818CF8" font-family="'Fira Code', monospace" font-size="6.5" font-weight="700" text-anchor="middle">T3</text>
    </g>

    <g transform="translate(35, 38)">
      <line x1="-35" y1="-38" x2="0" y2="0" stroke="#38BDF8" stroke-width="1.2" />
      <circle cx="0" cy="0" r="10" fill="#161B22" stroke="#C084FC" stroke-width="1.2" />
      <text x="0" y="2.5" fill="#C084FC" font-family="'Fira Code', monospace" font-size="6.5" font-weight="700" text-anchor="middle">T4</text>
    </g>
  </g>

  <!-- Bottom Labels -->
  <text x="210" y="202" fill="#64748B" font-family="'Fira Code', monospace" font-size="8" font-weight="700" text-anchor="middle">GRAPH INTERACTION MATRIX &#8226; EXPLAINABLE AI</text>
</svg>