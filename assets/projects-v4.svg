<svg fill="none" width="800" height="230" viewBox="0 0 800 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="proj-bg-v4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <linearGradient id="bio-border-v4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <linearGradient id="risk-border-v4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="800" height="230" rx="14" fill="url(#proj-bg-v4)" stroke="#30363D" stroke-width="1.2" />

  <!-- 2 Project Showcase Cards -->
  <g transform="translate(24, 24)">
    <!-- Project 1: BioWeaver -->
    <g transform="translate(0, 0)">
      <rect width="364" height="182" rx="10" fill="#161B22" stroke="url(#bio-border-v4)" stroke-width="1.5" />
      
      <!-- Card Category Tag -->
      <rect x="16" y="16" width="130" height="22" rx="11" fill="#064E3B" stroke="#10B981" stroke-width="1" />
      <text x="81" y="31" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="800" text-anchor="middle">BIOLOGICAL DISCOVERY</text>
      
      <!-- Project Name (REMOVED ENGINE -> BioWeaver) -->
      <text x="16" y="62" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">BioWeaver</text>
      
      <!-- Description -->
      <text x="16" y="86" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400">AI platform integrating biological knowledge graphs</text>
      <text x="16" y="104" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400">to predict gene–disease relationships &amp; hypotheses.</text>

      <!-- Tech Stack Badges -->
      <g transform="translate(16, 124)">
        <rect width="60" height="20" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8" />
        <text x="30" y="14" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Python</text>

        <rect x="68" width="55" height="20" rx="10" fill="#1E293B" stroke="#34D399" stroke-width="0.8" />
        <text x="95" y="14" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Flask</text>

        <rect x="130" width="55" height="20" rx="10" fill="#1E293B" stroke="#61DAFB" stroke-width="0.8" />
        <text x="157" y="14" fill="#61DAFB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">React</text>
      </g>

      <!-- Action Button Badge -->
      <g transform="translate(16, 152)">
        <rect width="145" height="20" rx="4" fill="#0969DA" />
        <text x="72.5" y="14" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">EXPLORE REPOSITORY →</text>
      </g>
    </g>

    <!-- Project 2: AI Maritime Risk Intelligence -->
    <g transform="translate(388, 0)">
      <rect width="364" height="182" rx="10" fill="#161B22" stroke="url(#risk-border-v4)" stroke-width="1.5" />
      
      <!-- Card Category Tag -->
      <rect x="16" y="16" width="135" height="22" rx="11" fill="#1E1B4B" stroke="#818CF8" stroke-width="1" />
      <text x="83.5" y="31" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="800" text-anchor="middle">MARITIME LOGISTICS AI</text>
      
      <!-- Project Name -->
      <text x="16" y="62" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">AI Maritime Risk Intelligence</text>
      
      <!-- Description -->
      <text x="16" y="86" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400">Logistics intelligence platform for route risk prediction,</text>
      <text x="16" y="104" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400">seasonal forecasting &amp; port optimization analytics.</text>

      <!-- Tech Stack Badges -->
      <g transform="translate(16, 124)">
        <rect width="60" height="20" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8" />
        <text x="30" y="14" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Python</text>

        <rect x="68" width="55" height="20" rx="10" fill="#1E293B" stroke="#34D399" stroke-width="0.8" />
        <text x="95" y="14" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Flask</text>

        <rect x="130" width="55" height="20" rx="10" fill="#1E293B" stroke="#61DAFB" stroke-width="0.8" />
        <text x="157" y="14" fill="#61DAFB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">React</text>
      </g>

      <!-- Action Button Badge -->
      <g transform="translate(16, 152)">
        <rect width="145" height="20" rx="4" fill="#0969DA" />
        <text x="72.5" y="14" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">EXPLORE REPOSITORY →</text>
      </g>
    </g>
  </g>
</svg>
