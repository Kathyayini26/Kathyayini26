<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 205" width="100%" height="100%">
  <defs>
    <linearGradient id="cbg-BIO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060918" />
      <stop offset="100%" stop-color="#0A1024" />
    </linearGradient>

    <linearGradient id="btn-blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <filter id="cglow-BIO" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Frame (Wider 580x205) -->
  <rect x="2" y="2" width="576" height="201" rx="14" fill="url(#cbg-BIO)" stroke="#34D399" stroke-width="1.5" filter="url(#cglow-BIO)" />

  <!-- Top Category Pill Badge -->
  <g transform="translate(26, 18)">
    <rect width="192.0" height="24" rx="12" fill="#064E3B" stroke="#34D399" stroke-width="1" />
    <text x="96.0" y="16" fill="#34D399" font-family="'Fira Code', monospace" font-size="9" font-weight="800" text-anchor="middle">BIOLOGICAL DISCOVERY</text>
  </g>

  <!-- Large Bold Title -->
  <text x="26" y="74" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20.5" font-weight="800" letter-spacing="-0.3">BioWeaver</text>

  <!-- Clear 2-Line Description -->
  <text x="26" y="100" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">AI platform integrating biological knowledge graphs</text>
  <text x="26" y="118" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">to predict gene–disease relationships &amp; hypotheses.</text>

  <!-- Bottom Row: Tech Tags (Left) + Explore Button (Fixed Right) -->
  <g transform="translate(0, 148)">
    
      <rect x="26" y="0" width="75.0" height="28" rx="14" fill="#161B22" stroke="#34D399" stroke-width="0.9" />
      <text x="63.5" y="18" fill="#34D399" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="middle">Python</text>
      <rect x="111.0" y="0" width="66.5" height="28" rx="14" fill="#161B22" stroke="#34D399" stroke-width="0.9" />
      <text x="144.25" y="18" fill="#34D399" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="middle">Flask</text>
      <rect x="187.5" y="0" width="66.5" height="28" rx="14" fill="#161B22" stroke="#34D399" stroke-width="0.9" />
      <text x="220.75" y="18" fill="#34D399" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="middle">React</text>

    <!-- Fixed Right-Aligned Explore Button -->
    <g transform="translate(380, 0)">
      <rect width="174" height="28" rx="6" fill="url(#btn-blue-grad)" />
      <text x="87.0" y="18" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.4" text-anchor="middle">EXPLORE REPOSITORY &#8594;</text>
    </g>
  </g>
</svg>