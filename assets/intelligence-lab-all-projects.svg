<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 490" width="850" height="490">
  <defs>
    <linearGradient id="lab-all-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="100%" stop-color="#070B1F" />
    </linearGradient>

    <filter id="lab-all-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="850" height="490" rx="14" fill="url(#lab-all-bg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(30, 24)">
    <text x="0" y="12" fill="#00F2FE" font-family="'Fira Code', monospace" font-size="13" font-weight="800" letter-spacing="1">INTELLIGENCE LAB // ALL FEATURED SYSTEMS (ALL VISIBLE)</text>
    <text x="790" y="12" fill="#34D399" font-family="'Fira Code', monospace" font-size="10" font-weight="700" text-anchor="end">5 ACTIVE SYSTEMS &#9679;</text>
  </g>
  <line x1="30" y1="44" x2="820" y2="44" stroke="#1E293B" stroke-width="1" />

  <!-- 5 PROJECT CARDS GRID (Row 1: 2 cards, Row 2: 2 cards, Row 3: 1 wide card) -->

  <!-- ROW 1 -->

  <!-- Card 1: BioWeaver (Animated DNA) -->
  <g transform="translate(30, 60)">
    <rect width="380" height="125" rx="10" fill="#0D1117" stroke="#38BDF8" stroke-width="1" />
    
    <!-- Animated DNA Icon -->
    <g transform="translate(335, 36)">
      <circle cx="0" cy="0" r="16" fill="#161B22" stroke="#38BDF8" stroke-width="1" />
      <path d="M -9 -5 Q 0 0 9 -5 M -9 5 Q 0 0 9 5" stroke="#00F2FE" stroke-width="1.8" fill="none">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite" />
      </path>
    </g>

    <text x="16" y="24" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="12" font-weight="800">BioWeaver</text>
    <text x="16" y="42" fill="#CBD5E1" font-family="'Fira Code', monospace" font-size="9.5" font-weight="700">Biomedical AI &amp; Discovery Platform</text>
    <text x="16" y="60" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5">
      Predicts gene-disease interactions with explainable research hypotheses.
    </text>

    <!-- Stack & Action -->
    <g transform="translate(16, 88)" font-family="'Fira Code', monospace" font-size="8.5">
      <rect width="50" height="18" rx="4" fill="#161B22" stroke="#334155" />
      <text x="25" y="12.5" fill="#38BDF8" text-anchor="middle">Python</text>
      <rect x="56" width="46" height="18" rx="4" fill="#161B22" stroke="#334155" />
      <text x="79" y="12.5" fill="#38BDF8" text-anchor="middle">Flask</text>
      <rect x="108" width="46" height="18" rx="4" fill="#161B22" stroke="#334155" />
      <text x="131" y="12.5" fill="#38BDF8" text-anchor="middle">React</text>
      <rect x="160" width="82" height="18" rx="4" fill="#161B22" stroke="#38BDF8" />
      <text x="201" y="12.5" fill="#00F2FE" font-weight="700" text-anchor="middle">Scikit-Learn</text>
    </g>
  </g>

  <!-- Card 2: Maritime Risk AI (Animated Ship) -->
  <g transform="translate(430, 60)">
    <rect width="390" height="125" rx="10" fill="#0D1117" stroke="#34D399" stroke-width="1" />
    
    <!-- Animated Ship Icon -->
    <g transform="translate(345, 36)">
      <circle cx="0" cy="0" r="16" fill="#161B22" stroke="#34D399" stroke-width="1" />
      <line x1="-12" y1="4" x2="12" y2="4" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2 2" />
      <polygon points="-6,2 6,2 3,-4 -3,-4" fill="#34D399">
        <animate attributeName="transform" type="translate" values="-4,0; 4,0; -4,0" dur="2.5s" repeatCount="indefinite" />
      </polygon>
    </g>

    <text x="16" y="24" fill="#34D399" font-family="'Fira Code', monospace" font-size="12" font-weight="800">Maritime Risk AI</text>
    <text x="16" y="42" fill="#CBD5E1" font-family="'Fira Code', monospace" font-size="9.5" font-weight="700">Predictive Supply Chain Risk Analytics</text>
    <text x="16" y="60" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5">
      Forecasts vessel route risks, disruptions, and port congestion queues.
    </text>

    <!-- Stack -->
    <g transform="translate(16, 88)" font-family="'Fira Code', monospace" font-size="8.5">
      <rect width="50" height="18" rx="4" fill="#161B22" stroke="#334155" />
      <text x="25" y="12.5" fill="#34D399" text-anchor="middle">Python</text>
      <rect x="56" width="46" height="18" rx="4" fill="#161B22" stroke="#334155" />
      <text x="79" y="12.5" fill="#34D399" text-anchor="middle">Flask</text>
      <rect x="108" width="46" height="18" rx="4" fill="#161B22" stroke="#334155" />
      <text x="131" y="12.5" fill="#34D399" text-anchor="middle">React</text>
      <rect x="160" width="88" height="18" rx="4" fill="#161B22" stroke="#34D399" />
      <text x="204" y="12.5" fill="#34D399" font-weight="700" text-anchor="middle">Predictive ML</text>
    </g>
  </g>

  <!-- ROW 2 -->

  <!-- Card 3: RoadWatch (Animated Satellite Orbit) -->
  <g transform="translate(30, 200)">
    <rect width="380" height="125" rx="10" fill="#0D1117" stroke="#F59E0B" stroke-width="1" />
    
    <!-- Animated Satellite Orbit -->
    <g transform="translate(335, 36)">
      <circle cx="0" cy="0" r="16" fill="#161B22" stroke="#F59E0B" stroke-width="1" />
      <ellipse cx="0" cy="0" rx="12" ry="5" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 2">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite" />
      </ellipse>
      <circle cx="8" cy="0" r="2.5" fill="#00F2FE">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite" />
      </circle>
    </g>

    <text x="16" y="24" fill="#F59E0B" font-family="'Fira Code', monospace" font-size="12" font-weight="800">RoadWatch</text>
    <text x="16" y="42" fill="#CBD5E1" font-family="'Fira Code', monospace" font-size="9.5" font-weight="700">Infrastructure Risk Intelligence</text>
    <text x="16" y="60" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5">
      Geospatial road hazard telemetry, anomaly detection, and safety analytics.
    </text>

    <!-- Stack -->
    <g transform="translate(16, 88)" font-family="'Fira Code', monospace" font-size="8.5">
      <rect width="50" height="18" rx="4" fill="#161B22" stroke="#334155" />
      <text x="25" y="12.5" fill="#F59E0B" text-anchor="middle">Python</text>
      <rect x="56" width="70" height="18" rx="4" fill="#161B22" stroke="#334155" />
      <text x="91" y="12.5" fill="#F59E0B" text-anchor="middle">GIS Analytics</text>
      <rect x="132" width="78" height="18" rx="4" fill="#161B22" stroke="#F59E0B" />
      <text x="171" y="12.5" fill="#F59E0B" font-weight="700" text-anchor="middle">Data Science</text>
    </g>
  </g>

  <!-- Card 4: Attendance System (Animated Camera Scanner) -->
  <g transform="translate(430, 200)">
    <rect width="390" height="125" rx="10" fill="#0D1117" stroke="#818CF8" stroke-width="1" />
    
    <!-- Animated Camera Scanner Grid -->
    <g transform="translate(345, 36)">
      <circle cx="0" cy="0" r="16" fill="#161B22" stroke="#818CF8" stroke-width="1" />
      <rect x="-7" y="-7" width="5" height="5" fill="#818CF8">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" />
      </rect>
      <rect x="2" y="-7" width="5" height="5" fill="#00F2FE">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
      </rect>
      <rect x="-7" y="2" width="5" height="5" fill="#34D399">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1.2s" repeatCount="indefinite" />
      </rect>
      <rect x="2" y="2" width="5" height="5" fill="#C084FC">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" repeatCount="indefinite" />
      </rect>
    </g>

    <text x="16" y="24" fill="#818CF8" font-family="'Fira Code', monospace" font-size="12" font-weight="800">Smart Attendance &amp; TT</text>
    <text x="16" y="42" fill="#CBD5E1" font-family="'Fira Code', monospace" font-size="9.5" font-weight="700">Computer Vision + Scheduling System</text>
    <text x="16" y="60" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5">
      Automated attendance pipeline paired with constraint scheduling solver.
    </text>

    <!-- Stack -->
    <g transform="translate(16, 88)" font-family="'Fira Code', monospace" font-size="8.5">
      <rect width="50" height="18" rx="4" fill="#161B22" stroke="#334155" />
      <text x="25" y="12.5" fill="#818CF8" text-anchor="middle">Python</text>
      <rect x="56" width="50" height="18" rx="4" fill="#161B22" stroke="#334155" />
      <text x="81" y="12.5" fill="#818CF8" text-anchor="middle">OpenCV</text>
      <rect x="112" width="105" height="18" rx="4" fill="#161B22" stroke="#818CF8" />
      <text x="164.5" y="12.5" fill="#818CF8" font-weight="700" text-anchor="middle">Constraint Solver</text>
    </g>
  </g>

  <!-- ROW 3 -->

  <!-- Card 5: SmartCane (Animated AI Core) -->
  <g transform="translate(30, 340)">
    <rect width="790" height="125" rx="10" fill="#0D1117" stroke="#C084FC" stroke-width="1" />
    
    <!-- Animated AI Core Icon -->
    <g transform="translate(745, 62)">
      <circle cx="0" cy="0" r="24" fill="#161B22" stroke="#C084FC" stroke-width="1.2" />
      <circle cx="0" cy="0" r="14" fill="none" stroke="#00F2FE" stroke-width="1" stroke-dasharray="3 3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="5" fill="#34D399" />
    </g>

    <text x="20" y="28" fill="#C084FC" font-family="'Fira Code', monospace" font-size="13" font-weight="800">SmartCane</text>
    <text x="20" y="48" fill="#CBD5E1" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700">Assistive IoT Navigation &amp; Spatial Awareness System</text>
    <text x="20" y="70" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11.5">
      Intelligent multi-sensor assistive device providing real-time spatial mapping and adaptive haptic obstacle alerts.
    </text>

    <!-- Stack -->
    <g transform="translate(20, 94)" font-family="'Fira Code', monospace" font-size="9">
      <rect width="36" height="20" rx="4" fill="#161B22" stroke="#334155" />
      <text x="18" y="14" fill="#C084FC" text-anchor="middle">C</text>
      <rect x="44" width="78" height="20" rx="4" fill="#161B22" stroke="#334155" />
      <text x="83" y="14" fill="#C084FC" text-anchor="middle">IoT Sensors</text>
      <rect x="130" width="120" height="20" rx="4" fill="#161B22" stroke="#334155" />
      <text x="190" y="14" fill="#C084FC" text-anchor="middle">Embedded Systems</text>
      <rect x="258" width="135" height="20" rx="4" fill="#161B22" stroke="#C084FC" />
      <text x="325.5" y="14" fill="#C084FC" font-weight="700" text-anchor="middle">Hardware Firmware</text>
    </g>
  </g>
</svg>