<svg fill="none" width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rich Flowing Background Gradient -->
    <linearGradient id="header-bg-v4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19">
        <animate attributeName="stop-color" values="#0B0F19; #0F172A; #1E1B4B; #0B0F19" dur="14s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#0F172A">
        <animate attributeName="stop-color" values="#0F172A; #1E1B4B; #092540; #0F172A" dur="14s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0A192F">
        <animate attributeName="stop-color" values="#0A192F; #0B0F19; #0F172A; #0A192F" dur="14s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Cyan/Emerald/Violet Neon Border -->
    <linearGradient id="neon-border-v4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="33%" stop-color="#38BDF8" />
      <stop offset="66%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <linearGradient id="name-grad-v4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-v4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Frame -->
  <rect width="800" height="220" rx="14" fill="url(#header-bg-v4)" stroke="url(#neon-border-v4)" stroke-width="1.5" />

  <!-- Top Accent Shimmer -->
  <rect x="0" y="0" width="800" height="5" rx="2.5" fill="url(#neon-border-v4)" filter="url(#glow-v4)" />

  <!-- Animated Ambient Waves Background -->
  <g opacity="0.35">
    <path d="M 0 160 Q 200 130 400 160 T 800 160" fill="none" stroke="url(#neon-border-v4)" stroke-width="1.5">
      <animate attributeName="d" values="M 0 160 Q 200 130 400 160 T 800 160; M 0 145 Q 200 175 400 145 T 800 145; M 0 160 Q 200 130 400 160 T 800 160" dur="7s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Sophisticated Rotating AI Neural Orbit Core (Right Side) -->
  <g transform="translate(660, 110)">
    <!-- Outer Dashed Orbit Ring (Rotates Clockwise) -->
    <circle cx="0" cy="0" r="65" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="8 6" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
    </circle>

    <!-- Inner Orbit Ring (Rotates Counter-Clockwise) -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="#34D399" stroke-width="1.5" stroke-dasharray="14 10" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite" />
    </circle>

    <!-- Inner Core Circle -->
    <circle cx="0" cy="0" r="28" fill="#0F172A" stroke="#A78BFA" stroke-width="1.5" filter="url(#glow-v4)" />

    <!-- Core Center Dot -->
    <circle cx="0" cy="0" r="8" fill="#38BDF8">
      <animate attributeName="r" values="6;9;6" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite" />
    </circle>

    <!-- Orbit Nodes -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite" />
      <circle cx="46" cy="0" r="4.5" fill="#34D399" />
      <circle cx="-46" cy="0" r="4.5" fill="#38BDF8" />
      <circle cx="0" cy="46" r="4.5" fill="#A78BFA" />
      <circle cx="0" cy="-46" r="4.5" fill="#00F2FE" />
    </g>

    <text x="0" y="86" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">AI &amp; DATA SCIENCE</text>
  </g>

  <!-- Left Accent Bar -->
  <rect x="36" y="38" width="5" height="144" rx="2.5" fill="url(#neon-border-v4)" filter="url(#glow-v4)" />

  <!-- Main Name Title -->
  <text x="60" y="80" fill="url(#name-grad-v4)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    Kathyayini Prabhu
  </text>

  <!-- Role Subtitle -->
  <text x="60" y="114" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" letter-spacing="0.2">
    3rd Year Artificial Intelligence &amp; Data Science Student
  </text>

  <!-- Institution Tagline -->
  <text x="60" y="142" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500">
    BMS College of Engineering (BMSCE) • Bengaluru, India
  </text>

  <!-- Badges Row at Bottom -->
  <g transform="translate(60, 160)">
    <rect width="125" height="22" rx="11" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8" />
    <text x="62.5" y="15" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">DATA SCIENCE</text>

    <rect x="135" width="130" height="22" rx="11" fill="#1E293B" stroke="#34D399" stroke-width="0.8" />
    <text x="200" y="15" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">DATA ANALYTICS</text>

    <rect x="275" width="165" height="22" rx="11" fill="#1E293B" stroke="#A78BFA" stroke-width="0.8" />
    <text x="357.5" y="15" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">ARTIFICIAL INTELLIGENCE</text>
  </g>

  <!-- Top Right Live Status Badge -->
  <g transform="translate(585, 22)">
    <rect width="180" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-width="1" opacity="0.9" />
    <circle cx="15" cy="13" r="4" fill="#10B981" filter="url(#glow-v4)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="27" y="17" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">AI &amp; Data Science Student</text>
  </g>
</svg>
