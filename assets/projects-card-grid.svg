<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pcg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="100%" stop-color="#091026" />
    </linearGradient>

    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <filter id="pcg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shell Frame -->
  <rect width="880" height="500" rx="14" fill="url(#pcg-bg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- ROW 1 (Cards 1 & 2) -->

  <!-- CARD 1: BioWeaver (Cyan/Green Glow) -->
  <g transform="translate(24, 24)">
    <rect width="404" height="135" rx="12" fill="#0D1117" stroke="#34D399" stroke-width="1.2" filter="url(#pcg-glow)" />
    
    <!-- Top Pill -->
    <rect x="16" y="14" width="142" height="18" rx="9" fill="#064E3B" stroke="#34D399" stroke-width="0.8" />
    <text x="87" y="26.5" fill="#34D399" font-family="'Fira Code', monospace" font-size="8" font-weight="800" text-anchor="middle">BIOLOGICAL DISCOVERY</text>

    <!-- Title & Description -->
    <text x="16" y="52" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">BioWeaver</text>
    <text x="16" y="70" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">
      AI platform for gene&#8211;disease relationship prediction &amp; discovery hypotheses.
    </text>

    <!-- Tech Stack & Button -->
    <g transform="translate(16, 92)" font-family="'Fira Code', monospace" font-size="8.5">
      <rect width="48" height="20" rx="10" fill="#161B22" stroke="#334155" />
      <text x="24" y="13.5" fill="#38BDF8" text-anchor="middle">Python</text>

      <rect x="54" width="44" height="20" rx="10" fill="#161B22" stroke="#334155" />
      <text x="76" y="13.5" fill="#38BDF8" text-anchor="middle">Flask</text>

      <rect x="104" width="46" height="20" rx="10" fill="#161B22" stroke="#334155" />
      <text x="127" y="13.5" fill="#38BDF8" text-anchor="middle">React</text>

      <!-- Action Button -->
      <a href="https://github.com/Kathyayini26/bioweaver" target="_blank">
        <rect x="160" width="138" height="22" rx="4" fill="url(#btn-grad)" />
        <text x="229" y="14.5" fill="#FFFFFF" font-weight="800" font-size="8" text-anchor="middle">EXPLORE REPOSITORY &#8594;</text>
      </a>
    </g>
  </g>

  <!-- CARD 2: AI Maritime Risk Intelligence (Purple Glow) -->
  <g transform="translate(452, 24)">
    <rect width="404" height="135" rx="12" fill="#0D1117" stroke="#818CF8" stroke-width="1.2" filter="url(#pcg-glow)" />
    
    <!-- Top Pill -->
    <rect x="16" y="14" width="145" height="18" rx="9" fill="#1E1B4B" stroke="#818CF8" stroke-width="0.8" />
    <text x="88.5" y="26.5" fill="#818CF8" font-family="'Fira Code', monospace" font-size="8" font-weight="800" text-anchor="middle">MARITIME LOGISTICS AI</text>

    <!-- Title & Description -->
    <text x="16" y="52" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">AI Maritime Risk Intelligence</text>
    <text x="16" y="70" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">
      Logistics intelligence for route risk prediction &amp; port optimization analytics.
    </text>

    <!-- Tech Stack & Button -->
    <g transform="translate(16, 92)" font-family="'Fira Code', monospace" font-size="8.5">
      <rect width="48" height="20" rx="10" fill="#161B22" stroke="#334155" />
      <text x="24" y="13.5" fill="#818CF8" text-anchor="middle">Python</text>

      <rect x="54" width="44" height="20" rx="10" fill="#161B22" stroke="#334155" />
      <text x="76" y="13.5" fill="#818CF8" text-anchor="middle">Flask</text>

      <rect x="104" width="46" height="20" rx="10" fill="#161B22" stroke="#334155" />
      <text x="127" y="13.5" fill="#818CF8" text-anchor="middle">React</text>

      <!-- Action Button -->
      <a href="https://github.com/Kathyayini26" target="_blank">
        <rect x="160" width="138" height="22" rx="4" fill="url(#btn-grad)" />
        <text x="229" y="14.5" fill="#FFFFFF" font-weight="800" font-size="8" text-anchor="middle">EXPLORE REPOSITORY &#8594;</text>
      </a>
    </g>
  </g>

  <!-- ROW 2 (Cards 3 & 4) -->

  <!-- CARD 3: RoadWatch (Amber Glow) -->
  <g transform="translate(24, 180)">
    <rect width="404" height="135" rx="12" fill="#0D1117" stroke="#F59E0B" stroke-width="1.2" filter="url(#pcg-glow)" />
    
    <!-- Top Pill -->
    <rect x="16" y="14" width="135" height="18" rx="9" fill="#451A03" stroke="#F59E0B" stroke-width="0.8" />
    <text x="83.5" y="26.5" fill="#F59E0B" font-family="'Fira Code', monospace" font-size="8" font-weight="800" text-anchor="middle">INFRASTRUCTURE RISK</text>

    <!-- Title & Description -->
    <text x="16" y="52" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">RoadWatch</text>
    <text x="16" y="70" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">
      Geospatial hazard telemetry &amp; anomaly detection for road infrastructure safety.
    </text>

    <!-- Tech Stack & Button -->
    <g transform="translate(16, 92)" font-family="'Fira Code', monospace" font-size="8.5">
      <rect width="48" height="20" rx="10" fill="#161B22" stroke="#334155" />
      <text x="24" y="13.5" fill="#F59E0B" text-anchor="middle">Python</text>

      <rect x="54" width="70" height="20" rx="10" fill="#161B22" stroke="#334155" />
      <text x="89" y="13.5" fill="#F59E0B" text-anchor="middle">GIS Analytics</text>

      <rect x="130" width="46" height="20" rx="10" fill="#161B22" stroke="#334155" />
      <text x="153" y="13.5" fill="#F59E0B" text-anchor="middle">Pandas</text>

      <!-- Action Button -->
      <a href="https://github.com/Kathyayini26" target="_blank">
        <rect x="185" width="138" height="22" rx="4" fill="url(#btn-grad)" />
        <text x="254" y="14.5" fill="#FFFFFF" font-weight="800" font-size="8" text-anchor="middle">EXPLORE REPOSITORY &#8594;</text>
      </a>
    </g>
  </g>

  <!-- CARD 4: Smart Attendance (Cyan/Blue Glow) -->
  <g transform="translate(452, 180)">
    <rect width="404" height="135" rx="12" fill="#0D1117" stroke="#00F2FE" stroke-width="1.2" filter="url(#pcg-glow)" />
    
    <!-- Top Pill -->
    <rect x="16" y="14" width="135" height="18" rx="9" fill="#082F49" stroke="#00F2FE" stroke-width="0.8" />
    <text x="83.5" y="26.5" fill="#00F2FE" font-family="'Fira Code', monospace" font-size="8" font-weight="800" text-anchor="middle">COMPUTER VISION AI</text>

    <!-- Title & Description -->
    <text x="16" y="52" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">Smart Attendance &amp; TT</text>
    <text x="16" y="70" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">
      Automated biometric attendance pipeline paired with timetable scheduling solver.
    </text>

    <!-- Tech Stack & Button -->
    <g transform="translate(16, 92)" font-family="'Fira Code', monospace" font-size="8.5">
      <rect width="48" height="20" rx="10" fill="#161B22" stroke="#334155" />
      <text x="24" y="13.5" fill="#00F2FE" text-anchor="middle">Python</text>

      <rect x="54" width="48" height="20" rx="10" fill="#161B22" stroke="#334155" />
      <text x="78" y="13.5" fill="#00F2FE" text-anchor="middle">OpenCV</text>

      <rect x="108" width="44" height="20" rx="10" fill="#161B22" stroke="#334155" />
      <text x="130" y="13.5" fill="#00F2FE" text-anchor="middle">Flask</text>

      <!-- Action Button -->
      <a href="https://github.com/Kathyayini26" target="_blank">
        <rect x="160" width="138" height="22" rx="4" fill="url(#btn-grad)" />
        <text x="229" y="14.5" fill="#FFFFFF" font-weight="800" font-size="8" text-anchor="middle">EXPLORE REPOSITORY &#8594;</text>
      </a>
    </g>
  </g>

  <!-- ROW 3 (Card 5 Wide) -->

  <!-- CARD 5: SmartCane (Purple Glow) -->
  <g transform="translate(24, 335)">
    <rect width="832" height="135" rx="12" fill="#0D1117" stroke="#C084FC" stroke-width="1.2" filter="url(#pcg-glow)" />
    
    <!-- Top Pill -->
    <rect x="16" y="14" width="115" height="18" rx="9" fill="#2E1065" stroke="#C084FC" stroke-width="0.8" />
    <text x="73.5" y="26.5" fill="#C084FC" font-family="'Fira Code', monospace" font-size="8" font-weight="800" text-anchor="middle">ASSISTIVE IOT</text>

    <!-- Title & Description -->
    <text x="16" y="52" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">SmartCane</text>
    <text x="16" y="70" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5">
      Intelligent multi-sensor assistive navigation and obstacle avoidance device with adaptive haptic alerts.
    </text>

    <!-- Tech Stack & Button -->
    <g transform="translate(16, 92)" font-family="'Fira Code', monospace" font-size="8.5">
      <rect width="32" height="20" rx="10" fill="#161B22" stroke="#334155" />
      <text x="16" y="13.5" fill="#C084FC" text-anchor="middle">C</text>

      <rect x="38" width="85" height="20" rx="10" fill="#161B22" stroke="#334155" />
      <text x="80.5" y="13.5" fill="#C084FC" text-anchor="middle">IoT Sensors</text>

      <rect x="129" width="115" height="20" rx="10" fill="#161B22" stroke="#334155" />
      <text x="186.5" y="13.5" fill="#C084FC" text-anchor="middle">Embedded Firmware</text>

      <!-- Action Button -->
      <a href="https://github.com/Kathyayini26" target="_blank">
        <rect x="254" width="145" height="22" rx="4" fill="url(#btn-grad)" />
        <text x="326.5" y="14.5" fill="#FFFFFF" font-weight="800" font-size="8" text-anchor="middle">EXPLORE REPOSITORY &#8594;</text>
      </a>
    </g>
  </g>
</svg>