<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ncm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816">
        <animate attributeName="stop-color" values="#050816; #070B1F; #0A1028; #050816" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#070B1F">
        <animate attributeName="stop-color" values="#070B1F; #0E122C; #06152B; #070B1F" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0A1028">
        <animate attributeName="stop-color" values="#0A1028; #050816; #070B1F; #0A1028" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="ncm-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="35%" stop-color="#34D399" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <filter id="ncm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shell Frame -->
  <rect width="920" height="450" rx="16" fill="url(#ncm-bg)" stroke="#1E293B" stroke-width="1.8" />
  <rect x="0" y="0" width="920" height="3.5" rx="1.75" fill="url(#ncm-border)" filter="url(#ncm-glow)" />

  <!-- Animated Neural Interconnect Lines -->
  <g stroke="#38BDF8" stroke-width="1" opacity="0.25" stroke-dasharray="4 4">
    <line x1="240" y1="140" x2="680" y2="140">
      <animate attributeName="opacity" values="0.15;0.4;0.15" dur="3s" repeatCount="indefinite" />
    </line>
    <line x1="240" y1="320" x2="680" y2="320">
      <animate attributeName="opacity" values="0.4;0.15;0.4" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="460" y1="80" x2="460" y2="400">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3.5s" repeatCount="indefinite" />
    </line>
    <line x1="240" y1="140" x2="680" y2="320">
      <animate attributeName="opacity" values="0.1;0.35;0.1" dur="5s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Top Bar -->
  <g transform="translate(32, 22)">
    <text x="0" y="12" fill="#00F2FE" font-family="'Fira Code', monospace" font-size="12.5" font-weight="800" letter-spacing="1">NEURAL CAPABILITY MATRIX // ACTIVE SYSTEM MODULES</text>
    <text x="856" y="12" fill="#34D399" font-family="'Fira Code', monospace" font-size="10.5" font-weight="800" text-anchor="end">INTELLIGENCE ONLINE &#9679;</text>
  </g>
  <line x1="30" y1="42" x2="890" y2="42" stroke="#1E293B" stroke-width="1.2" />

  <!-- 4 FUTURISTIC CAPABILITY MODULES -->

  <!-- Module 1: AI & ML (Neon Cyan Glow) -->
  <g transform="translate(32, 58)">
    <rect width="418" height="175" rx="12" fill="#0D1117" stroke="#00F2FE" stroke-width="1.2" filter="url(#ncm-glow)" />
    
    <!-- Title Bar -->
    <g transform="translate(18, 22)">
      <circle cx="5" cy="0" r="4.5" fill="#00F2FE" />
      <text x="18" y="4" fill="#00F2FE" font-family="'Fira Code', monospace" font-size="13" font-weight="800" letter-spacing="0.5">ARTIFICIAL INTEL &amp; MACHINE LEARNING</text>
    </g>
    <line x1="18" y1="36" x2="400" y2="36" stroke="#1E293B" stroke-width="1" />

    <!-- Glowing Skill Capsules -->
    <g transform="translate(18, 52)" font-family="'Fira Code', monospace" font-size="11">
      <!-- Row 1 -->
      <rect width="145" height="26" rx="6" fill="#161B22" stroke="#00F2FE" stroke-width="1" />
      <text x="72.5" y="17" fill="#E2E8F0" font-weight="600" text-anchor="middle">Machine Learning</text>

      <rect x="155" width="160" height="26" rx="6" fill="#161B22" stroke="#00F2FE" stroke-width="1" />
      <text x="235" y="17" fill="#E2E8F0" font-weight="600" text-anchor="middle">Predictive Modeling</text>

      <!-- Row 2 -->
      <rect y="34" width="160" height="26" rx="6" fill="#161B22" stroke="#00F2FE" stroke-width="1" />
      <text x="80" y="51" fill="#E2E8F0" font-weight="600" text-anchor="middle">Feature Engineering</text>

      <rect x="170" y="34" width="120" height="26" rx="6" fill="#161B22" stroke="#00F2FE" stroke-width="1" />
      <text x="230" y="51" fill="#E2E8F0" font-weight="600" text-anchor="middle">Scikit-Learn</text>

      <!-- Row 3 -->
      <rect y="68" width="145" height="26" rx="6" fill="#161B22" stroke="#00F2FE" stroke-width="1" />
      <text x="72.5" y="85" fill="#E2E8F0" font-weight="600" text-anchor="middle">Model Evaluation</text>

      <rect x="155" y="68" width="140" height="26" rx="6" fill="#161B22" stroke="#00F2FE" stroke-width="1" />
      <text x="225" y="85" fill="#E2E8F0" font-weight="600" text-anchor="middle">AI Applications</text>
    </g>
  </g>

  <!-- Module 2: Data Science & Analytics (Neon Emerald Glow) -->
  <g transform="translate(470, 58)">
    <rect width="418" height="175" rx="12" fill="#0D1117" stroke="#34D399" stroke-width="1.2" filter="url(#ncm-glow)" />
    
    <!-- Title Bar -->
    <g transform="translate(18, 22)">
      <circle cx="5" cy="0" r="4.5" fill="#34D399" />
      <text x="18" y="4" fill="#34D399" font-family="'Fira Code', monospace" font-size="13" font-weight="800" letter-spacing="0.5">DATA SCIENCE &amp; ANALYTICS</text>
    </g>
    <line x1="18" y1="36" x2="400" y2="36" stroke="#1E293B" stroke-width="1" />

    <!-- Glowing Skill Capsules -->
    <g transform="translate(18, 52)" font-family="'Fira Code', monospace" font-size="11">
      <!-- Row 1 -->
      <rect width="125" height="26" rx="6" fill="#161B22" stroke="#34D399" stroke-width="1" />
      <text x="62.5" y="17" fill="#E2E8F0" font-weight="600" text-anchor="middle">Data Analysis</text>

      <rect x="135" width="95" height="26" rx="6" fill="#161B22" stroke="#34D399" stroke-width="1" />
      <text x="182.5" y="17" fill="#E2E8F0" font-weight="600" text-anchor="middle">EDA (Expl.)</text>

      <rect x="240" width="140" height="26" rx="6" fill="#161B22" stroke="#34D399" stroke-width="1" />
      <text x="310" y="17" fill="#E2E8F0" font-weight="600" text-anchor="middle">Statistical Analysis</text>

      <!-- Row 2 -->
      <rect y="34" width="75" height="26" rx="6" fill="#161B22" stroke="#34D399" stroke-width="1" />
      <text x="37.5" y="51" fill="#E2E8F0" font-weight="600" text-anchor="middle">Pandas</text>

      <rect x="85" y="34" width="70" height="26" rx="6" fill="#161B22" stroke="#34D399" stroke-width="1" />
      <text x="120" y="51" fill="#E2E8F0" font-weight="600" text-anchor="middle">NumPy</text>

      <rect x="165" y="34" width="80" height="26" rx="6" fill="#161B22" stroke="#34D399" stroke-width="1" />
      <text x="205" y="51" fill="#E2E8F0" font-weight="600" text-anchor="middle">Tableau</text>

      <!-- Row 3 -->
      <rect y="68" width="150" height="26" rx="6" fill="#161B22" stroke="#34D399" stroke-width="1" />
      <text x="75" y="85" fill="#E2E8F0" font-weight="600" text-anchor="middle">Data Visualization</text>
    </g>
  </g>

  <!-- Module 3: Software Engineering (Neon Violet Glow) -->
  <g transform="translate(32, 248)">
    <rect width="418" height="175" rx="12" fill="#0D1117" stroke="#818CF8" stroke-width="1.2" filter="url(#ncm-glow)" />
    
    <!-- Title Bar -->
    <g transform="translate(18, 22)">
      <circle cx="5" cy="0" r="4.5" fill="#818CF8" />
      <text x="18" y="4" fill="#818CF8" font-family="'Fira Code', monospace" font-size="13" font-weight="800" letter-spacing="0.5">SOFTWARE ENGINEERING</text>
    </g>
    <line x1="18" y1="36" x2="400" y2="36" stroke="#1E293B" stroke-width="1" />

    <!-- Glowing Skill Capsules -->
    <g transform="translate(18, 52)" font-family="'Fira Code', monospace" font-size="11">
      <!-- Row 1 -->
      <rect width="75" height="26" rx="6" fill="#161B22" stroke="#818CF8" stroke-width="1" />
      <text x="37.5" y="17" fill="#E2E8F0" font-weight="600" text-anchor="middle">Python</text>

      <rect x="85" width="65" height="26" rx="6" fill="#161B22" stroke="#818CF8" stroke-width="1" />
      <text x="117.5" y="17" fill="#E2E8F0" font-weight="600" text-anchor="middle">Flask</text>

      <rect x="160" width="80" height="26" rx="6" fill="#161B22" stroke="#818CF8" stroke-width="1" />
      <text x="200" y="17" fill="#E2E8F0" font-weight="600" text-anchor="middle">FastAPI</text>

      <rect x="250" width="95" height="26" rx="6" fill="#161B22" stroke="#818CF8" stroke-width="1" />
      <text x="297.5" y="17" fill="#E2E8F0" font-weight="600" text-anchor="middle">REST APIs</text>

      <!-- Row 2 -->
      <rect y="34" width="70" height="26" rx="6" fill="#161B22" stroke="#818CF8" stroke-width="1" />
      <text x="35" y="51" fill="#E2E8F0" font-weight="600" text-anchor="middle">React</text>

      <rect x="80" y="34" width="55" height="26" rx="6" fill="#161B22" stroke="#818CF8" stroke-width="1" />
      <text x="107.5" y="51" fill="#E2E8F0" font-weight="600" text-anchor="middle">Git</text>

      <rect x="145" y="34" width="75" height="26" rx="6" fill="#161B22" stroke="#818CF8" stroke-width="1" />
      <text x="182.5" y="51" fill="#E2E8F0" font-weight="600" text-anchor="middle">GitHub</text>

      <!-- Row 3 -->
      <rect y="68" width="165" height="26" rx="6" fill="#161B22" stroke="#818CF8" stroke-width="1" />
      <text x="82.5" y="85" fill="#E2E8F0" font-weight="600" text-anchor="middle">Scalable Software Dev</text>
    </g>
  </g>

  <!-- Module 4: Database Engineering (Neon Amber Glow) -->
  <g transform="translate(470, 248)">
    <rect width="418" height="175" rx="12" fill="#0D1117" stroke="#F59E0B" stroke-width="1.2" filter="url(#ncm-glow)" />
    
    <!-- Title Bar -->
    <g transform="translate(18, 22)">
      <circle cx="5" cy="0" r="4.5" fill="#F59E0B" />
      <text x="18" y="4" fill="#F59E0B" font-family="'Fira Code', monospace" font-size="13" font-weight="800" letter-spacing="0.5">DATABASE ENGINEERING</text>
    </g>
    <line x1="18" y1="36" x2="400" y2="36" stroke="#1E293B" stroke-width="1" />

    <!-- Glowing Skill Capsules -->
    <g transform="translate(18, 52)" font-family="'Fira Code', monospace" font-size="11">
      <!-- Row 1 -->
      <rect width="55" height="26" rx="6" fill="#161B22" stroke="#F59E0B" stroke-width="1" />
      <text x="27.5" y="17" fill="#E2E8F0" font-weight="600" text-anchor="middle">SQL</text>

      <rect x="65" width="70" height="26" rx="6" fill="#161B22" stroke="#F59E0B" stroke-width="1" />
      <text x="100" y="17" fill="#E2E8F0" font-weight="600" text-anchor="middle">MySQL</text>

      <rect x="145" width="75" height="26" rx="6" fill="#161B22" stroke="#F59E0B" stroke-width="1" />
      <text x="182.5" y="17" fill="#E2E8F0" font-weight="600" text-anchor="middle">SQLite</text>

      <rect x="230" width="135" height="26" rx="6" fill="#161B22" stroke="#F59E0B" stroke-width="1" />
      <text x="297.5" y="17" fill="#E2E8F0" font-weight="600" text-anchor="middle">Database Design</text>

      <!-- Row 2 -->
      <rect y="34" width="160" height="26" rx="6" fill="#161B22" stroke="#F59E0B" stroke-width="1" />
      <text x="80" y="51" fill="#E2E8F0" font-weight="600" text-anchor="middle">Query Optimization</text>

      <rect x="170" y="34" width="165" height="26" rx="6" fill="#161B22" stroke="#F59E0B" stroke-width="1" />
      <text x="252.5" y="51" fill="#E2E8F0" font-weight="600" text-anchor="middle">Relational Databases</text>
    </g>
  </g>
</svg>