<svg fill="none" width="800" height="230" viewBox="0 0 800 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Refined Modern Dark Background (No Sci-Fi Glow) -->
    <linearGradient id="header-bg-v9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="50%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>

    <!-- Warm Professional Accent Line (Royal Blue to Warm Amber) -->
    <linearGradient id="accent-grad-v9" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Container Frame -->
  <rect width="800" height="230" rx="14" fill="url(#header-bg-v9)" stroke="#374151" stroke-width="1.2" />

  <!-- Top Accent Line -->
  <rect x="0" y="0" width="800" height="4.5" rx="2.25" fill="url(#accent-grad-v9)" />

  <!-- Refined Architectural Network Topology (Right Side - Warm Indigo & Amber Colors) -->
  <g transform="translate(540, 20)" opacity="0.75">
    <polygon points="40,40 100,20 180,50 140,110 60,130" fill="none" stroke="#3B82F6" stroke-width="0.9" opacity="0.4" />
    <polygon points="100,20 180,50 210,110 140,110 110,70" fill="none" stroke="#F59E0B" stroke-width="0.9" opacity="0.4" />

    <line x1="40" y1="40" x2="110" y2="70" stroke="#3B82F6" stroke-width="1.2" />
    <line x1="100" y1="20" x2="110" y2="70" stroke="#F59E0B" stroke-width="1.2" />
    <line x1="180" y1="50" x2="110" y2="70" stroke="#6366F1" stroke-width="1.2" />
    <line x1="140" y1="110" x2="110" y2="70" stroke="#3B82F6" stroke-width="1.2" />
    <line x1="60" y1="130" x2="110" y2="70" stroke="#F59E0B" stroke-width="1.2" />
    <line x1="180" y1="50" x2="210" y2="110" stroke="#6366F1" stroke-width="1.2" />
    <line x1="140" y1="110" x2="210" y2="110" stroke="#3B82F6" stroke-width="1.2" />

    <!-- Nodes -->
    <circle cx="110" cy="70" r="5.5" fill="#3B82F6" />
    <circle cx="40" cy="40" r="4.5" fill="#60A5FA" />
    <circle cx="100" cy="20" r="4.5" fill="#F59E0B" />
    <circle cx="180" cy="50" r="5" fill="#818CF8" />
    <circle cx="140" cy="110" r="4.5" fill="#3B82F6" />
    <circle cx="60" cy="130" r="4" fill="#F59E0B" />
    <circle cx="210" cy="110" r="5" fill="#60A5FA" />

    <text x="110" y="160" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="1">AI &amp; DATA ARCHITECTURE</text>
  </g>

  <!-- Left Accent Bar -->
  <rect x="36" y="38" width="5" height="152" rx="2.5" fill="url(#accent-grad-v9)" />

  <!-- Main Name Title -->
  <text x="60" y="80" fill="#F9FAFB" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    Kathyayini Prabhu
  </text>

  <!-- Role Subtitle -->
  <text x="60" y="114" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" letter-spacing="0.2">
    3rd Year Artificial Intelligence &amp; Data Science Student
  </text>

  <!-- Institution Tagline -->
  <text x="60" y="142" fill="#E5E7EB" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500">
    BMS College of Engineering (BMSCE) • Bengaluru, India
  </text>

  <!-- Badges Row at Bottom -->
  <g transform="translate(60, 166)">
    <rect width="125" height="24" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1" />
    <text x="62.5" y="16" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">DATA SCIENCE</text>

    <rect x="135" width="145" height="24" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1" />
    <text x="207.5" y="16" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">MACHINE LEARNING</text>

    <rect x="290" width="165" height="24" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1" />
    <text x="372.5" y="16" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">ARTIFICIAL INTELLIGENCE</text>
  </g>

  <!-- Top Right Status Badge -->
  <g transform="translate(585, 22)">
    <rect width="180" height="26" rx="13" fill="#1E293B" stroke="#3B82F6" stroke-width="1" />
    <circle cx="15" cy="13" r="4" fill="#10B981" />
    <text x="27" y="17" fill="#E5E7EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">AI &amp; Data Science Student</text>
  </g>
</svg>
