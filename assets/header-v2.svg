<svg fill="none" width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rich Flowing Background Gradient -->
    <linearGradient id="header-bg-v2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19">
        <animate attributeName="stop-color" values="#0B0F19; #0F172A; #1E1B4B; #0B0F19" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#0F172A">
        <animate attributeName="stop-color" values="#0F172A; #1E1B4B; #092540; #0F172A" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0A192F">
        <animate attributeName="stop-color" values="#0A192F; #0B0F19; #0F172A; #0A192F" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Cyan/Emerald/Indigo Neon Border -->
    <linearGradient id="neon-border-v2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="33%" stop-color="#38BDF8" />
      <stop offset="66%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-v2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Frame -->
  <rect width="800" height="220" rx="14" fill="url(#header-bg-v2)" stroke="url(#neon-border-v2)" stroke-width="1.5" />

  <!-- Top Accent Shimmer -->
  <rect x="0" y="0" width="800" height="4.5" rx="2" fill="url(#neon-border-v2)" filter="url(#glow-v2)" />

  <!-- Animated Ambient Geometric Wave Lines -->
  <g opacity="0.45">
    <path d="M 0 160 Q 200 130 400 160 T 800 160" fill="none" stroke="url(#neon-border-v2)" stroke-width="1.8">
      <animate attributeName="d" values="M 0 160 Q 200 130 400 160 T 800 160; M 0 145 Q 200 175 400 145 T 800 145; M 0 160 Q 200 130 400 160 T 800 160" dur="7s" repeatCount="indefinite" />
    </path>
    <path d="M 0 185 Q 200 205 400 185 T 800 185" fill="none" stroke="#A78BFA" stroke-width="1.2" opacity="0.5">
      <animate attributeName="d" values="M 0 185 Q 200 205 400 185 T 800 185; M 0 195 Q 200 165 400 195 T 800 195; M 0 185 Q 200 205 400 185 T 800 185" dur="9s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Constellation Network Mesh (Right Side) -->
  <g opacity="0.5" filter="url(#glow-v2)">
    <line x1="585" y1="50" x2="665" y2="90" stroke="#38BDF8" stroke-width="1.2" />
    <line x1="665" y1="90" x2="745" y2="45" stroke="#34D399" stroke-width="1.2" />
    <line x1="665" y1="90" x2="715" y2="160" stroke="#A78BFA" stroke-width="1.2" />
    <line x1="585" y1="50" x2="625" y2="140" stroke="#38BDF8" stroke-width="1.2" />
    <line x1="625" y1="140" x2="715" y2="160" stroke="#38BDF8" stroke-width="1.2" />

    <circle cx="585" cy="50" r="4.5" fill="#38BDF8">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="665" cy="90" r="5.5" fill="#00F2FE">
      <animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="745" cy="45" r="4.5" fill="#34D399">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="715" cy="160" r="5" fill="#A78BFA">
      <animate attributeName="r" values="4;6;4" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="625" cy="140" r="4" fill="#38BDF8" />
  </g>

  <!-- Left Shimmer Accent Bar -->
  <rect x="36" y="42" width="5" height="136" rx="2.5" fill="url(#neon-border-v2)" filter="url(#glow-v2)" />

  <!-- Name Title -->
  <text x="62" y="84" fill="#F9FAFB" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="33" font-weight="800" letter-spacing="-0.5">
    Kathyayini Prabhu
  </text>

  <!-- Role & Degree Subtitle -->
  <text x="62" y="118" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="600" letter-spacing="0.2">
    3rd Year Artificial Intelligence &amp; Data Science Student
  </text>

  <!-- Institution Tagline -->
  <text x="62" y="146" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400">
    BMS College of Engineering (BMSCE) • Bengaluru, India
  </text>

  <!-- Top Right Status Badge -->
  <g transform="translate(585, 26)">
    <rect width="180" height="28" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1" opacity="0.9" />
    <circle cx="16" cy="14" r="4.5" fill="#10B981" filter="url(#glow-v2)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18" fill="#E5E7EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">AI &amp; Data Science Student</text>
  </g>
</svg>
