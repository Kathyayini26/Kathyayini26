<svg fill="none" width="800" height="210" viewBox="0 0 800 210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pro-proj-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="800" height="210" rx="10" fill="url(#pro-proj-bg)" stroke="#30363D" stroke-width="1.2" />

  <!-- 2 Clean Executive Project Cards -->
  <g transform="translate(22, 22)">
    <!-- Project 1: BioWeaver -->
    <g transform="translate(0, 0)">
      <rect width="366" height="166" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
      
      <!-- Category Tag -->
      <rect x="16" y="16" width="135" height="20" rx="4" fill="#0969DA" />
      <text x="83.5" y="29.5" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">BIOLOGICAL DISCOVERY</text>
      
      <!-- Title -->
      <text x="16" y="58" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">BioWeaver Engine</text>
      
      <!-- Description -->
      <text x="16" y="80" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400">AI platform integrating biological knowledge graphs</text>
      <text x="16" y="96" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400">to predict gene–disease relationships &amp; hypotheses.</text>

      <!-- Tech Stack Pills -->
      <g transform="translate(16, 116)">
        <rect width="55" height="18" rx="4" fill="#21262D" stroke="#30363D" stroke-width="0.8" />
        <text x="27.5" y="12.5" fill="#58A6FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Python</text>

        <rect x="61" width="50" height="18" rx="4" fill="#21262D" stroke="#30363D" stroke-width="0.8" />
        <text x="86" y="12.5" fill="#58A6FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Flask</text>

        <rect x="117" width="50" height="18" rx="4" fill="#21262D" stroke="#30363D" stroke-width="0.8" />
        <text x="142" y="12.5" fill="#58A6FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">React</text>
      </g>
    </g>

    <!-- Project 2: AI Maritime Risk Intelligence -->
    <g transform="translate(388, 0)">
      <rect width="366" height="166" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
      
      <!-- Category Tag -->
      <rect x="16" y="16" width="140" height="20" rx="4" fill="#0969DA" />
      <text x="86" y="29.5" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">MARITIME LOGISTICS AI</text>
      
      <!-- Title -->
      <text x="16" y="58" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">AI Maritime Risk Intelligence</text>
      
      <!-- Description -->
      <text x="16" y="80" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400">Logistics intelligence platform for route risk prediction,</text>
      <text x="16" y="96" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400">seasonal forecasting &amp; port optimization analytics.</text>

      <!-- Tech Stack Pills -->
      <g transform="translate(16, 116)">
        <rect width="55" height="18" rx="4" fill="#21262D" stroke="#30363D" stroke-width="0.8" />
        <text x="27.5" y="12.5" fill="#58A6FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Python</text>

        <rect x="61" width="50" height="18" rx="4" fill="#21262D" stroke="#30363D" stroke-width="0.8" />
        <text x="86" y="12.5" fill="#58A6FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Flask</text>

        <rect x="117" width="50" height="18" rx="4" fill="#21262D" stroke="#30363D" stroke-width="0.8" />
        <text x="142" y="12.5" fill="#58A6FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">React</text>
      </g>
    </g>
