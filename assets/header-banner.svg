<svg fill="none" width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="50%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#091E3A" />
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969DA" />
      <stop offset="50%" stop-color="#58A6FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="200" rx="12" fill="url(#bg-grad)" stroke="#30363D" stroke-width="1.5" />

  <!-- Geometric Grid Pattern (Subtle Tech Aesthetic) -->
  <g opacity="0.08" stroke="#58A6FF" stroke-width="1">
    <path d="M 0,40 L 800,40 M 0,80 L 800,80 M 0,120 L 800,120 M 0,160 L 800,160" />
    <path d="M 100,0 L 100,200 M 200,0 L 200,200 M 300,0 L 300,200 M 400,0 L 400,200 M 500,0 L 500,200 M 600,0 L 600,200 M 700,0 L 700,200" />
  </g>

  <!-- Constellation / Data Network Graphic (Right Side) -->
  <g opacity="0.25">
    <line x1="600" y1="50" x2="680" y2="90" stroke="#58A6FF" stroke-width="1.5" />
    <line x1="680" y1="90" x2="740" y2="40" stroke="#58A6FF" stroke-width="1.5" />
    <line x1="680" y1="90" x2="720" y2="150" stroke="#58A6FF" stroke-width="1.5" />
    <line x1="600" y1="50" x2="630" y2="130" stroke="#58A6FF" stroke-width="1.5" />
    <line x1="630" y1="130" x2="720" y2="150" stroke="#58A6FF" stroke-width="1.5" />
    <line x1="720" y1="150" x2="770" y2="120" stroke="#58A6FF" stroke-width="1.5" />

    <circle cx="600" cy="50" r="4" fill="#0969DA" filter="url(#subtle-glow)" />
    <circle cx="680" cy="90" r="5" fill="#58A6FF" filter="url(#subtle-glow)" />
    <circle cx="740" cy="40" r="4" fill="#38BDF8" />
    <circle cx="720" cy="150" r="5" fill="#0969DA" />
    <circle cx="630" cy="130" r="3.5" fill="#58A6FF" />
    <circle cx="770" cy="120" r="3" fill="#38BDF8" />
  </g>

  <!-- Left Accent Bar -->
  <rect x="40" y="45" width="5" height="110" rx="2.5" fill="url(#accent-grad)" />

  <!-- Main Name Title -->
  <text x="60" y="82" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="800" letter-spacing="0.5">
    Kathyayini Prabhu
  </text>

  <!-- Subtitle / Role -->
  <text x="60" y="115" fill="#58A6FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0.3">
    AI &amp; Data Science Student
  </text>

  <!-- Focus Tagline -->
  <text x="60" y="140" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">
    Building AI, Data Analytics &amp; Full-Stack Projects • Bengaluru, India
  </text>

  <!-- Top Right Status Pill -->
  <g transform="translate(620, 25)">
    <rect width="140" height="26" rx="13" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <circle cx="16" cy="13" r="4" fill="#3FB950" />
    <text x="28" y="17" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Open to Learn &amp; Build</text>
  </g>
</svg>
