<svg fill="none" width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Animated Flowing Gradient Background -->
    <linearGradient id="animated-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117">
        <animate attributeName="stop-color" values="#0D1117; #161B22; #0A192F; #0D1117" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#161B22">
        <animate attributeName="stop-color" values="#161B22; #0A192F; #0F2B48; #161B22" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0A192F">
        <animate attributeName="stop-color" values="#0A192F; #0D1117; #161B22; #0A192F" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Animated Shimmer Accent Bar -->
    <linearGradient id="shimmer-bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <!-- Animated Wave Line Gradient -->
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Main Background Container -->
  <rect width="800" height="200" rx="12" fill="url(#animated-bg)" stroke="#30363D" stroke-width="1" />

  <!-- Animated Background Wave Paths (Subtle Moving Lines) -->
  <g opacity="0.6">
    <path d="M 0 140 Q 200 110 400 140 T 800 140" fill="none" stroke="url(#wave-grad)" stroke-width="2">
      <animate attributeName="d" values="M 0 140 Q 200 110 400 140 T 800 140; M 0 130 Q 200 150 400 130 T 800 130; M 0 140 Q 200 110 400 140 T 800 140" dur="8s" repeatCount="indefinite" />
    </path>
    <path d="M 0 160 Q 200 180 400 160 T 800 160" fill="none" stroke="url(#wave-grad)" stroke-width="1.5">
      <animate attributeName="d" values="M 0 160 Q 200 180 400 160 T 800 160; M 0 170 Q 200 140 400 170 T 800 170; M 0 160 Q 200 180 400 160 T 800 160" dur="10s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Animated Ambient Floating Particles -->
  <circle cx="620" cy="60" r="3" fill="#38BDF8" opacity="0.4">
    <animate attributeName="cy" values="60;45;60" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="710" cy="120" r="4" fill="#60A5FA" opacity="0.3">
    <animate attributeName="cy" values="120;105;120" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1;0.6;0.1" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="670" cy="150" r="2.5" fill="#2563EB" opacity="0.5">
    <animate attributeName="cy" values="150;138;150" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Vertical Accent Bar with Subtle Glow -->
  <rect x="40" y="40" width="4.5" height="120" rx="2.25" fill="url(#shimmer-bar)" />

  <!-- Main Name Title -->
  <text x="62" y="80" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.3">
    Kathyayini Prabhu
  </text>

  <!-- Role Subtitle -->
  <text x="62" y="112" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">
    3rd Year Artificial Intelligence &amp; Data Science Student
  </text>

  <!-- College & Focus Tagline -->
  <text x="62" y="138" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400">
    BMS College of Engineering (BMSCE) • Bengaluru, India
  </text>

  <!-- Status Pill Top Right -->
  <g transform="translate(615, 30)">
    <rect width="145" height="28" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#3FB950">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Student &amp; Developer</text>
  </g>
</svg>
