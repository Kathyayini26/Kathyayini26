<svg fill="none" width="800" height="210" viewBox="0 0 800 210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Multi-Layer Flowing Gradient Background -->
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117">
        <animate attributeName="stop-color" values="#0D1117; #0F172A; #1E1B4B; #0D1117" dur="14s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#0F172A">
        <animate attributeName="stop-color" values="#0F172A; #1E1B4B; #092540; #0F172A" dur="14s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0A192F">
        <animate attributeName="stop-color" values="#0A192F; #0D1117; #0F172A; #0A192F" dur="14s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Accent Line Gradient -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00C6FF" />
    </linearGradient>

    <!-- Shimmer Bar Gradient -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Glow Filter for Nodes & Lines -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Main Dark Background -->
  <rect width="800" height="210" rx="14" fill="url(#cyber-bg)" stroke="#30363D" stroke-width="1.2" />

  <!-- Animated Wave 1 -->
  <path d="M 0 150 Q 200 120 400 150 T 800 150" fill="none" stroke="url(#cyan-glow)" stroke-width="1.8" opacity="0.4">
    <animate attributeName="d" values="M 0 150 Q 200 120 400 150 T 800 150; M 0 135 Q 200 165 400 135 T 800 135; M 0 150 Q 200 120 400 150 T 800 150" dur="7s" repeatCount="indefinite" />
  </path>

  <!-- Animated Wave 2 -->
  <path d="M 0 175 Q 200 195 400 175 T 800 175" fill="none" stroke="#818CF8" stroke-width="1.2" opacity="0.3">
    <animate attributeName="d" values="M 0 175 Q 200 195 400 175 T 800 175; M 0 185 Q 200 155 400 185 T 800 185; M 0 175 Q 200 195 400 175 T 800 175" dur="9s" repeatCount="indefinite" />
  </path>

  <!-- Interactive Constellation Network Graphic (Right Side) -->
  <g opacity="0.45" filter="url(#neon-glow)">
    <line x1="580" y1="50" x2="660" y2="90" stroke="#38BDF8" stroke-width="1">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="660" y1="90" x2="740" y2="45" stroke="#818CF8" stroke-width="1">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="5s" repeatCount="indefinite" />
    </line>
    <line x1="660" y1="90" x2="710" y2="155" stroke="#C084FC" stroke-width="1" />
    <line x1="580" y1="50" x2="620" y2="135" stroke="#38BDF8" stroke-width="1" />
    <line x1="620" y1="135" x2="710" y2="155" stroke="#38BDF8" stroke-width="1" />

    <!-- Pulsing Particle Nodes -->
    <circle cx="580" cy="50" r="4" fill="#38BDF8">
      <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="660" cy="90" r="5" fill="#00F2FE">
      <animate attributeName="r" values="4;6.5;4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="740" cy="45" r="4" fill="#818CF8">
      <animate attributeName="r" values="3;5;3" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="710" cy="155" r="4.5" fill="#C084FC">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="620" cy="135" r="3.5" fill="#38BDF8" />
  </g>

  <!-- Left Shimmer Bar -->
  <rect x="40" y="42" width="5" height="126" rx="2.5" fill="url(#shimmer)" filter="url(#neon-glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" />
  </rect>

  <!-- Name Title -->
  <text x="62" y="82" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">
    Kathyayini Prabhu
  </text>

  <!-- Subtitle / Role -->
  <text x="62" y="116" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="600" letter-spacing="0.2">
    3rd Year Artificial Intelligence &amp; Data Science Student
  </text>

  <!-- Tagline & College -->
  <text x="62" y="142" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400">
    BMS College of Engineering (BMSCE) • Bengaluru, India
  </text>

  <!-- Status Badge Top Right -->
  <g transform="translate(610, 26)">
    <rect width="150" height="28" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1" opacity="0.9" />
    <circle cx="16" cy="14" r="4.5" fill="#10B981" filter="url(#neon-glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Student &amp; Developer</text>
  </g>
</svg>
