<svg fill="none" width="800" height="180" viewBox="0 0 800 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Mode Clean Background -->
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>

    <!-- Subtle Blue Accent Bar -->
    <linearGradient id="accent-bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Main Background Container -->
  <rect width="800" height="180" rx="10" fill="url(#banner-bg)" stroke="#30363D" stroke-width="1" />

  <!-- Clean Vertical Accent Line -->
  <rect x="36" y="36" width="4" height="108" rx="2" fill="url(#accent-bar)" />

  <!-- Name Title -->
  <text x="56" y="72" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.3">
    Kathyayini Prabhu
  </text>

  <!-- Role Subtitle -->
  <text x="56" y="102" fill="#3B82F6" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">
    Artificial Intelligence &amp; Data Science Student
  </text>

  <!-- Institution & Location -->
  <text x="56" y="126" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">
    BMS College of Engineering (BMSCE) • Bengaluru, India
  </text>
</svg>
