      <text x="0" y="72"><tspan fill="#C084FC">&#9654;</tspan> REST APIs</text>
      <text x="0" y="96"><tspan fill="#C084FC">&#9654;</tspan> OpenCV</text>
      <text x="0" y="120"><tspan fill="#C084FC">&#9654;</tspan> Git &amp; GitHub</text>
