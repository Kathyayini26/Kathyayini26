<svg fill="none" width="800" height="230" viewBox="0 0 800 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Dark Background -->
    <linearGradient id="header-bg-v14" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19">
        <animate attributeName="stop-color" values="#0B0F19; #0F172A; #1E1B4B; #0B0F19" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#0F172A">
        <animate attributeName="stop-color" values="#0F172A; #1E1B4B; #092540; #0F172A" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0A192F">
        <animate attributeName="stop-color" values="#0A192F; #0B0F19; #0F172A; #0A192F" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Matrix Glowing Gradient -->
    <linearGradient id="matrix-grad-v14" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="33%" stop-color="#38BDF8" />
      <stop offset="66%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <linearGradient id="name-grad-v14" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Matrix Glow Filter -->
    <filter id="matrix-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Frame -->
  <rect width="800" height="230" rx="14" fill="url(#header-bg-v14)" stroke="url(#matrix-grad-v14)" stroke-width="1.5" />

  <!-- Top Accent Shimmer -->
  <rect x="0" y="0" width="800" height="5" rx="2.5" fill="url(#matrix-grad-v14)" filter="url(#matrix-glow)" />

  <!-- Ambient Wave Line -->
  <path d="M 0 165 Q 200 135 400 165 T 800 165" fill="none" stroke="url(#matrix-grad-v14)" stroke-width="1.2" opacity="0.3" />

  <!-- MATRIX CODE PORTRAIT / DEVELOPER AVATAR CREATED IN CODE (Right Side) -->
  <g transform="translate(535, 18)">
    <!-- Terminal Glass Card Background -->
    <rect width="230" height="190" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1.2" />

    <!-- Card Title Bar -->
    <rect width="230" height="24" rx="12" fill="#161B22" />
    <circle cx="15" cy="12" r="3.5" fill="#FF5F56" />
    <circle cx="28" cy="12" r="3.5" fill="#FFBD2E" />
    <circle cx="41" cy="12" r="3.5" fill="#27C93F" />
    <text x="115" y="16" fill="#94A3B8" font-family="'Fira Code', monospace" font-size="8.5" font-weight="700" text-anchor="middle">portrait.py — CODE ART</text>

    <!-- FLOWING MATRIX CODE STREAMS (Background Layer) -->
    <g font-family="'Fira Code', 'Courier New', monospace" font-size="7.5" opacity="0.35">
      <text x="12" y="42" fill="#34D399">import numpy as np</text>
      <text x="12" y="54" fill="#38BDF8">import pandas as pd</text>
      <text x="12" y="66" fill="#A78BFA">from ai import model</text>
      <text x="12" y="78" fill="#34D399">def render_portrait():</text>
      <text x="12" y="90" fill="#38BDF8">&nbsp;&nbsp;x = model.predict()</text>
      <text x="12" y="102" fill="#F59E0B">&nbsp;&nbsp;return AI_DS_DEV</text>
      <text x="12" y="114" fill="#34D399"># 0101010101010101</text>
      <text x="12" y="126" fill="#38BDF8"># KATHYAYINI_PRABHU</text>
      <text x="12" y="138" fill="#A78BFA"># BMSCE_2026_BATCH</text>
      <text x="12" y="150" fill="#34D399"># ML_ALGORITHM_SYS</text>
      <text x="12" y="162" fill="#38BDF8"># SQL_DATABASE_ARCH</text>
      <text x="12" y="174" fill="#F59E0B"># RETURNING_SUCCESS</text>

      <!-- Animated Moving Code Stream Line 1 -->
      <text x="135" y="42" fill="#00F2FE" filter="url(#matrix-glow)">
        <animate attributeName="y" values="35;175;35" dur="4s" repeatCount="indefinite" />
        0101010101
      </text>

      <!-- Animated Moving Code Stream Line 2 -->
      <text x="175" y="70" fill="#34D399" filter="url(#matrix-glow)">
        <animate attributeName="y" values="175;35;175" dur="5s" repeatCount="indefinite" />
        MODEL_FIT()
      </text>
    </g>

    <!-- CODE PORTRAIT SILHOUETTE EMERGING SLOWLY FROM CODE LINES -->
    <g transform="translate(65, 36)" filter="url(#matrix-glow)">
      <!-- Outer Portrait Halo Ring -->
      <circle cx="50" cy="55" r="48" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 4" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="0 50 55" to="360 50 55" dur="14s" repeatCount="indefinite" />
      </circle>

      <!-- Hair Silhouette rendered with Code Line Accents -->
      <path d="M 50 15 C 32 15 22 28 22 45 C 22 55 28 62 34 68 L 22 75 L 18 100 L 82 100 L 78 75 L 66 68 C 72 62 78 55 78 45 C 78 28 68 15 50 15 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
      </path>

      <!-- Head & Profile Outline -->
      <circle cx="50" cy="42" r="18" fill="#161B22" stroke="#34D399" stroke-width="1.5" />

      <!-- Code Line Text Grid Layer Overlay on Silhouette (Creating Code Photo Effect) -->
      <g font-family="'Fira Code', monospace" font-size="5" fill="#38BDF8" text-anchor="middle" opacity="0.9">
        <text x="50" y="32">0101010</text>
        <text x="50" y="38">def main():</text>
        <text x="50" y="44">model.fit()</text>
        <text x="50" y="50">AI_STUDENT</text>
        <text x="50" y="66">python.sql</text>
        <text x="50" y="74">ML_ENGINEER</text>
        <text x="50" y="82">BMSCE_AI_DS</text>
        <text x="50" y="90">01010101010</text>
      </g>

      <!-- Glowing Eye Matrix Nodes -->
      <circle cx="43" cy="42" r="2" fill="#00F2FE" />
      <circle cx="57" cy="42" r="2" fill="#00F2FE" />

      <!-- Smile Accent Line -->
      <path d="M 44 49 Q 50 53 56 49" fill="none" stroke="#34D399" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- Bottom Status Text -->
    <text x="115" y="178" fill="#34D399" font-family="'Fira Code', monospace" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="0.5">PORTRAIT_RENDERED [OK]</text>
  </g>

  <!-- Left Accent Line -->
  <rect x="36" y="38" width="5" height="152" rx="2.5" fill="url(#matrix-grad-v14)" filter="url(#matrix-glow)" />

  <!-- Main Name Title -->
  <text x="60" y="80" fill="url(#name-grad-v14)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    Kathyayini Prabhu
  </text>

  <!-- Role Subtitle -->
  <text x="60" y="114" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" letter-spacing="0.2">
    3rd Year Artificial Intelligence &amp; Data Science Student
  </text>

  <!-- Institution Tagline -->
  <text x="60" y="142" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500">
    BMS College of Engineering (BMSCE) • Bengaluru, India
  </text>

  <!-- Badges Row at Bottom -->
  <g transform="translate(60, 166)">
    <rect width="125" height="22" rx="11" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8" />
    <text x="62.5" y="15" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">DATA SCIENCE</text>

    <rect x="135" width="145" height="22" rx="11" fill="#1E293B" stroke="#34D399" stroke-width="0.8" />
    <text x="207.5" y="15" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">MACHINE LEARNING</text>

    <rect x="290" width="165" height="22" rx="11" fill="#1E293B" stroke="#A78BFA" stroke-width="0.8" />
    <text x="372.5" y="15" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">ARTIFICIAL INTELLIGENCE</text>
  </g>

  <!-- Top Right Status Badge -->
  <g transform="translate(565, 16)">
    <rect width="195" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-width="1" opacity="0.9" />
    <circle cx="15" cy="13" r="4" fill="#10B981" filter="url(#matrix-glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="27" y="17" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">AI &amp; Data Science Student</text>
  </g>
</svg>
