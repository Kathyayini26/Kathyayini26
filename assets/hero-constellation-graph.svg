<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="850" height="250">
  <defs>
    <linearGradient id="eng-hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816">
        <animate attributeName="stop-color" values="#050816; #070B1F; #0A1028; #050816" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#070B1F">
        <animate attributeName="stop-color" values="#070B1F; #0E122C; #06152B; #070B1F" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0A1028">
        <animate attributeName="stop-color" values="#0A1028; #050816; #070B1F; #0A1028" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="eng-hero-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <filter id="eng-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="mesh-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Frame -->
  <rect width="850" height="250" rx="16" fill="url(#eng-hero-bg)" stroke="url(#eng-hero-border)" stroke-width="1.8" />
  <rect x="0" y="0" width="850" height="4.5" rx="2.25" fill="url(#eng-hero-border)" filter="url(#eng-glow)" />

  <!-- Top Bar -->
  <g transform="translate(24, 18)">
    <circle cx="8" cy="8" r="4.5" fill="#FF5F56" />
    <circle cx="24" cy="8" r="4.5" fill="#FFBD2E" />
    <circle cx="40" cy="8" r="4.5" fill="#27C93F" />
    <text x="60" y="12" fill="#64748B" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700">AI_ENGINEER_DASHBOARD // KATHYAYINI_PRABHU</text>
    <text x="800" y="12" fill="#34D399" font-family="'Fira Code', monospace" font-size="10" font-weight="700" text-anchor="end">SYS.STATUS: ONLINE &#9679;</text>
  </g>

  <line x1="20" y1="42" x2="830" y2="42" stroke="#1E293B" stroke-width="1.2" />

  <!-- Left Details -->
  <g transform="translate(36, 52)">
    <rect x="0" y="8" width="5" height="136" rx="2.5" fill="#00F2FE" filter="url(#eng-glow)" />

    <text x="20" y="34" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="0.5">Kathyayini Prabhu</text>
    
    <text x="20" y="62" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="14.5" font-weight="700">Artificial Intelligence &amp; Data Science Engineer</text>
    
    <text x="20" y="88" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Transforming Data Into Intelligent Decisions</text>
    <text x="20" y="106" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Through AI, Analytics &amp; Software Systems</text>

    <!-- 4 Skill Pills: AI, ML, Data Science, SQL -->
    <g transform="translate(20, 122)">
      <rect width="112" height="24" rx="12" fill="#161B22" stroke="#00F2FE" stroke-width="1" />
      <text x="56" y="16" fill="#00F2FE" font-family="'Fira Code', monospace" font-size="8.5" font-weight="800" text-anchor="middle">ARTIFICIAL INTEL</text>

      <rect x="122" width="125" height="24" rx="12" fill="#161B22" stroke="#34D399" stroke-width="1" />
      <text x="184.5" y="16" fill="#34D399" font-family="'Fira Code', monospace" font-size="8.5" font-weight="800" text-anchor="middle">MACHINE LEARNING</text>

      <rect x="257" width="105" height="24" rx="12" fill="#161B22" stroke="#38BDF8" stroke-width="1" />
      <text x="309.5" y="16" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="8.5" font-weight="800" text-anchor="middle">DATA SCIENCE</text>

      <rect x="372" width="118" height="24" rx="12" fill="#161B22" stroke="#F59E0B" stroke-width="1" />
      <text x="431" y="16" fill="#F59E0B" font-family="'Fira Code', monospace" font-size="8.5" font-weight="800" text-anchor="middle">SQL &amp; DATABASES</text>
    </g>
  </g>

  <!-- Right Side: AI & Data Science Constellation Node Graph -->
  <g transform="translate(560, 50)">
    <rect width="255" height="175" rx="12" fill="#0D1117" stroke="#1E293B" stroke-width="1.4" filter="url(#eng-glow)" />

    <!-- Top Category Pill matching user image -->
    <g transform="translate(20, 16)">
      <rect width="215" height="24" rx="12" fill="#064E3B" stroke="#34D399" stroke-width="1" opacity="0.9" />
      <circle cx="16" cy="12" r="4" fill="#34D399">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="115" y="16" fill="#A7F3D0" font-family="'Fira Code', monospace" font-size="9" font-weight="700" text-anchor="middle">AI &amp; Data Science Engineer</text>
    </g>

    <!-- Faint Background Radar Ring -->
    <circle cx="127" cy="108" r="45" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3">
      <animateTransform attributeName="transform" type="rotate" from="0 127 108" to="360 127 108" dur="30s" repeatCount="indefinite" />
    </circle>

    <!-- ========================================== -->
    <!-- GEOMETRIC CONSTELLATION NETWORK MESH LINES -->
    <!-- ========================================== -->
    <g stroke-width="1.2" opacity="0.75">
      <!-- Radial Lines from Center (x=115, y=105) -->
      <line x1="115" y1="105" x2="52" y2="70" stroke="#00F2FE" />
      <line x1="115" y1="105" x2="108" y2="52" stroke="#34D399" stroke-width="1.5" />
      <line x1="115" y1="105" x2="190" y2="82" stroke="#C084FC" />
      <line x1="115" y1="105" x2="150" y2="148" stroke="#818CF8" />
      <line x1="115" y1="105" x2="68" y2="152" stroke="#A7F3D0" />

      <!-- Outer Polygonal Perimeter & Cross Mesh Lines -->
      <line x1="52" y1="70" x2="108" y2="52" stroke="#38BDF8" stroke-width="1" />
      <line x1="108" y1="52" x2="190" y2="82" stroke="#C084FC" stroke-width="1" />
      <line x1="190" y1="82" x2="216" y2="148" stroke="#818CF8" stroke-width="1" />
      <line x1="190" y1="82" x2="150" y2="148" stroke="#C084FC" stroke-width="1" />
      <line x1="150" y1="148" x2="216" y2="148" stroke="#34D399" stroke-width="1.2" />
      <line x1="150" y1="148" x2="68" y2="152" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 2" />
      <line x1="68" y1="152" x2="52" y2="70" stroke="#334155" stroke-width="0.9" />
    </g>

    <!-- Animated Firing Pulses along Mesh Lines -->
    <circle r="2.2" fill="#00F2FE" filter="url(#mesh-glow)">
      <animateMotion path="M 115 105 L 52 70 L 108 52 L 190 82" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle r="2.2" fill="#34D399" filter="url(#mesh-glow)">
      <animateMotion path="M 115 105 L 150 148 L 216 148 L 190 82" dur="2.6s" repeatCount="indefinite" />
    </circle>

    <!-- ========================================== -->
    <!-- CONSTELLATION GRAPH NODES                  -->
    <!-- ========================================== -->
    <!-- Outer Node 1 (Top Left - Cyan) -->
    <circle cx="52" cy="70" r="5" fill="#00F2FE" filter="url(#mesh-glow)" />

    <!-- Outer Node 2 (Top Center - Emerald) -->
    <circle cx="108" cy="52" r="4.5" fill="#34D399" filter="url(#mesh-glow)" />

    <!-- Outer Node 3 (Top Right - Lavender Purple) -->
    <circle cx="190" cy="82" r="5.5" fill="#C084FC" filter="url(#mesh-glow)" />

    <!-- Outer Node 4 (Bottom Far Right - Mint) -->
    <circle cx="216" cy="148" r="4.5" fill="#34D399" filter="url(#mesh-glow)" />

    <!-- Outer Node 5 (Bottom Center - Soft Cyan) -->
    <circle cx="150" cy="148" r="5" fill="#38BDF8" filter="url(#mesh-glow)" />

    <!-- Outer Node 6 (Bottom Left - Lime) -->
    <circle cx="68" cy="152" r="4.5" fill="#A7F3D0" filter="url(#mesh-glow)" />

    <!-- Central Glowing Focal Node (Mint Green) -->
    <circle cx="115" cy="105" r="9.5" fill="#10B981" filter="url(#mesh-glow)">
      <animate attributeName="r" values="8.5;10.5;8.5" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="115" cy="105" r="5" fill="#FFFFFF" />
  </g>
</svg>