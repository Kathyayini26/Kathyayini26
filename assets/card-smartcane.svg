<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19" />
      <stop offset="100%" stop-color="#0B1226" />
    </linearGradient>

    <linearGradient id="btn-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Frame -->
  <rect x="2" y="2" width="496" height="226" rx="14" fill="url(#card-bg)" stroke="#C084FC" stroke-width="1.4" filter="url(#glow)" />

  <!-- Top Category Pill Badge -->
  <g transform="translate(24, 22)">
    <rect width="125.5" height="24" rx="12" fill="#2E1065" stroke="#C084FC" stroke-width="1" />
    <text x="62.75" y="15.5" fill="#C084FC" font-family="'Fira Code', monospace" font-size="9" font-weight="800" text-anchor="middle">ASSISTIVE IOT</text>
  </g>

  <!-- Large Bold Title -->
  <text x="24" y="82" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.3">SmartCane</text>

  <!-- Concise Description -->
  <text x="24" y="112" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Intelligent multi-sensor assistive navigation device</text>
  <text x="24" y="132" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">with real-time spatial mapping &amp; adaptive haptic alerts.</text>

  <!-- Tech Tags & Blue Explore Button -->
  <g transform="translate(0, 162)">
    
      <rect x="24" y="0" width="31.5" height="24" rx="12" fill="#161B22" stroke="#C084FC" stroke-width="0.8" />
      <text x="39.75" y="15.5" fill="#C084FC" font-family="'Fira Code', monospace" font-size="9.5" font-weight="600" text-anchor="middle">C</text>
      <rect x="65.5" y="0" width="106.5" height="24" rx="12" fill="#161B22" stroke="#C084FC" stroke-width="0.8" />
      <text x="118.75" y="15.5" fill="#C084FC" font-family="'Fira Code', monospace" font-size="9.5" font-weight="600" text-anchor="middle">IoT Sensors</text>
      <rect x="182.0" y="0" width="84.0" height="24" rx="12" fill="#161B22" stroke="#C084FC" stroke-width="0.8" />
      <text x="224.0" y="15.5" fill="#C084FC" font-family="'Fira Code', monospace" font-size="9.5" font-weight="600" text-anchor="middle">Firmware</text>

    <!-- Explore Repo Button -->
    <g transform="translate(286.0, 0)">
      <rect width="175" height="26" rx="6" fill="url(#btn-blue)" />
      <text x="87.5" y="17" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.5" text-anchor="middle">EXPLORE REPOSITORY &#8594;</text>
    </g>
  </g>
</svg>