<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="100%" height="100%">
  <defs>
    <linearGradient id="cbg-ASS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060918" />
      <stop offset="100%" stop-color="#0A1024" />
    </linearGradient>

    <linearGradient id="btn-blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <filter id="cglow-ASS" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Frame (Wider 520x220) -->
  <rect x="2" y="2" width="516" height="216" rx="14" fill="url(#cbg-ASS)" stroke="#C084FC" stroke-width="1.5" filter="url(#cglow-ASS)" />

  <!-- Top Category Pill Badge -->
  <g transform="translate(26, 20)">
    <rect width="130.0" height="24" rx="12" fill="#2E1065" stroke="#C084FC" stroke-width="1" />
    <text x="65.0" y="16" fill="#C084FC" font-family="'Fira Code', monospace" font-size="9" font-weight="800" text-anchor="middle">ASSISTIVE IOT</text>
  </g>

  <!-- Large Bold Title -->
  <text x="26" y="78" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.3">SmartCane</text>

  <!-- Clear 2-Line Description -->
  <text x="26" y="106" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Intelligent multi-sensor assistive navigation device</text>
  <text x="26" y="125" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">with real-time spatial mapping &amp; adaptive haptic alerts.</text>

  <!-- Bottom Row: Tech Tags (Left) + Explore Button (Fixed Right) -->
  <g transform="translate(0, 156)">
    
      <rect x="26" y="0" width="30.2" height="28" rx="14" fill="#161B22" stroke="#C084FC" stroke-width="0.9" />
      <text x="41.1" y="18" fill="#C084FC" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700" text-anchor="middle">C</text>
      <rect x="66.2" y="0" width="46.599999999999994" height="28" rx="14" fill="#161B22" stroke="#C084FC" stroke-width="0.9" />
      <text x="89.5" y="18" fill="#C084FC" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700" text-anchor="middle">IoT</text>
      <rect x="122.8" y="0" width="87.6" height="28" rx="14" fill="#161B22" stroke="#C084FC" stroke-width="0.9" />
      <text x="166.6" y="18" fill="#C084FC" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700" text-anchor="middle">Firmware</text>

    <!-- Fixed Right-Aligned Explore Button -->
    <g transform="translate(330, 0)">
      <rect width="164" height="28" rx="6" fill="url(#btn-blue-grad)" />
      <text x="82.0" y="18" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" letter-spacing="0.4" text-anchor="middle">EXPLORE REPOSITORY &#8594;</text>
    </g>
  </g>
</svg>