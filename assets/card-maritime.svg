<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 235" width="100%" height="100%">
  <defs>
    <linearGradient id="cbg-MAR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060918" />
      <stop offset="100%" stop-color="#0A1024" />
    </linearGradient>

    <linearGradient id="btn-blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <filter id="cglow-MAR" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Frame (Uniform 470x235) -->
  <rect x="2" y="2" width="466" height="231" rx="14" fill="url(#cbg-MAR)" stroke="#818CF8" stroke-width="1.5" filter="url(#cglow-MAR)" />

  <!-- Top Category Pill Badge -->
  <g transform="translate(24, 22)">
    <rect width="189.79999999999998" height="25" rx="12.5" fill="#1E1B4B" stroke="#818CF8" stroke-width="1" />
    <text x="94.89999999999999" y="16.5" fill="#818CF8" font-family="'Fira Code', monospace" font-size="9" font-weight="800" text-anchor="middle">MARITIME LOGISTICS AI</text>
  </g>

  <!-- Large Bold Title -->
  <text x="24" y="82" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19.5" font-weight="800" letter-spacing="-0.3">AI Maritime Risk Intelligence</text>

  <!-- Clear 2-Line Description -->
  <text x="24" y="112" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5">Logistics intelligence platform for route risk prediction,</text>
  <text x="24" y="133" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5">seasonal forecasting &amp; port optimization analytics.</text>

  <!-- Bottom Row: Tech Tags (Left) + Explore Button (Fixed Right) -->
  <g transform="translate(0, 168)">
    
      <rect x="24" y="0" width="68.0" height="28" rx="14" fill="#161B22" stroke="#818CF8" stroke-width="0.9" />
      <text x="58.0" y="18" fill="#818CF8" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700" text-anchor="middle">Python</text>
      <rect x="102.0" y="0" width="60.0" height="28" rx="14" fill="#161B22" stroke="#818CF8" stroke-width="0.9" />
      <text x="132.0" y="18" fill="#818CF8" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700" text-anchor="middle">Flask</text>
      <rect x="172.0" y="0" width="60.0" height="28" rx="14" fill="#161B22" stroke="#818CF8" stroke-width="0.9" />
      <text x="202.0" y="18" fill="#818CF8" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700" text-anchor="middle">React</text>

    <!-- Fixed Right-Aligned Explore Button -->
    <g transform="translate(285, 0)">
      <rect width="165" height="30" rx="6" fill="url(#btn-blue-grad)" />
      <text x="82.5" y="19" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.4" text-anchor="middle">EXPLORE REPOSITORY &#8594;</text>
    </g>
  </g>
</svg>