<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 220" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg-MAR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19" />
      <stop offset="100%" stop-color="#0B1226" />
    </linearGradient>

    <linearGradient id="btn-blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <filter id="glow-MAR" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Outer Frame (Uniform 450x220) -->
  <rect x="2" y="2" width="446" height="216" rx="14" fill="url(#card-bg-MAR)" stroke="#818CF8" stroke-width="1.4" filter="url(#glow-MAR)" />

  <!-- Top Category Pill Badge -->
  <g transform="translate(22, 20)">
    <rect width="175.20000000000002" height="24" rx="12" fill="#1E1B4B" stroke="#818CF8" stroke-width="1" />
    <text x="87.60000000000001" y="15.5" fill="#818CF8" font-family="'Fira Code', monospace" font-size="8.5" font-weight="800" text-anchor="middle">MARITIME LOGISTICS AI</text>
  </g>

  <!-- Large Bold Title -->
  <text x="22" y="78" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" letter-spacing="-0.3">AI Maritime Risk Intelligence</text>

  <!-- Concise 2-Line Description -->
  <text x="22" y="106" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Logistics intelligence platform for route risk prediction,</text>
  <text x="22" y="126" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">seasonal forecasting &amp; port optimization analytics.</text>

  <!-- Bottom Row: Tech Tags (Left) + Explore Button (Fixed Right) -->
  <g transform="translate(0, 156)">
    
      <rect x="22" y="0" width="61.2" height="26" rx="13" fill="#161B22" stroke="#818CF8" stroke-width="0.8" />
      <text x="52.6" y="16.5" fill="#818CF8" font-family="'Fira Code', monospace" font-size="9" font-weight="600" text-anchor="middle">Python</text>
      <rect x="91.2" y="0" width="54.0" height="26" rx="13" fill="#161B22" stroke="#818CF8" stroke-width="0.8" />
      <text x="118.2" y="16.5" fill="#818CF8" font-family="'Fira Code', monospace" font-size="9" font-weight="600" text-anchor="middle">Flask</text>
      <rect x="153.2" y="0" width="54.0" height="26" rx="13" fill="#161B22" stroke="#818CF8" stroke-width="0.8" />
      <text x="180.2" y="16.5" fill="#818CF8" font-family="'Fira Code', monospace" font-size="9" font-weight="600" text-anchor="middle">React</text>

    <!-- Fixed Right-Aligned Explore Button -->
    <g transform="translate(274, 0)">
      <rect width="154" height="28" rx="6" fill="url(#btn-blue-grad)" />
      <text x="77.0" y="18" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" letter-spacing="0.4" text-anchor="middle">EXPLORE REPOSITORY &#8594;</text>
    </g>
  </g>
</svg>