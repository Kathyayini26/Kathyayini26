<svg fill="none" width="800" height="230" viewBox="0 0 800 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Gradient Background -->
    <linearGradient id="header-bg-v3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19">
        <animate attributeName="stop-color" values="#0B0F19; #0F172A; #1E1B4B; #0B0F19" dur="14s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#0F172A">
        <animate attributeName="stop-color" values="#0F172A; #1E1B4B; #092540; #0F172A" dur="14s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0A192F">
        <animate attributeName="stop-color" values="#0A192F; #0B0F19; #0F172A; #0A192F" dur="14s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Neon Glow Line Gradient -->
    <linearGradient id="neon-line-v3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="33%" stop-color="#38BDF8" />
      <stop offset="66%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <filter id="glow-v3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Main Container -->
  <rect width="800" height="230" rx="14" fill="url(#header-bg-v3)" stroke="url(#neon-line-v3)" stroke-width="1.5" />

  <!-- Top Accent Shimmer -->
  <rect x="0" y="0" width="800" height="5" rx="2.5" fill="url(#neon-line-v3)" filter="url(#glow-v3)" />

  <!-- Background Data Equalizer Bars Graphic (Right Side) -->
  <g transform="translate(560, 60)" opacity="0.6">
    <!-- Bar 1 -->
    <rect x="0" y="40" width="10" height="50" rx="5" fill="#38BDF8">
      <animate attributeName="height" values="50;90;40;80;50" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="40;0;50;10;40" dur="2.5s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 2 -->
    <rect x="18" y="20" width="10" height="70" rx="5" fill="#34D399">
      <animate attributeName="height" values="70;30;90;40;70" dur="3s" repeatCount="indefinite" />
      <animate attributeName="y" values="20;60;0;50;20" dur="3s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 3 -->
    <rect x="36" y="10" width="10" height="80" rx="5" fill="#A78BFA">
      <animate attributeName="height" values="80;40;70;95;80" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="y" values="10;50;20;0;10" dur="2.2s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 4 -->
    <rect x="54" y="30" width="10" height="60" rx="5" fill="#F59E0B">
      <animate attributeName="height" values="60;90;30;70;60" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="y" values="30;0;60;20;30" dur="2.8s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 5 -->
    <rect x="72" y="50" width="10" height="40" rx="5" fill="#38BDF8">
      <animate attributeName="height" values="40;80;50;90;40" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="50;10;40;0;50" dur="2.4s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 6 -->
    <rect x="90" y="20" width="10" height="70" rx="5" fill="#34D399">
      <animate attributeName="height" values="70;40;85;30;70" dur="3.2s" repeatCount="indefinite" />
      <animate attributeName="y" values="20;50;5;60;20" dur="3.2s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 7 -->
    <rect x="108" y="35" width="10" height="55" rx="5" fill="#A78BFA">
      <animate attributeName="height" values="55;90;40;75;55" dur="2.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="35;0;50;15;35" dur="2.6s" repeatCount="indefinite" />
    </rect>

    <text x="59" y="115" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="1">LIVE DATA METRICS</text>
  </g>

  <!-- Left Shimmer Accent Bar -->
  <rect x="36" y="40" width="5" height="145" rx="2.5" fill="url(#neon-line-v3)" filter="url(#glow-v3)" />

  <!-- Main Name Title -->
  <text x="60" y="82" fill="url(#name-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    Kathyayini Prabhu
  </text>

  <!-- Role Subtitle -->
  <text x="60" y="116" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" letter-spacing="0.2">
    3rd Year Artificial Intelligence &amp; Data Science Student
  </text>

  <!-- Institution Tagline -->
  <text x="60" y="144" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500">
    BMS College of Engineering (BMSCE) • Bengaluru, India
  </text>

  <!-- Badges Row at Bottom -->
  <g transform="translate(60, 160)">
    <rect width="130" height="22" rx="11" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8" />
    <text x="65" y="15" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">DATA SCIENCE</text>

    <rect x="140" width="130" height="22" rx="11" fill="#1E293B" stroke="#34D399" stroke-width="0.8" />
    <text x="205" y="15" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">DATA ANALYTICS</text>

    <rect x="280" width="170" height="22" rx="11" fill="#1E293B" stroke="#A78BFA" stroke-width="0.8" />
    <text x="365" y="15" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">ARTIFICIAL INTELLIGENCE</text>
  </g>

  <!-- Top Right Live Status Pill -->
  <g transform="translate(585, 22)">
    <rect width="180" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-width="1" opacity="0.9" />
    <circle cx="15" cy="13" r="4" fill="#10B981" filter="url(#glow-v3)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="27" y="17" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">AI &amp; Data Science Student</text>
  </g>
</svg>
