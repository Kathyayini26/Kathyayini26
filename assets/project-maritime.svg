<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="100%" height="100%">
  <defs>
    <linearGradient id="mr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030E1F" />
      <stop offset="100%" stop-color="#061733" />
    </linearGradient>
  </defs>

  <rect width="420" height="220" rx="12" fill="url(#mr-bg)" stroke="#34D399" stroke-width="1.2" />

  <!-- Telemetry Header -->
  <g transform="translate(18, 22)">
    <circle cx="4" cy="0" r="3.5" fill="#34D399" />
    <text x="14" y="3.5" fill="#34D399" font-family="'Fira Code', monospace" font-size="9" font-weight="800" letter-spacing="0.5">DYNAMIC_AIS // RISK_ISOCHRONE_ENGINE</text>
    <text x="384" y="3.5" fill="#34D399" font-family="'Fira Code', monospace" font-size="8" font-weight="700" text-anchor="end">LIVE_TELEMETRY &#9679;</text>
  </g>
  <line x1="18" y1="34" x2="402" y2="34" stroke="#1E293B" stroke-width="1" />

  <!-- Nautical Chart & Risk Heat Zones -->
  <g transform="translate(20, 48)">
    <!-- Bathymetric & Weather Contour Waves -->
    <path d="M 10 110 Q 90 70 180 120 T 360 80" fill="none" stroke="#1E293B" stroke-width="1.5" />
    <path d="M 20 130 Q 110 90 200 140 T 370 100" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Storm Risk Alert Zone (Amber Heat Circle) -->
    <circle cx="170" cy="70" r="28" fill="#F59E0B" opacity="0.12">
      <animate attributeName="r" values="26;32;26" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="170" cy="70" r="18" fill="#EF4444" opacity="0.18" />
    <text x="170" y="73" fill="#F59E0B" font-family="'Fira Code', monospace" font-size="6.5" font-weight="800" text-anchor="middle">STORM_ANOMALY</text>

    <!-- Calculated Optimum Safe Route Vector -->
    <path d="M 25 125 C 90 145 120 120 170 120 C 230 120 270 55 350 45" fill="none" stroke="#34D399" stroke-width="2.5" stroke-dasharray="5 3">
      <animate attributeName="stroke-dashoffset" values="30;0" dur="1.8s" repeatCount="indefinite" />
    </path>

    <!-- Origin Port -->
    <circle cx="25" cy="125" r="4.5" fill="#38BDF8" />
    <text x="25" y="142" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="7" font-weight="700" text-anchor="middle">PORT_A</text>

    <!-- Vessel Position & Heading Arrow -->
    <g transform="translate(170, 120)">
      <polygon points="0,-7 6,7 0,4 -6,7" fill="#00F2FE" />
      <circle cx="0" cy="0" r="10" fill="none" stroke="#00F2FE" stroke-width="0.8" stroke-dasharray="2 2" />
      <text x="0" y="-12" fill="#00F2FE" font-family="'Fira Code', monospace" font-size="6.5" font-weight="800" text-anchor="middle">VESSEL_ETA -4.2h</text>
    </g>

    <!-- Destination Port -->
    <circle cx="350" cy="45" r="5" fill="#34D399" />
    <circle cx="350" cy="45" r="9" fill="none" stroke="#34D399" stroke-width="1">
      <animate attributeName="r" values="5;13;5" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="350" y="32" fill="#34D399" font-family="'Fira Code', monospace" font-size="7" font-weight="700" text-anchor="middle">PORT_DEST</text>
  </g>

  <!-- Bottom Telemetry -->
  <g transform="translate(18, 198)" font-family="'Fira Code', monospace" font-size="7.5" fill="#64748B">
    <text x="0" y="0">FUEL_OPTIM: +14.8%</text>
    <text x="140" y="0">DISRUPTION_RISK: LOW (0.12)</text>
    <text x="384" y="0" text-anchor="end">AIS_BUFFER: 50Hz</text>
  </g>
</svg>