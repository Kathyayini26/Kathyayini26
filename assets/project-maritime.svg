<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="100%" height="100%">
  <defs>
    <linearGradient id="p-mar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C1F" />
      <stop offset="100%" stop-color="#09142E" />
    </linearGradient>
    <filter id="p-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="420" height="220" rx="10" fill="url(#p-mar-bg)" stroke="#00F2FE" stroke-width="1.2" filter="url(#p-glow)" />

  <!-- Top Info -->
  <text x="20" y="28" fill="#00F2FE" font-family="'Fira Code', monospace" font-size="9.5" font-weight="800" letter-spacing="0.5">MARITIME LOGISTICS // ROUTE RISK</text>
  <text x="400" y="24" fill="#34D399" font-family="'Fira Code', monospace" font-size="8" font-weight="700" text-anchor="end">OPTIMIZED</text>
  <text x="400" y="36" fill="#34D399" font-family="'Fira Code', monospace" font-size="8" font-weight="700" text-anchor="end">DESTINATION</text>

  <!-- Grid lines -->
  <g stroke="#1E293B" stroke-width="0.8" stroke-dasharray="3 3">
    <line x1="20" y1="70" x2="400" y2="70" />
    <line x1="20" y1="120" x2="400" y2="120" />
    <line x1="20" y1="170" x2="400" y2="170" />
    <line x1="120" y1="40" x2="120" y2="180" />
    <line x1="240" y1="40" x2="240" y2="180" />
    <line x1="340" y1="40" x2="340" y2="180" />
  </g>

  <!-- Animated Trajectory Curve -->
  <path d="M 45 155 Q 150 40 260 135 T 375 75" fill="none" stroke="#00F2FE" stroke-width="2.5" stroke-dasharray="6 4">
    <animate attributeName="stroke-dashoffset" values="40;0" dur="2s" repeatCount="indefinite" />
  </path>

  <!-- Origin Node -->
  <circle cx="45" cy="155" r="5" fill="#38BDF8" />
  <text x="45" y="175" fill="#94A3B8" font-family="'Fira Code', monospace" font-size="8" text-anchor="middle">ORIGIN</text>

  <!-- Alt Port Radar Node -->
  <circle cx="260" cy="135" r="14" fill="none" stroke="#00F2FE" stroke-width="1" stroke-dasharray="2 2">
    <animateTransform attributeName="transform" type="rotate" from="0 260 135" to="360 260 135" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="260" cy="135" r="5.5" fill="#C084FC" />
  <text x="260" y="160" fill="#CBD5E1" font-family="'Fira Code', monospace" font-size="8" text-anchor="middle">ALT PORT</text>

  <!-- Optimized Destination Node -->
  <circle cx="375" cy="75" r="6" fill="#34D399" />
  <circle cx="375" cy="75" r="10" fill="none" stroke="#34D399" stroke-width="1.2">
    <animate attributeName="r" values="6;14;6" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0;1" dur="2.5s" repeatCount="indefinite" />
  </circle>

  <!-- Bottom Labels -->
  <text x="20" y="202" fill="#64748B" font-family="'Fira Code', monospace" font-size="8" font-weight="700">SEASONAL FORECAST &#8226; RISK PREDICTION MATRIX</text>
</svg>