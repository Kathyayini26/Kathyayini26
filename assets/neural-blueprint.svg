<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="100%">
  <defs>
    <linearGradient id="nb-v3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816">
        <animate attributeName="stop-color" values="#050816; #070B1F; #0A1028; #050816" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#070B1F">
        <animate attributeName="stop-color" values="#070B1F; #0E122C; #06152B; #070B1F" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0A1028">
        <animate attributeName="stop-color" values="#0A1028; #050816; #070B1F; #0A1028" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="nb-v3-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <filter id="nb-v3-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Frame -->
  <rect width="920" height="260" rx="16" fill="url(#nb-v3-bg)" stroke="#1E293B" stroke-width="1.8" />
  <rect x="0" y="0" width="920" height="3.5" rx="1.75" fill="url(#nb-v3-border)" filter="url(#nb-v3-glow)" />

  <!-- Animated Neural Lines -->
  <g stroke="#38BDF8" stroke-width="0.8" opacity="0.2">
    <line x1="20" y1="170" x2="220" y2="110">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="220" y1="110" x2="440" y2="200">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="5s" repeatCount="indefinite" />
    </line>
    <line x1="440" y1="200" x2="700" y2="90">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.5s" repeatCount="indefinite" />
    </line>
    <line x1="700" y1="90" x2="890" y2="160">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="4.5s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Top Header Bar -->
  <g transform="translate(32, 22)">
    <text x="0" y="12" fill="#00F2FE" font-family="'Fira Code', monospace" font-size="12" font-weight="800" letter-spacing="1">NEURAL BLUEPRINT // TRANSFORMING DATA INTO INTELLIGENT SYSTEMS</text>
    <text x="856" y="12" fill="#34D399" font-family="'Fira Code', monospace" font-size="10" font-weight="700" text-anchor="end">SYS_PROFILE &#9679;</text>
  </g>
  <line x1="30" y1="42" x2="890" y2="42" stroke="#1E293B" stroke-width="1.2" />

  <!-- Narrative Content (Increased Font Size & Balanced Alignment) -->
  <g transform="translate(38, 64)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Line 1: Primary Identity -->
    <text x="0" y="20" fill="#FFFFFF" font-size="15" font-weight="600" letter-spacing="0.2">
      Third-Year Artificial Intelligence &amp; Data Science student focused on intelligent systems and data-driven solutions.
    </text>

    <!-- Line 2: Focus Domains -->
    <text x="0" y="54" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="13.5" font-weight="700">
      Machine Learning &#8226; Data Analytics &#8226; SQL Engineering &#8226; Backend Development &#8226; AI Applications
    </text>

    <!-- Line 3: Mission Summary -->
    <text x="0" y="84" fill="#CBD5E1" font-size="14" font-weight="400">
      Transforming data into actionable insights through automation and software engineering.
    </text>

    <!-- 5 Clean Floating Pill Badges -->
    <g transform="translate(0, 116)" font-family="'Fira Code', monospace" font-size="9.5">
      <rect width="148" height="26" rx="13" fill="#0D1117" stroke="#00F2FE" stroke-width="1" />
      <text x="74" y="17" fill="#00F2FE" font-weight="700" text-anchor="middle">&#9670; Machine Learning</text>

      <rect x="158" width="138" height="26" rx="13" fill="#0D1117" stroke="#34D399" stroke-width="1" />
      <text x="227" y="17" fill="#34D399" font-weight="700" text-anchor="middle">&#9670; Data Analytics</text>

      <rect x="306" width="162" height="26" rx="13" fill="#0D1117" stroke="#F59E0B" stroke-width="1" />
      <text x="387" y="17" fill="#F59E0B" font-weight="700" text-anchor="middle">&#9670; SQL Engineering</text>

      <rect x="478" width="172" height="26" rx="13" fill="#0D1117" stroke="#818CF8" stroke-width="1" />
      <text x="564" y="17" fill="#818CF8" font-weight="700" text-anchor="middle">&#9670; Backend Development</text>

      <rect x="660" width="142" height="26" rx="13" fill="#0D1117" stroke="#C084FC" stroke-width="1" />
      <text x="731" y="17" fill="#C084FC" font-weight="700" text-anchor="middle">&#9670; AI Applications</text>
    </g>
  </g>
</svg>