<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="100%" height="100%">
  <defs>
    <linearGradient id="nb-v2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816">
        <animate attributeName="stop-color" values="#050816; #070B1F; #0A1028; #050816" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#070B1F">
        <animate attributeName="stop-color" values="#070B1F; #0E122C; #06152B; #070B1F" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0A1028">
        <animate attributeName="stop-color" values="#0A1028; #050816; #070B1F; #0A1028" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="nb-v2-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <filter id="nb-v2-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Frame -->
  <rect width="920" height="250" rx="16" fill="url(#nb-v2-bg)" stroke="#1E293B" stroke-width="1.8" />
  <rect x="0" y="0" width="920" height="3.5" rx="1.75" fill="url(#nb-v2-border)" filter="url(#nb-v2-glow)" />

  <!-- Animated Neural Lines -->
  <g stroke="#38BDF8" stroke-width="0.8" opacity="0.2">
    <line x1="20" y1="160" x2="220" y2="100">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="220" y1="100" x2="440" y2="190">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="5s" repeatCount="indefinite" />
    </line>
    <line x1="440" y1="190" x2="700" y2="80">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.5s" repeatCount="indefinite" />
    </line>
    <line x1="700" y1="80" x2="890" y2="150">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="4.5s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Header -->
  <g transform="translate(32, 22)">
    <text x="0" y="12" fill="#00F2FE" font-family="'Fira Code', monospace" font-size="12" font-weight="800" letter-spacing="1">NEURAL BLUEPRINT // TRANSFORMING DATA INTO INTELLIGENT SYSTEMS</text>
    <text x="856" y="12" fill="#34D399" font-family="'Fira Code', monospace" font-size="10" font-weight="700" text-anchor="end">SYS_PROFILE &#9679;</text>
  </g>
  <line x1="30" y1="42" x2="890" y2="42" stroke="#1E293B" stroke-width="1.2" />

  <!-- Narrative Content -->
  <g transform="translate(36, 62)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Line 1 -->
    <text x="0" y="20" fill="#FFFFFF" font-size="14" font-weight="600" letter-spacing="0.2">
      Third-Year Artificial Intelligence &amp; Data Science student focused on intelligent systems and data-driven solutions.
    </text>

    <!-- Line 2 -->
    <text x="0" y="52" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="12.5" font-weight="700">
      Machine Learning &#8226; Data Analytics &#8226; SQL Engineering &#8226; Backend Development &#8226; AI Applications
    </text>

    <!-- Line 3 -->
    <text x="0" y="80" fill="#CBD5E1" font-size="13" font-weight="400">
      Transforming data into actionable insights through automation and software engineering.
    </text>

    <!-- 5 Clean Pill Badges -->
    <g transform="translate(0, 110)" font-family="'Fira Code', monospace" font-size="9">
      <rect width="145" height="26" rx="13" fill="#0D1117" stroke="#00F2FE" stroke-width="1" />
      <text x="72.5" y="17" fill="#00F2FE" font-weight="700" text-anchor="middle">&#9670; Machine Learning</text>

      <rect x="155" width="135" height="26" rx="13" fill="#0D1117" stroke="#34D399" stroke-width="1" />
      <text x="222.5" y="17" fill="#34D399" font-weight="700" text-anchor="middle">&#9670; Data Analytics</text>

      <rect x="300" width="160" height="26" rx="13" fill="#0D1117" stroke="#F59E0B" stroke-width="1" />
      <text x="380" y="17" fill="#F59E0B" font-weight="700" text-anchor="middle">&#9670; SQL Engineering</text>

      <rect x="470" width="170" height="26" rx="13" fill="#0D1117" stroke="#818CF8" stroke-width="1" />
      <text x="555" y="17" fill="#818CF8" font-weight="700" text-anchor="middle">&#9670; Backend Development</text>

      <rect x="650" width="140" height="26" rx="13" fill="#0D1117" stroke="#C084FC" stroke-width="1" />
      <text x="720" y="17" fill="#C084FC" font-weight="700" text-anchor="middle">&#9670; AI Applications</text>
    </g>
  </g>
</svg>