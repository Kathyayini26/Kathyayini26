<svg fill="none" width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Enterprise Background -->
    <linearGradient id="pro-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>

    <!-- GitHub Blue Accent Line -->
    <linearGradient id="pro-accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0969DA" />
      <stop offset="100%" stop-color="#58A6FF" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="800" height="200" rx="10" fill="url(#pro-bg)" stroke="#30363D" stroke-width="1.2" />

  <!-- Subtle Structural Grid Backdrop -->
  <g opacity="0.05" stroke="#58A6FF" stroke-width="1">
    <line x1="0" y1="40" x2="800" y2="40" />
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="200" y1="0" x2="200" y2="200" />
    <line x1="400" y1="0" x2="400" y2="200" />
    <line x1="600" y1="0" x2="600" y2="200" />
  </g>

  <!-- Left Blue Accent Bar -->
  <rect x="36" y="38" width="4" height="124" rx="2" fill="url(#pro-accent)" />

  <!-- Main Name Title -->
  <text x="56" y="76" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.3">
    Kathyayini Prabhu
  </text>

  <!-- Role Subtitle -->
  <text x="56" y="106" fill="#58A6FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="600">
    3rd Year B.E. Student in Artificial Intelligence &amp; Data Science
  </text>

  <!-- Institution Tagline -->
  <text x="56" y="132" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">
    BMS College of Engineering (BMSCE) • Bengaluru, India
  </text>

  <!-- Status Pill Top Right -->
  <g transform="translate(585, 26)">
    <rect width="180" height="26" rx="13" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <circle cx="16" cy="13" r="4" fill="#3FB950" />
    <text x="28" y="17" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Open to Projects &amp; Roles</text>
  </g>
</svg>
