<svg fill="none" width="800" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="snap-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <linearGradient id="neon-glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="33%" stop-color="#38BDF8" />
      <stop offset="66%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <filter id="card-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Frame -->
  <rect width="800" height="150" rx="12" fill="url(#snap-bg)" stroke="#30363D" stroke-width="1.2" />

  <!-- Top Accent Shimmer -->
  <rect x="0" y="0" width="800" height="4" rx="2" fill="url(#neon-glow-line)" />

  <!-- Title Pill -->
  <g transform="translate(24, 18)">
    <rect width="180" height="24" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
    <text x="14" y="16" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="0.6">RECRUITER SNAPSHOT</text>
  </g>

  <!-- 4 Data Metric Cards -->
  <g transform="translate(24, 52)">
    <!-- Metric 1: Degree & Year -->
    <g transform="translate(0, 0)">
      <rect width="175" height="74" rx="8" fill="#161B22" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">DEGREE &amp; YEAR</text>
      <text x="14" y="44" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">B.E. AI &amp; Data Science</text>
      <text x="14" y="60" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">3rd Year Student @ BMSCE</text>
    </g>

    <!-- Metric 2: Primary Technical Stack -->
    <g transform="translate(190, 0)">
      <rect width="175" height="74" rx="8" fill="#161B22" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">CORE LANGUAGES</text>
      <text x="14" y="44" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Python • C • SQL</text>
      <text x="14" y="60" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Data &amp; Logic Focus</text>
    </g>

    <!-- Metric 3: Web & Frameworks -->
    <g transform="translate(380, 0)">
      <rect width="175" height="74" rx="8" fill="#161B22" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">FRAMEWORKS &amp; DB</text>
      <text x="14" y="44" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">React • Flask • MySQL</text>
      <text x="14" y="60" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Full Stack &amp; REST APIs</text>
    </g>

    <!-- Metric 4: Location & Status -->
    <g transform="translate(570, 0)">
      <rect width="180" height="74" rx="8" fill="#161B22" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">LOCATION &amp; FOCUS</text>
      <text x="14" y="44" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Bengaluru, India</text>
      <text x="14" y="60" fill="#F43F5E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">AI, Data &amp; Web Dev</text>
    </g>
  </g>
</svg>
