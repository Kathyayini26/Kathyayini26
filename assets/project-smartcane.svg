<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 170" width="100%" height="100%">
  <defs>
    <linearGradient id="sc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E051C" />
      <stop offset="100%" stop-color="#1A0A33" />
    </linearGradient>
  </defs>

  <rect width="850" height="170" rx="14" fill="url(#sc-bg)" stroke="#C084FC" stroke-width="1.4" />

  <!-- Telemetry Header -->
  <g transform="translate(24, 22)">
    <circle cx="4" cy="0" r="3.5" fill="#C084FC" />
    <text x="14" y="3.5" fill="#C084FC" font-family="'Fira Code', monospace" font-size="10.5" font-weight="800" letter-spacing="0.5">SMARTCANE // 360&#176; SPATIAL SONAR &amp; HAPTIC PERCEPTION CORE</text>
    <text x="800" y="3.5" fill="#34D399" font-family="'Fira Code', monospace" font-size="9" font-weight="700" text-anchor="end">HAPTIC_ARRAY: ACTIVE &#9679;</text>
  </g>
  <line x1="24" y1="38" x2="824" y2="38" stroke="#1E293B" stroke-width="1" />

  <!-- Left Ultrasonic Sweep Radar Display -->
  <g transform="translate(105, 102)">
    <!-- Radar Concentric Range Rings (0.5m, 1.5m, 3.0m) -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#334155" stroke-width="0.8" />
    <circle cx="0" cy="0" r="34" fill="none" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 2" />
    <circle cx="0" cy="0" r="50" fill="none" stroke="#C084FC" stroke-width="1" opacity="0.4" />

    <!-- Rotating Radar Sweep Cone -->
    <path d="M 0 0 L 44 -26 A 50 50 0 0 1 50 0 Z" fill="#C084FC" opacity="0.25">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite" />
    </path>

    <!-- Detected Obstacle Echo -->
    <circle cx="28" cy="-14" r="3.5" fill="#EF4444">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="-22" fill="#FCA5A5" font-family="'Fira Code', monospace" font-size="6" font-weight="700" text-anchor="middle">1.2m</text>

    <!-- Center Cane Sensor Node -->
    <circle cx="0" cy="0" r="6" fill="#161B22" stroke="#00F2FE" stroke-width="1.5" />
    <circle cx="0" cy="0" r="2" fill="#00F2FE" />
  </g>

  <!-- Right Technical Specs & Narrative Details -->
  <g transform="translate(185, 62)" font-family="'Fira Code', monospace">
    <text x="0" y="14" fill="#FFFFFF" font-size="13" font-weight="700">Adaptive Spatial Echo Mapping &amp; Multi-Frequency Haptic Pulse Array</text>
    <text x="0" y="36" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11.5">
      Combines real-time ultrasonic echolocation with embedded micro-vibration motors for instantaneous tactile distance awareness.
    </text>

    <!-- Dynamic Metrics -->
    <g transform="translate(0, 60)" font-size="8.5" fill="#CBD5E1">
      <rect width="130" height="22" rx="4" fill="#161B22" stroke="#334155" />
      <text x="65" y="15" fill="#00F2FE" text-anchor="middle">&#9889; SWEEP: 180&#176; FIELD</text>

      <rect x="140" width="145" height="22" rx="4" fill="#161B22" stroke="#334155" />
      <text x="212.5" y="15" fill="#34D399" text-anchor="middle">&#128207; RANGE: 0.2m - 3.5m</text>

      <rect x="295" width="160" height="22" rx="4" fill="#161B22" stroke="#334155" />
      <text x="375" y="15" fill="#C084FC" text-anchor="middle">&#128266; HAPTIC: PWM ADAPTIVE</text>

      <rect x="465" width="160" height="22" rx="4" fill="#161B22" stroke="#C084FC" stroke-width="0.8" />
      <text x="545" y="15" fill="#F59E0B" font-weight="700" text-anchor="middle">POWER: ULTRA-LOW (C)</text>
    </g>
  </g>
</svg>