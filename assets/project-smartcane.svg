<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="100%">
  <defs>
    <linearGradient id="p-sc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#130826" />
      <stop offset="100%" stop-color="#1E0E38" />
    </linearGradient>
  </defs>

  <rect width="850" height="160" rx="12" fill="url(#p-sc-bg)" stroke="#C084FC" stroke-width="1.4" />

  <g transform="translate(24, 24)">
    <text x="0" y="12" fill="#C084FC" font-family="'Fira Code', monospace" font-size="11" font-weight="800" letter-spacing="0.5">SMARTCANE // ASSISTIVE IOT SPATIAL RADAR</text>
    <text x="800" y="12" fill="#34D399" font-family="'Fira Code', monospace" font-size="9.5" font-weight="700" text-anchor="end">SENSORS ONLINE &#9679;</text>
  </g>
  <line x1="24" y1="44" x2="824" y2="44" stroke="#1E293B" stroke-width="1" />

  <!-- Radar Concentric Rings & Cane Sensor -->
  <g transform="translate(100, 105)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#C084FC" stroke-width="1.2" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#C084FC" stroke-width="1" stroke-dasharray="3 3">
      <animate attributeName="r" values="24;36;24" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#38BDF8" stroke-width="0.8" opacity="0.4" />
    
    <path d="M 4 -12 C 4 -18 -4 -18 -4 -12 L -4 14" stroke="#C084FC" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <circle cx="-4" cy="15" r="2" fill="#34D399" />
  </g>

  <g transform="translate(170, 75)" font-family="'Fira Code', monospace">
    <text x="0" y="14" fill="#FFFFFF" font-size="13" font-weight="700">Intelligent Multi-Sensor Spatial Mapping &amp; Obstacle Avoidance</text>
    <text x="0" y="36" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11.5">
      Embedded ultrasonic + haptic feedback system enabling real-time navigation assistance for visually impaired users.
    </text>
    <text x="0" y="58" fill="#C084FC" font-size="9" font-weight="700">EMBEDDED C &#8226; IOT SENSORS &#8226; MICROCONTROLLER FIRMWARE &#8226; HAPTIC RADAR</text>
  </g>
