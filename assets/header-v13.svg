<svg fill="none" width="800" height="230" viewBox="0 0 800 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Cyberpunk Cosmic Background Gradient -->
    <linearGradient id="header-bg-v13" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814">
        <animate attributeName="stop-color" values="#050814; #0F172A; #1E1035; #050814" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#0A1128">
        <animate attributeName="stop-color" values="#0A1128; #1E1B4B; #071930; #0A1128" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0F051D">
        <animate attributeName="stop-color" values="#0F051D; #050814; #0A1128; #0F051D" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Multi-Spectrum Holographic Glow Gradient -->
    <linearGradient id="holo-border-v13" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="25%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="75%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <linearGradient id="title-grad-v13" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Intense Glow Filter -->
    <filter id="hyper-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Frame -->
  <rect width="800" height="230" rx="16" fill="url(#header-bg-v13)" stroke="url(#holo-border-v13)" stroke-width="1.8" />

  <!-- Top Laser Beam -->
  <rect x="0" y="0" width="800" height="5" rx="2.5" fill="url(#holo-border-v13)" filter="url(#hyper-glow)" />

  <!-- Laser Pulse Traveling Across Top Border -->
  <circle cy="2.5" r="4" fill="#00F2FE" filter="url(#hyper-glow)">
    <animate attributeName="cx" values="10;790;10" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- Ambient Wave Oscillations -->
  <path d="M 0 170 Q 200 130 400 170 T 800 170" fill="none" stroke="url(#holo-border-v13)" stroke-width="1.5" opacity="0.4">
    <animate attributeName="d" values="M 0 170 Q 200 130 400 170 T 800 170; M 0 145 Q 200 185 400 145 T 800 145; M 0 170 Q 200 130 400 170 T 800 170" dur="4.5s" repeatCount="indefinite" />
  </path>

  <!-- MIND-BLOWING ISOMETRIC HOLOGRAPHIC AI & DATA CORE (Right Side) -->
  <g transform="translate(520, 15)">
    <!-- Outer Glow Aura -->
    <circle cx="120" cy="100" r="85" fill="#00F2FE" opacity="0.08" filter="url(#hyper-glow)" />
    
    <!-- Outer Spinning Hologram Ring (Clockwise) -->
    <circle cx="120" cy="100" r="75" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="12 8 4 8" filter="url(#hyper-glow)">
      <animateTransform attributeName="transform" type="rotate" from="0 120 100" to="360 120 100" dur="12s" repeatCount="indefinite" />
    </circle>

    <!-- Middle Spinning Hologram Ring (Counter-Clockwise) -->
    <circle cx="120" cy="100" r="55" fill="none" stroke="#FF007F" stroke-width="1.5" stroke-dasharray="8 6 2 6" filter="url(#hyper-glow)">
      <animateTransform attributeName="transform" type="rotate" from="360 120 100" to="0 120 100" dur="8s" repeatCount="indefinite" />
    </circle>

    <!-- Inner Spinning Hexagon/Radar (Clockwise) -->
    <polygon points="120,60 154,80 154,120 120,140 86,120 86,80" fill="none" stroke="#34D399" stroke-width="1.2" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0 120 100" to="360 120 100" dur="16s" repeatCount="indefinite" />
    </polygon>

    <!-- Pulsing Hyper Core -->
    <circle cx="120" cy="100" r="14" fill="#00F2FE" filter="url(#hyper-glow)">
      <animate attributeName="r" values="10;18;10" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="120" cy="100" r="6" fill="#FFFFFF" />

    <!-- Radiant Laser Beams Shooting Out -->
    <line x1="120" y1="100" x2="40" y2="40" stroke="#00F2FE" stroke-width="1.2" opacity="0.7" />
    <line x1="120" y1="100" x2="200" y2="40" stroke="#34D399" stroke-width="1.2" opacity="0.7" />
    <line x1="120" y1="100" x2="40" y2="160" stroke="#FF007F" stroke-width="1.2" opacity="0.7" />
    <line x1="120" y1="100" x2="200" y2="160" stroke="#A78BFA" stroke-width="1.2" opacity="0.7" />

    <!-- Pulsing Node Orbs at Beam Tips -->
    <circle cx="40" cy="40" r="5" fill="#00F2FE" filter="url(#hyper-glow)">
      <animate attributeName="r" values="3.5;7;3.5" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="200" cy="40" r="5" fill="#34D399" filter="url(#hyper-glow)">
      <animate attributeName="r" values="3.5;7;3.5" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="40" cy="160" r="5" fill="#FF007F" filter="url(#hyper-glow)">
      <animate attributeName="r" values="3.5;7;3.5" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="200" cy="160" r="5" fill="#A78BFA" filter="url(#hyper-glow)">
      <animate attributeName="r" values="3.5;7;3.5" dur="2.2s" repeatCount="indefinite" />
    </circle>

    <!-- Floating Cyber Data Pills -->
    <g transform="translate(70, 22)">
      <rect width="100" height="18" rx="9" fill="#050814" stroke="#00F2FE" stroke-width="0.9" />
      <text x="50" y="12" fill="#00F2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" font-weight="900" text-anchor="middle" letter-spacing="1">HOLOGRAPHIC AI</text>
    </g>

    <!-- Floating Code Stream Nodes -->
    <text x="120" y="194" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="1.2">DEEP LEARNING &amp; DATA MATRIX</text>
  </g>

  <!-- Left Accent Bar -->
  <rect x="36" y="38" width="6" height="154" rx="3" fill="url(#holo-border-v13)" filter="url(#hyper-glow)" />

  <!-- LEFT CREATIVE TYPOGRAPHY (NO NAME TEXT - FOCUSED ON ML, AI & DATA SCIENCE) -->
  <g transform="translate(58, 42)">
    <!-- Category Pill -->
    <rect width="195" height="24" rx="12" fill="#0F172A" stroke="#00F2FE" stroke-width="1" />
    <text x="14" y="16" fill="#00F2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.8">3RD YEAR B.E. UNDERGRADUATE</text>

    <!-- Headline (CREATIVE HIGH-IMPACT TITLE) -->
    <text x="0" y="70" fill="url(#title-grad-v13)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="29" font-weight="900" letter-spacing="-0.5">
      AI &amp; DATA SCIENCE
    </text>

    <!-- Subtitle -->
    <text x="0" y="102" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">
      Machine Learning • Data Analytics • Intelligent Systems
    </text>

    <!-- Institution Tagline -->
    <text x="0" y="128" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500">
      BMS College of Engineering (BMSCE) • Bengaluru, India
    </text>

    <!-- 4 Mind-Blowing Badges: Machine Learning, Artificial Intelligence, Data Science, Data Analytics -->
    <g transform="translate(0, 146)">
      <rect width="105" height="22" rx="11" fill="#0F172A" stroke="#00F2FE" stroke-width="0.9" />
      <text x="52.5" y="15" fill="#00F2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="800" text-anchor="middle">MACHINE LEARNING</text>

      <rect x="111" width="118" height="22" rx="11" fill="#0F172A" stroke="#34D399" stroke-width="0.9" />
      <text x="170" y="15" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="800" text-anchor="middle">ARTIFICIAL INTEL.</text>

      <rect x="235" width="90" height="22" rx="11" fill="#0F172A" stroke="#FF007F" stroke-width="0.9" />
      <text x="280" y="15" fill="#FF007F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="800" text-anchor="middle">DATA SCIENCE</text>

      <rect x="331" width="100" height="22" rx="11" fill="#0F172A" stroke="#A78BFA" stroke-width="0.9" />
      <text x="381" y="15" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="800" text-anchor="middle">DATA ANALYTICS</text>
    </g>
  </g>

  <!-- Top Right Status Badge -->
  <g transform="translate(575, 16)">
    <rect width="195" height="26" rx="13" fill="#050814" stroke="#00F2FE" stroke-width="1" opacity="0.95" />
    <circle cx="15" cy="13" r="4" fill="#10B981" filter="url(#hyper-glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="27" y="17" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">AI &amp; Data Science Student</text>
  </g>
</svg>
