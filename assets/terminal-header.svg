<svg fill="none" width="800" height="230" viewBox="0 0 800 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <filter id="term-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Main Terminal Window Frame -->
  <rect width="800" height="230" rx="12" fill="url(#term-bg)" stroke="#30363D" stroke-width="1.2" />

  <!-- Terminal Header Bar -->
  <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 788 0 C 794.63 0 800 5.37 800 12 L 800 36 L 0 36 Z" fill="#161B22" stroke="#30363D" stroke-width="1" />

  <!-- macOS Window Controls (Red, Yellow, Green) -->
  <circle cx="20" cy="18" r="6" fill="#FF5F56" />
  <circle cx="38" cy="18" r="6" fill="#FFBD2E" />
  <circle cx="56" cy="18" r="6" fill="#27C93F" />

  <!-- Terminal Title -->
  <text x="400" y="22" fill="#8B949E" font-family="'Fira Code', Monaco, Consolas, monospace" font-size="12" font-weight="500" text-anchor="middle">kathyayini@bmsce: ~/profile</text>

  <!-- Terminal Body Content -->
  <g transform="translate(24, 56)" font-family="'Fira Code', Monaco, 'Courier New', monospace" font-size="13">
    <!-- Command 1 -->
    <text x="0" y="18" fill="#38BDF8" font-weight="700">kathyayini@bmsce:~$ <tspan fill="#F0F6FC">whoami</tspan></text>
    <text x="0" y="38" fill="#34D399" font-weight="600">➜ Kathyayini Prabhu <tspan fill="#94A3B8">| 3rd Year AI &amp; Data Science Student @ BMSCE, Bengaluru</tspan></text>

    <!-- Command 2 -->
    <text x="0" y="70" fill="#38BDF8" font-weight="700">kathyayini@bmsce:~$ <tspan fill="#F0F6FC">cat technical_focus.json</tspan></text>
    <text x="0" y="90" fill="#A78BFA">{ <tspan fill="#38BDF8">"core"</tspan>: <tspan fill="#F0F6FC">["Artificial Intelligence", "SQL Databases", "Data Analytics"]</tspan>, <tspan fill="#38BDF8">"web"</tspan>: <tspan fill="#F0F6FC">["React", "Flask", "Python"]</tspan> }</text>

    <!-- Command 3 -->
    <text x="0" y="122" fill="#38BDF8" font-weight="700">kathyayini@bmsce:~$ <tspan fill="#F0F6FC">status --availability</tspan></text>
    <text x="0" y="142" fill="#F43F5E" font-weight="600">[✓] <tspan fill="#38BDF8">Actively building software solutions &amp; exploring AI/ML opportunities</tspan></text>
  </g>

  <!-- Animated Blinking Cursor -->
  <rect x="520" y="184" width="8" height="15" fill="#38BDF8">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>
</svg>
