<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <!-- Deep Cosmic Cyberpunk Space Gradient -->
    <linearGradient id="se-bg-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040D">
        <animate attributeName="stop-color" values="#02040D;#05091D;#07041A;#02040D" dur="14s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#060A20">
        <animate attributeName="stop-color" values="#060A20;#0B0626;#030E28;#060A20" dur="14s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#01030A">
        <animate attributeName="stop-color" values="#01030A;#030614;#050316;#01030A" dur="14s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Top Neon Border -->
    <linearGradient id="se-top-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="25%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="75%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <!-- Volumetric Radiant Core Gradients -->
    <radialGradient id="se-core-singularity" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#C084FC" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#02040D" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="se-core-corona" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#818CF8" stop-opacity="0.25" />
      <stop offset="75%" stop-color="#C084FC" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#02040D" stop-opacity="0" />
    </radialGradient>

    <!-- Heavy Sci-Fi Glow Filters -->
    <filter id="se-glow-heavy" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="se-glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shell Frame -->
  <rect width="960" height="420" rx="16" fill="url(#se-bg-deep)" stroke="#1E293B" stroke-width="1.6" />
  <rect x="0" y="0" width="960" height="3.5" rx="1.75" fill="url(#se-top-laser)" filter="url(#se-glow-soft)" />

  <!-- Corner Sci-Fi Telemetry Brackets -->
  <g stroke="#38BDF8" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M 18 36 L 18 18 L 36 18" />
    <path d="M 942 36 L 942 18 L 924 18" />
    <path d="M 18 384 L 18 402 L 36 402" />
    <path d="M 942 384 L 942 402 L 924 402" />
  </g>

  <!-- Top Status Telemetry -->
  <g transform="translate(30, 24)">
    <circle cx="4" cy="0" r="4" fill="#00F2FE">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="16" y="4" fill="#00F2FE" font-family="'Fira Code', monospace" font-size="12" font-weight="800" letter-spacing="1">SINGULARITY ENGINE // DEVELOPER ACTIVITY CORE</text>
    <text x="900" y="4" fill="#34D399" font-family="'Fira Code', monospace" font-size="10.5" font-weight="800" text-anchor="end">QUANTUM STREAM: SYNCHRONIZED &#9679;</text>
  </g>
  <line x1="26" y1="42" x2="934" y2="42" stroke="#1E293B" stroke-width="1.2" />

  <!-- Floating Holographic Data Dust Shards (Parallax Depth) -->
  <g fill="#38BDF8" opacity="0.25">
    <polygon points="140,85 147,78 144,92">
      <animateTransform attributeName="transform" type="translate" values="0,0; 6,-10; 0,0" dur="4s" repeatCount="indefinite" />
    </polygon>
    <polygon points="820,95 827,86 824,102">
      <animateTransform attributeName="transform" type="translate" values="0,0; -8,-12; 0,0" dur="5s" repeatCount="indefinite" />
    </polygon>
    <polygon points="200,340 209,332 205,348">
      <animateTransform attributeName="transform" type="translate" values="0,0; 8,8; 0,0" dur="4.5s" repeatCount="indefinite" />
    </polygon>
    <polygon points="780,330 787,321 783,337">
      <animateTransform attributeName="transform" type="translate" values="0,0; -8,9; 0,0" dur="5.5s" repeatCount="indefinite" />
    </polygon>
  </g>

  <!-- ======================================================== -->
  <!-- ORBITAL DEPTH GRAVITATIONAL FLUX RINGS                   -->
  <!-- ======================================================== -->
  <g transform="translate(480, 210)" fill="none" stroke="#1E293B" stroke-width="1.2">
    <!-- Outer Deep Space Orbit (60s rotation) -->
    <ellipse cx="0" cy="0" rx="430" ry="145" stroke-dasharray="6 6" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite" />
    </ellipse>
    <!-- Mid Depth Orbit (45s counter-rotation) -->
    <ellipse cx="0" cy="0" rx="340" ry="115" stroke-dasharray="4 4" opacity="0.5" stroke="#334155">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="45s" repeatCount="indefinite" />
    </ellipse>
    <!-- Inner Gravitational Accretion Orbit (30s rotation) -->
    <ellipse cx="0" cy="0" rx="230" ry="80" stroke-dasharray="3 3" opacity="0.6" stroke="#475569">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite" />
    </ellipse>
  </g>

  <!-- ======================================================== -->
  <!-- QUANTUM PARTICLE STREAMS FLOWING CONTINUOUSLY TO CORE    -->
  <!-- ======================================================== -->

  <!-- Stream 1: BioWeaver -> Core -->
  <path d="M 160 120 Q 300 135 480 210" fill="none" stroke="#00F2FE" stroke-width="2.2" stroke-dasharray="8 6" opacity="0.85" filter="url(#se-glow-soft)">
    <animate attributeName="stroke-dashoffset" values="40;0" dur="1.2s" repeatCount="indefinite" />
  </path>
  <circle r="4" fill="#00F2FE" filter="url(#se-glow-soft)">
    <animateMotion path="M 160 120 Q 300 135 480 210" dur="1.2s" repeatCount="indefinite" />
  </circle>

  <!-- Stream 2: Maritime Risk AI -> Core -->
  <path d="M 800 120 Q 660 135 480 210" fill="none" stroke="#34D399" stroke-width="2.2" stroke-dasharray="8 6" opacity="0.85" filter="url(#se-glow-soft)">
    <animate attributeName="stroke-dashoffset" values="40;0" dur="1.4s" repeatCount="indefinite" />
  </path>
  <circle r="4" fill="#34D399" filter="url(#se-glow-soft)">
    <animateMotion path="M 800 120 Q 660 135 480 210" dur="1.4s" repeatCount="indefinite" />
  </circle>

  <!-- Stream 3: RoadWatch -> Core -->
  <path d="M 860 250 Q 680 240 480 210" fill="none" stroke="#F59E0B" stroke-width="2.2" stroke-dasharray="8 6" opacity="0.85" filter="url(#se-glow-soft)">
    <animate attributeName="stroke-dashoffset" values="40;0" dur="1.3s" repeatCount="indefinite" />
  </path>
  <circle r="4" fill="#F59E0B" filter="url(#se-glow-soft)">
    <animateMotion path="M 860 250 Q 680 240 480 210" dur="1.3s" repeatCount="indefinite" />
  </circle>

  <!-- Stream 4: Smart Attendance -> Core -->
  <path d="M 120 280 Q 280 270 480 210" fill="none" stroke="#818CF8" stroke-width="2.2" stroke-dasharray="8 6" opacity="0.85" filter="url(#se-glow-soft)">
    <animate attributeName="stroke-dashoffset" values="40;0" dur="1.5s" repeatCount="indefinite" />
  </path>
  <circle r="4" fill="#818CF8" filter="url(#se-glow-soft)">
    <animateMotion path="M 120 280 Q 280 270 480 210" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- Stream 5: SmartCane -> Core -->
  <path d="M 730 310 Q 610 280 480 210" fill="none" stroke="#C084FC" stroke-width="2.2" stroke-dasharray="8 6" opacity="0.85" filter="url(#se-glow-soft)">
    <animate attributeName="stroke-dashoffset" values="40;0" dur="1.1s" repeatCount="indefinite" />
  </path>
  <circle r="4" fill="#C084FC" filter="url(#se-glow-soft)">
    <animateMotion path="M 730 310 Q 610 280 480 210" dur="1.1s" repeatCount="indefinite" />
  </circle>

  <!-- ======================================================== -->
  <!-- 5 FLOATING REPOSITORY ENERGY CONSTRUCTS                  -->
  <!-- ======================================================== -->

  <!-- CONSTRUCT 1: BioWeaver -->
  <g transform="translate(160, 120)">
    <circle cx="0" cy="0" r="34" fill="#00F2FE" opacity="0.08">
      <animate attributeName="r" values="30;40;30" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.12;0.04;0.12" dur="3s" repeatCount="indefinite" />
    </circle>
    <ellipse cx="0" cy="0" rx="36" ry="13" fill="none" stroke="#00F2FE" stroke-width="1" stroke-dasharray="3 3" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite" />
    </ellipse>
    <circle cx="0" cy="0" r="23" fill="#0D1117" stroke="#00F2FE" stroke-width="1.8" filter="url(#se-glow-soft)" />
    <!-- DNA Glyph -->
    <path d="M -7 -8 C -2 -3 2 3 7 8 M 7 -8 C 2 -3 -2 3 -7 8 M -4 -4 L 4 -4 M -4 4 L 4 4" stroke="#00F2FE" stroke-width="1.5" fill="none" />
    <!-- HUD Label -->
    <g transform="translate(0, 38)" font-family="'Fira Code', monospace" font-size="8.5" font-weight="700" text-anchor="middle">
      <rect x="-65" y="-10" width="130" height="18" rx="4" fill="#061226" stroke="#00F2FE" stroke-width="0.8" opacity="0.9" />
      <text x="0" y="3" fill="#00F2FE">BIOWEAVER.SYS</text>
    </g>
  </g>

  <!-- CONSTRUCT 2: Maritime Risk AI -->
  <g transform="translate(800, 120)">
    <circle cx="0" cy="0" r="34" fill="#34D399" opacity="0.08">
      <animate attributeName="r" values="30;40;30" dur="3.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.12;0.04;0.12" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <ellipse cx="0" cy="0" rx="36" ry="13" fill="none" stroke="#34D399" stroke-width="1" stroke-dasharray="3 3" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="7s" repeatCount="indefinite" />
    </ellipse>
    <circle cx="0" cy="0" r="23" fill="#0D1117" stroke="#34D399" stroke-width="1.8" filter="url(#se-glow-soft)" />
    <!-- Vessel Glyph -->
    <polygon points="0,-9 7,7 0,4 -7,7" fill="#34D399" />
    <!-- HUD Label -->
    <g transform="translate(0, 38)" font-family="'Fira Code', monospace" font-size="8.5" font-weight="700" text-anchor="middle">
      <rect x="-70" y="-10" width="140" height="18" rx="4" fill="#051D14" stroke="#34D399" stroke-width="0.8" opacity="0.9" />
      <text x="0" y="3" fill="#34D399">MARITIME_RISK.AI</text>
    </g>
  </g>

  <!-- CONSTRUCT 3: RoadWatch -->
  <g transform="translate(860, 250)">
    <circle cx="0" cy="0" r="32" fill="#F59E0B" opacity="0.08">
      <animate attributeName="r" values="28;38;28" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <ellipse cx="0" cy="0" rx="34" ry="12" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3 3" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite" />
    </ellipse>
    <circle cx="0" cy="0" r="21" fill="#0D1117" stroke="#F59E0B" stroke-width="1.8" filter="url(#se-glow-soft)" />
    <!-- Road Grid Glyph -->
    <path d="M -6 7 L -2 -7 M 6 7 L 2 -7 M 0 -4 L 0 4" stroke="#F59E0B" stroke-width="1.2" fill="none" />
    <!-- HUD Label -->
    <g transform="translate(0, 36)" font-family="'Fira Code', monospace" font-size="8.5" font-weight="700" text-anchor="middle">
      <rect x="-60" y="-10" width="120" height="18" rx="4" fill="#1C1004" stroke="#F59E0B" stroke-width="0.8" opacity="0.9" />
      <text x="0" y="3" fill="#F59E0B">ROADWATCH.GEO</text>
    </g>
  </g>

  <!-- CONSTRUCT 4: Smart Attendance -->
  <g transform="translate(120, 280)">
    <circle cx="0" cy="0" r="32" fill="#818CF8" opacity="0.08">
      <animate attributeName="r" values="28;38;28" dur="3.4s" repeatCount="indefinite" />
    </circle>
    <ellipse cx="0" cy="0" rx="34" ry="12" fill="none" stroke="#818CF8" stroke-width="1" stroke-dasharray="3 3" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6.5s" repeatCount="indefinite" />
    </ellipse>
    <circle cx="0" cy="0" r="21" fill="#0D1117" stroke="#818CF8" stroke-width="1.8" filter="url(#se-glow-soft)" />
    <!-- Face Scan Frame Glyph -->
    <rect x="-6" y="-6" width="12" height="12" fill="none" stroke="#818CF8" stroke-width="1.2" />
    <circle cx="0" cy="0" r="2.5" fill="#34D399" />
    <!-- HUD Label -->
    <g transform="translate(0, 36)" font-family="'Fira Code', monospace" font-size="8.5" font-weight="700" text-anchor="middle">
      <rect x="-68" y="-10" width="136" height="18" rx="4" fill="#0F0E2A" stroke="#818CF8" stroke-width="0.8" opacity="0.9" />
      <text x="0" y="3" fill="#818CF8">SMART_ATTENDANCE</text>
    </g>
  </g>

  <!-- CONSTRUCT 5: SmartCane -->
  <g transform="translate(730, 310)">
    <circle cx="0" cy="0" r="32" fill="#C084FC" opacity="0.08">
      <animate attributeName="r" values="28;38;28" dur="2.9s" repeatCount="indefinite" />
    </circle>
    <ellipse cx="0" cy="0" rx="34" ry="12" fill="none" stroke="#C084FC" stroke-width="1" stroke-dasharray="3 3" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7.5s" repeatCount="indefinite" />
    </ellipse>
    <circle cx="0" cy="0" r="21" fill="#0D1117" stroke="#C084FC" stroke-width="1.8" filter="url(#se-glow-soft)" />
    <!-- Cane Sonar Glyph -->
    <path d="M 4 -8 C 4 -12 -3 -12 -3 -8 L -3 8" stroke="#C084FC" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <circle cx="-3" cy="9" r="1.5" fill="#34D399" />
    <!-- HUD Label -->
    <g transform="translate(0, 36)" font-family="'Fira Code', monospace" font-size="8.5" font-weight="700" text-anchor="middle">
      <rect x="-55" y="-10" width="110" height="18" rx="4" fill="#1B072C" stroke="#C084FC" stroke-width="0.8" opacity="0.9" />
      <text x="0" y="3" fill="#C084FC">SMARTCANE.IOT</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- CENTRAL MASSIVE AI SINGULARITY REACTOR CORE              -->
  <!-- ======================================================== -->
  <g transform="translate(480, 210)">
    <!-- Expanding Energy Shockwave 1 -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#00F2FE" stroke-width="1" opacity="0.25">
      <animate attributeName="r" values="65;130;65" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0;0.4" dur="4s" repeatCount="indefinite" />
    </circle>
    <!-- Expanding Energy Shockwave 2 -->
    <circle cx="0" cy="0" r="115" fill="none" stroke="#C084FC" stroke-width="0.8" opacity="0.18">
      <animate attributeName="r" values="85;150;85" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0;0.3" dur="5s" repeatCount="indefinite" />
    </circle>

    <!-- Volumetric Corona Field -->
    <circle cx="0" cy="0" r="90" fill="url(#se-core-corona)">
      <animate attributeName="r" values="82;98;82" dur="3s" repeatCount="indefinite" />
    </circle>

    <!-- Outer Tachyon Accelerator Ring 1 (10s clockwise) -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="#00F2FE" stroke-width="1.6" stroke-dasharray="16 10 4 10" filter="url(#se-glow-soft)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
    </circle>

    <!-- Middle Counter-Rotating Ring 2 (8s counter-clockwise) -->
    <circle cx="0" cy="0" r="56" fill="none" stroke="#C084FC" stroke-width="1.8" stroke-dasharray="12 8 3 8" filter="url(#se-glow-soft)">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite" />
    </circle>

    <!-- Inner High-Velocity Ring 3 (5s clockwise) -->
    <circle cx="0" cy="0" r="44" fill="none" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 6" filter="url(#se-glow-soft)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite" />
    </circle>

    <!-- Glowing Singularity Core Sphere -->
    <circle cx="0" cy="0" r="35" fill="url(#se-core-singularity)" filter="url(#se-glow-heavy)">
      <animate attributeName="r" values="33;37;33" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="22" fill="#050816" stroke="#FFFFFF" stroke-width="1.6" />

    <!-- Center Neural Intelligence Brain Glyph -->
    <path d="M -7 -4 C -7 -8 -2 -10 0 -10 C 2 -10 7 -8 7 -4 C 8 0 5 4 2 6 L 2 9 L -2 9 L -2 6 C -5 4 -8 0 -7 -4 Z" fill="none" stroke="#00F2FE" stroke-width="1.4" />
    <circle cx="0" cy="-2" r="2" fill="#34D399" />
  </g>

  <!-- ======================================================== -->
  <!-- BOTTOM SCI-FI TELEMETRY HUD GAUGE MATRIX                 -->
  <!-- ======================================================== -->
  <g transform="translate(30, 395)" font-family="'Fira Code', monospace" font-size="9" font-weight="700">
    <text x="0" y="0" fill="#64748B">CORE FREQUENCY: <tspan fill="#00F2FE">4.89 GHz</tspan> &#8226; ENTROPY: <tspan fill="#34D399">OPTIMAL</tspan></text>
    <text x="450" y="0" fill="#CBD5E1" text-anchor="middle">5 ORBITING REPOSITORIES // CONTINUOUS CODE SYNTHESIS</text>
    <text x="900" y="0" fill="#64748B" text-anchor="end">SINGULARITY STABILITY: <tspan fill="#00F2FE">99.98% &#10003;</tspan></text>
  </g>
</svg>